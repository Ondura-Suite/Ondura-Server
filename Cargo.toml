[workspace]
resolver = "3"
members = ["crates/wbxml", "crates/server"]
# The fuzz crate needs a nightly toolchain (libFuzzer) and is built on its own.
exclude = ["fuzz"]

[workspace.package]
version = "0.1.6"
edition = "2024"
rust-version = "1.90"
authors = ["Niklas Linz <niklas.linz@mirranet.de>"]
license = "AGPL-3.0-or-later"
homepage = "https://ondura.mirranet.de"
repository = "https://github.com/Ondura-Suite/Ondura-Server"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
