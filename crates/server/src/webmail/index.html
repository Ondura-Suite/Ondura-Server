// ------------------------------------------------------------ COLLAB: OT library
// Operations are arrays of: number>0 retain, number<0 delete, string insert.
// Counting is in UTF-16 units, matching the server exactly.
function oRetain(op, n) { if (n <= 0) return; const l = op[op.length - 1]; if (typeof l === "number" && l > 0) op[op.length - 1] += n; else op.push(n); }
function oDelete(op, n) { if (n <= 0) return; const l = op[op.length - 1]; if (typeof l === "number" && l < 0) op[op.length - 1] -= n; else op.push(-n); }
function oInsert(op, s) {
  if (!s) return; const l = op[op.length - 1];
  if (typeof l === "string") op[op.length - 1] += s;
  else if (typeof l === "number" && l < 0) { const del = op.pop(); const l2 = op[op.length - 1]; if (typeof l2 === "string") op[op.length - 1] += s; else op.push(s); op.push(del); }
  else op.push(s);
}
function cRetain(q, v, m) { if (m < v) q[0] = v - m; else q.shift(); }
function cDelete(q, v, m) { if (m < -v) q[0] = v + m; else q.shift(); }
function cStr(q, s, m) { if (m < s.length) q[0] = s.slice(m); else q.shift(); }
function applyOp(doc, op) { let r = "", i = 0; for (const c of op) { if (typeof c === "string") r += c; else if (c > 0) { r += doc.slice(i, i + c); i += c; } else i += -c; } return r; }
function composeOp(a, b) {
  a = a.slice(); b = b.slice(); const o = [];
  while (a.length || b.length) {
    const x = a[0], y = b[0];
    if (typeof x === "number" && x < 0) { oDelete(o, -x); a.shift(); continue; }
    if (typeof y === "string") { oInsert(o, y); b.shift(); continue; }
    if (x === undefined || y === undefined) throw new Error("compose mismatch");
    if (typeof x === "number" && x > 0 && typeof y === "number" && y > 0) { const m = Math.min(x, y); oRetain(o, m); cRetain(a, x, m); cRetain(b, y, m); }
    else if (typeof x === "number" && x > 0 && typeof y === "number" && y < 0) { const m = Math.min(x, -y); oDelete(o, m); cRetain(a, x, m); cDelete(b, y, m); }
    else if (typeof x === "string" && typeof y === "number" && y > 0) { const m = Math.min(x.length, y); oInsert(o, x.slice(0, m)); cStr(a, x, m); cRetain(b, y, m); }
    else if (typeof x === "string" && typeof y === "number" && y < 0) { const m = Math.min(x.length, -y); cStr(a, x, m); cDelete(b, y, m); }
    else throw new Error("compose bad");
  }
  return o;
}
function transformOp(a, b) {
  a = a.slice(); b = b.slice(); const ap = [], bp = [];
  while (a.length || b.length) {
    const x = a[0], y = b[0];
    if (typeof x === "string") { oInsert(ap, x); oRetain(bp, x.length); a.shift(); continue; }
    if (typeof y === "string") { oRetain(ap, y.length); oInsert(bp, y); b.shift(); continue; }
    if (x === undefined || y === undefined) throw new Error("transform mismatch");
    const xr = x > 0, xd = x < 0, yr = y > 0, yd = y < 0;
    if (xr && yr) { const m = Math.min(x, y); oRetain(ap, m); oRetain(bp, m); cRetain(a, x, m); cRetain(b, y, m); }
    else if (xd && yd) { const m = Math.min(-x, -y); cDelete(a, x, m); cDelete(b, y, m); }
    else if (xd && yr) { const m = Math.min(-x, y); oDelete(ap, m); cDelete(a, x, m); cRetain(b, y, m); }
    else if (xr && yd) { const m = Math.min(x, -y); oDelete(bp, m); cRetain(a, x, m); cDelete(b, y, m); }
    else throw new Error("transform bad");
  }
  return [ap, bp];
}
function diffOp(a, b) {
  if (a === b) return null;
  let p = 0; const minL = Math.min(a.length, b.length);
  while (p < minL && a[p] === b[p]) p++;
  let s = 0;
  while (s < minL - p && a[a.length - 1 - s] === b[b.length - 1 - s]) s++;
  const del = a.length - p - s, ins = b.slice(p, b.length - s);
  const op = []; oRetain(op, p); if (del > 0) oDelete(op, del); if (ins) oInsert(op, ins); oRetain(op, s);
  return op;
}
function transformCursor(pos, op) {
  let res = pos, i = 0;
  for (const c of op) {
    if (typeof c === "string") { if (i < pos) res += c.length; }
    else if (c > 0) i += c;
    else { const d = -c; if (i < pos) res -= Math.min(d, pos - i); i += d; }
  }
  return Math.max(0, res);
}

// ------------------------------------------------------------ DOCUMENTS
let curDoc = null, docWs = null;
// Things the open editor wants to hear about: the text changed, the comments changed.
const docHooks = { onText: null, onComments: null };
function connectDoc(id, canWrite, linkToken) {
  if (docWs) { try { docWs.close(); } catch (e) {} }
  const proto = location.protocol === "https:" ? "wss" : "ws";
  const q = `doc=${id}` + (linkToken ? `&link=${encodeURIComponent(linkToken)}` : "");
  const ws = new WebSocket(`${proto}://${location.host}/collab/ws?${q}`);
  docWs = ws;
  const ta = $("#docArea");
  const E = { ws, rev: 0, docText: "", state: "sync", pending: null, buffer: null, applying: false, canWrite };
  const remote = {}; // conn id -> { pos, name, color, ts }
  const setStatus = (live) => { const s = $("#docStatus"); if (s) s.innerHTML = `<span class="${live ? "dot-live" : "dot-off"}"></span>${live ? esc(t("online")) : esc(t("connecting"))}`; };
  function caretXY(pos) {
    const mir = $("#docMirror"); if (!mir) return { x: 0, y: 0 };
    mir.textContent = E.docText.slice(0, pos);
    const span = document.createElement("span"); span.textContent = "​"; mir.appendChild(span);
    const x = span.offsetLeft, y = span.offsetTop; mir.textContent = "";
    return { x, y };
  }
  function renderCursors() {
    const cont = $("#docCursors"); if (!cont || !ta) return;
    const now = Date.now(); const html = [];
    for (const [by, c] of Object.entries(remote)) {
      if (now - c.ts > 9000) { delete remote[by]; continue; }
      const { x, y } = caretXY(Math.min(c.pos, E.docText.length));
      html.push(`<div class="rc" style="left:${x}px;top:${y - ta.scrollTop}px;background:${esc(c.color)}"><span class="lbl" style="background:${esc(c.color)}">${esc(c.name)}</span></div>`);
    }
    cont.innerHTML = html.join("");
  }
  let curTimer;
  const sendCursor = () => { if (ws.readyState === 1 && ta) ws.send(JSON.stringify({ type: "cursor", pos: ta.selectionStart, anchor: ta.selectionEnd })); };
  const queueCursor = () => { clearTimeout(curTimer); curTimer = setTimeout(sendCursor, 120); };
  ws.onclose = () => setStatus(false);
  ws.onerror = () => setStatus(false);
  ws.onmessage = (ev) => {
    const m = JSON.parse(ev.data);
    if (m.type === "init") {
      E.rev = m.rev; E.docText = m.content; if (ta) { E.applying = true; ta.value = m.content; E.applying = false; } setStatus(true);
      if (docHooks.onText) docHooks.onText();
    } else if (m.type === "ack") {
      E.rev = m.rev;
      if (E.state === "await") { E.pending = null; E.state = "sync"; }
      else if (E.state === "awaitBuf") { E.pending = E.buffer; E.buffer = null; E.state = "await"; ws.send(JSON.stringify({ type: "op", rev: E.rev, op: E.pending })); }
    } else if (m.type === "op") {
      E.rev = m.rev;
      let toApply;
      if (E.state === "sync") toApply = m.op;
      else if (E.state === "await") { const [pp, o1] = transformOp(E.pending, m.op); E.pending = pp; toApply = o1; }
      else { const [pp, o1] = transformOp(E.pending, m.op); const [bb, o2] = transformOp(E.buffer, o1); E.pending = pp; E.buffer = bb; toApply = o2; }
      // shift remote carets through the applied change
      for (const c of Object.values(remote)) c.pos = transformCursor(c.pos, toApply);
      if (ta) {
        const a = ta.selectionStart, b = ta.selectionEnd;
        E.applying = true; const nv = applyOp(E.docText, toApply); ta.value = nv; E.docText = nv;
        ta.selectionStart = transformCursor(a, toApply); ta.selectionEnd = transformCursor(b, toApply); E.applying = false;
      } else { E.docText = applyOp(E.docText, toApply); }
      renderCursors();
      if (docHooks.onText) docHooks.onText(true);
    } else if (m.type === "presence") {
      const box = $("#docPres"); if (box) box.innerHTML = (m.users || []).slice(0, 6).map((u) => `<span class="av" title="${esc(u.name)}" style="background:${esc(u.color)}">${esc((u.name || "?").trim()[0] || "?").toUpperCase()}</span>`).join("");
    } else if (m.type === "comments") {
      if (docHooks.onComments) docHooks.onComments();
    } else if (m.type === "cursor") {
      remote[m.by] = { pos: m.pos || 0, name: m.name || "", color: m.color || "#888", ts: Date.now() };
      renderCursors();
    } else if (m.type === "reset") {
      // The server signalled a desync (we lagged); reconnect for a fresh state.
      try { ws.close(); } catch (e) {}
      if (curDoc === id) connectDoc(id, canWrite, linkToken);
    }
  };
  if (ta) {
    const cursorEvents = () => queueCursor();
    ta.addEventListener("keyup", cursorEvents);
    ta.addEventListener("pointerup", cursorEvents);
    ta.addEventListener("focus", cursorEvents);
    ta.addEventListener("scroll", renderCursors);
  }
  if (ta && canWrite) {
    ta.oninput = () => {
      if (E.applying) return;
      const op = diffOp(E.docText, ta.value); E.docText = ta.value;
      if (docHooks.onText) docHooks.onText();
      if (!op) return;
      for (const c of Object.values(remote)) c.pos = transformCursor(c.pos, op);
      if (E.state === "sync") { E.pending = op; E.state = "await"; ws.send(JSON.stringify({ type: "op", rev: E.rev, op })); }
      else if (E.state === "await") { E.buffer = op; E.state = "awaitBuf"; }
      else { E.buffer = composeOp(E.buffer, op); }
      renderCursors(); queueCursor();
    };
  }
}

    $("#shLinks").querySelectorAll("[data-perm]").forEach((s) => s.onchange = guard(async () => { await capi("POST", "/docs/" + id + "/link/update", { token: s.dataset.perm, canWrite: s.value === "write" }); }));
    $("#shLinks").querySelectorAll("[data-lrm]").forEach((b) => b.onclick = guard(async () => { await capi("POST", "/docs/" + id + "/link/revoke", { token: b.dataset.lrm }); refresh(); }));
  };
  const refresh = async () => { const m = await capi("GET", "/docs/" + id); renderLinks(m.links || []); renderList(m.shares || []); };
  renderLinks(meta.links || []);
  renderList(meta.shares || []);
  $("#shLinkAdd").onclick = guard(async () => { await capi("POST", "/docs/" + id + "/link", { canWrite: $("#shLinkPerm").value === "write" }); refresh(); });
  $("#shAdd").onclick = guard(async () => { const email = $("#shEmail").value.trim(); if (!email) return; await capi("POST", "/docs/" + id + "/share", { email, canWrite: $("#shPerm").value === "write" }); $("#shEmail").value = ""; refresh(); });

}

function itemShareUrl(token) { return `${location.origin}/mail#s=${token}`; }
// Share a file or folder with a link anyone can open (guests included), as view
// or edit, optionally with an expiry.
function openItemShare(it) {

// Version history for a file: list previous versions with restore and download.
function openVersions(it) {

// ------------------------------------------------------------ FILES (cloud)
let fs = { drives: [], driveId: null, parent: null, path: [], items: [], role: "owner", canWrite: true };

function openMenu(ev, items) {
  closeMenu();
  items = items.filter(Boolean);
  const m = document.createElement("div"); m.id = "ctxMenu"; m.className = "glass";
  m.style.cssText = `position:fixed;top:${Math.min(ev.clientY, innerHeight - 40 - items.length * 38)}px;left:${Math.min(ev.clientX, innerWidth - 230)}px;z-index:70;min-width:200px;padding:6px`;

  document.body.appendChild(m);
  m.querySelectorAll("[data-i]").forEach((el) => el.onclick = guard(async () => { const fn = items[+el.dataset.i].fn; closeMenu(); await fn(); }));

function fmtSize(n) { if (n < 1024) return n + " B"; if (n < 1048576) return (n / 1024).toFixed(1) + " KB"; if (n < 1073741824) return (n / 1048576).toFixed(1) + " MB"; return (n / 1073741824).toFixed(1) + " GB"; }

// Serves both the Files app (personal drive, OneDrive-style) and the SharePoint
// app (shared libraries), depending on `view`.
async function renderFiles() {
  if (!fs.drives.length) { try { const r = await api("GET", "/cloud/drives"); fs.drives = r.drives || []; } catch (e) { fs.drives = []; } }
  if (fs.trashView) return renderTrash();
  if (fs.recentView && view === "files") { renderRail(); return renderRecent(); }
  if (fs.sharedView && view === "files") { renderRail(); return renderSharedWithMe(); }
  // A folder someone was given access to in a library they aren't a member
  // of (from "Shared with me") is browsed inside that library.
  if (fs.grant && (view !== "sharepoint" || fs.driveId !== fs.grant.drive)) fs.grant = null;
  if (view === "files") {
    const personal = fs.drives.find((d) => d.kind === "personal");
    fs.driveId = personal ? personal.id : null;
  } else if (!fs.grant) {
    const libs = fs.drives.filter((d) => d.kind === "library");
    // A link to a folder in a library the account isn't a member of opens
    // that folder, if it was given access to it.
    if (fs.driveId && fs.parent && !libs.some((d) => d.id === fs.driveId)) fs.grant = { drive: fs.driveId, item: fs.parent, driveName: t("sharepoint") };
    else if (!fs.driveId || !libs.some((d) => d.id === fs.driveId)) fs.driveId = libs.length ? libs[0].id : null;
  }
  if (fs.grant && !fs.parent) fs.parent = fs.grant.item;
  let data = { items: [], path: [], role: "viewer", canWrite: false };
  if (fs.driveId) { try { data = await api("GET", `/cloud/items?drive=${fs.driveId}` + (fs.parent ? `&parent=${fs.parent}` : "")); } catch (e) {} }
  fs.items = data.items || []; fs.path = data.path || []; fs.role = data.role || "viewer"; fs.canWrite = !!data.canWrite;
  fs.columns = data.columns || []; fs.canManage = !!data.canManage; fs.libOwner = !!data.libraryOwner; fs.requireApproval = !!data.requireApproval;
  const drive = fs.drives.find((d) => d.id === fs.driveId) || (fs.grant ? { id: fs.grant.drive, kind: "library", name: fs.grant.driveName, role: "" } : null);
  fs.isLibrary = !!drive && drive.kind === "library";
  // Keep the URL in step so the current library/folder can be linked.
  history.replaceState({}, "", appPath(view, { drive: view === "sharepoint" ? fs.driveId : null, parent: fs.parent }));
  const driveName = (d) => d.kind === "personal" ? t("myFiles") : d.name;
  const rootName = drive ? driveName(drive) : (view === "sharepoint" ? t("sharepoint") : t("myFiles"));
  const tools = fs.canWrite ? `<button class="btn" id="fNewFolder">${icon("folder")}<span>${esc(t("newFolder"))}</span></button>
    <button class="btn" id="fNewDoc">${icon("doc")}<span>${esc(t("newDocument"))}</span></button>
    <button class="btn" id="fUpload">${icon("paperclip")}<span>${esc(t("upload"))}</span></button>
    <input type="file" id="fFile" multiple style="display:none">` : "";
  const member = fs.isLibrary && !fs.grant;
  const memBtn = member ? `<button class="btn" id="fMembers">${icon("contacts")}<span>${esc(t("members"))}</span></button>` : "";
  const linkBtn = member ? `<button class="btn" id="fLink">${icon("link")}<span>${esc(t("copyLink"))}</span></button>` : "";
  const libShareBtn = member && fs.libOwner ? `<button class="btn" id="fShareLib">${icon("share")}<span>${esc(t("shareLibrary"))}</span></button>` : "";
  const colBtn = member && fs.libOwner ? `<button class="btn" id="fColumns">${icon("settings")}<span>${esc(t("librarySettings"))}</span></button>` : "";
  const accessBtn = fs.isLibrary && fs.parent && fs.canManage ? `<button class="btn" id="fAccess">${icon("lock")}<span>${esc(t("manageAccess"))}</span></button>` : "";
  const delLibBtn = drive && drive.kind === "library" && fs.role === "owner" ? `<button class="btn" id="fDelLib">${icon("trash")}<span>${esc(t("deleteLibrary"))}</span></button>` : "";
  const trashBtn = fs.canWrite && !fs.grant ? `<button class="btn" id="fTrash">${icon("trash")}<span>${esc(t("recycleBin"))}</span></button>` : "";
  const crumbs = `<button style="background:none;border:0;color:var(--muted);cursor:pointer;padding:0;font-size:13px" data-crumb="${fs.grant ? fs.grant.item : ""}">${esc(rootName)}</button>`
    + fs.path.map((p) => `<span style="color:var(--muted)">/</span><button style="background:none;border:0;color:var(--muted);cursor:pointer;padding:0;font-size:13px" data-crumb="${p.id}">${esc(p.name)}</button>`).join("");
  // Sorting and, in libraries with columns, filtering by a column value.
  const cols = fs.columns || [];
  if (fs.filter && !cols.some((c) => String(c.id) === fs.filter.split(":")[0])) fs.filter = "";
  const shown = sortFilterItems(fs.items);
  const sortOpts = [["name", t("sortName")], ["modified", t("sortModified")], ["size", t("sortSize")]].concat(cols.map((c) => ["c" + c.id, c.name]));
  const filterOpts = [];
  for (const c of cols) {
    const vals = [...new Set(fs.items.map((it) => it.fields && it.fields[c.id]).filter((v) => v != null && v !== ""))].sort();
    for (const v of vals) filterOpts.push([`${c.id}:${v}`, `${c.name}: ${fieldText(c, v)}`]);
  }
  const viewCtl = `<span style="flex:1"></span>
    ${filterOpts.length || fs.filter ? `<select id="fFilter" style="width:auto;height:28px;font-size:12.5px"><option value="">${esc(t("filterAllItems"))}</option>${filterOpts.map(([v, l]) => `<option value="${esc(v)}" ${fs.filter === v ? "selected" : ""}>${esc(l)}</option>`).join("")}</select>` : ""}
    <select id="fSort" style="width:auto;height:28px;font-size:12.5px">${sortOpts.map(([v, l]) => `<option value="${esc(v)}" ${(fs.sort || "name") === v ? "selected" : ""}>${esc(t("sortBy"))} ${esc(l)}</option>`).join("")}</select>`;
  const rows = shown.length
    ? shown.map((it) => fileRow(it, false)).join("")
    : `<div class="empty">${esc(t("emptyFolder"))}</div>`;
  $("#view").innerHTML = `<div style="display:flex;flex-direction:column;height:100%">
    <div class="glass" style="display:flex;gap:8px;align-items:center;padding:10px 16px;flex-wrap:wrap;border-radius:0">
      <h2 style="font-size:16px;margin:0">${esc(rootName)}</h2>
      <input id="fSearch" placeholder="${esc(t("searchFiles"))}" style="flex:1;min-width:120px;height:32px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);padding:0 10px">
      <div style="display:flex;gap:6px;flex-wrap:wrap">${tools}${accessBtn}${linkBtn}${libShareBtn}${colBtn}${memBtn}${trashBtn}${delLibBtn}</div>
    </div>
    <div id="fCrumbs" style="display:flex;gap:4px;align-items:center;padding:8px 16px;font-size:13px;flex-wrap:wrap">${crumbs}${viewCtl}</div>
    <div id="fRows" style="flex:1;overflow:auto;padding:0 10px 16px">${rows}</div></div>`;
  wireFileRows();
  const sb = $("#fSearch");
  if (sb) sb.oninput = () => { clearTimeout(fs.searchTimer); const q = sb.value.trim(); fs.searchTimer = setTimeout(() => doFileSearch(q), 220); };
  const so = $("#fSort"); if (so) so.onchange = () => { fs.sort = so.value; renderFiles(); };
  const fl = $("#fFilter"); if (fl) fl.onchange = () => { fs.filter = fl.value; renderFiles(); };
  $("#view").querySelectorAll("[data-crumb]").forEach((b) => b.onclick = () => { fs.parent = b.dataset.crumb ? +b.dataset.crumb : null; renderFiles(); });
  const nf = $("#fNewFolder"); if (nf) nf.onclick = guard(async () => { const name = prompt(t("folderName")); if (!name) return; await api("POST", "/cloud/folder", { drive: fs.driveId, parent: fs.parent, name: name.trim() }); renderFiles(); });
  const nd = $("#fNewDoc"); if (nd) nd.onclick = guard(async () => { const name = prompt(t("newDocument")); if (name === null) return; const r = await api("POST", "/cloud/doc", { drive: fs.driveId, parent: fs.parent, name: (name || "").trim() || t("newDocument") }); openDriveDoc(r.doc); });
  const up = $("#fUpload"); const fi = $("#fFile"); if (up && fi) { up.onclick = () => fi.click(); fi.onchange = () => uploadFiles(fi.files); }
  const mb = $("#fMembers"); if (mb) mb.onclick = () => openMembers(fs.driveId);
  const lb = $("#fLink"); if (lb) lb.onclick = () => { const url = location.origin + appPath("sharepoint", { drive: fs.driveId }); if (navigator.clipboard) navigator.clipboard.writeText(url); toast(t("copied")); };
  const dl = $("#fDelLib"); if (dl) dl.onclick = guard(async () => { if (!confirm(t("confirmDeleteLibrary"))) return; await api("POST", "/cloud/library/delete", { drive: fs.driveId }); fs.drives = []; fs.driveId = null; fs.parent = null; navTo("sharepoint"); });
  const tb = $("#fTrash"); if (tb) tb.onclick = () => { fs.trashView = true; renderFiles(); };
  const sl = $("#fShareLib"); if (sl) sl.onclick = () => openLibraryShare(fs.driveId);
  const cb = $("#fColumns"); if (cb) cb.onclick = () => openColumns(fs.driveId);
  const ab = $("#fAccess"); if (ab) ab.onclick = () => openAccess({ id: fs.parent, name: (fs.path[fs.path.length - 1] || {}).name || "" });
  // Refresh the left nav (libraries) now that they are loaded.
  if (view === "sharepoint") renderRail();
}

// The current folder's items in the chosen order (folders first), narrowed to
// the chosen column value.
function sortFilterItems(items) {
  let list = items.slice();
  if (fs.filter) {
    const i = fs.filter.indexOf(":"); const col = fs.filter.slice(0, i); const val = fs.filter.slice(i + 1);
    list = list.filter((it) => it.fields && it.fields[col] === val);
  }
  const key = fs.sort || "name";
  const col = key.startsWith("c") ? (fs.columns || []).find((c) => "c" + c.id === key) : null;
  const byName = (a, b) => a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: "base" });
  const cmp = (a, b) => {
    if (key === "modified") return b.updated - a.updated || byName(a, b);
    if (key === "size") return b.size - a.size || byName(a, b);
    if (col) {
      const va = a.fields && a.fields[col.id], vb = b.fields && b.fields[col.id];
      if (va == null && vb == null) return byName(a, b);
      if (va == null) return 1; if (vb == null) return -1;
      const r = col.kind === "number" ? (+va - +vb) : col.kind === "choice" ? col.choices.indexOf(va) - col.choices.indexOf(vb) : String(va).localeCompare(String(vb));
      return r || byName(a, b);
    }
    return byName(a, b);
  };
  const folders = list.filter((x) => x.kind === "folder").sort(cmp);
  return folders.concat(list.filter((x) => x.kind !== "folder").sort(cmp));
}

// Attach open/menu handlers to the rows currently in #fRows against fs.items.
function wireFileRows() {
  $("#fRows").querySelectorAll("[data-open]").forEach((el) => el.onclick = () => openItem(fs.items.find((x) => x.id === +el.dataset.open)));
  $("#fRows").querySelectorAll("[data-menu]").forEach((el) => el.onclick = (ev) => { ev.stopPropagation(); itemMenu(ev, fs.items.find((x) => x.id === +el.dataset.menu)); });
}

// Render the markup for one item row (shared by the listing and search results).
function fileRow(it, showLoc) {
  const ic = it.kind === "folder" ? "folder" : it.kind === "doc" ? "doc" : "paperclip";
  const meta = it.kind === "file" ? fmtSize(it.size) : (it.kind === "doc" ? t("documents") : "");
  const loc = showLoc ? `<div style="font-size:11px;color:var(--muted)">${esc(it.driveKind === "personal" ? t("myFiles") : (it.driveName || ""))}</div>` : "";
  const badges = [];
  if (it.restricted) badges.push(`<span title="${esc(t("restrictedFolder"))}" style="display:inline-flex;vertical-align:-3px;color:var(--muted)">${icon("lock")}</span>`);
  const ap = it.approval && it.approval.status !== "approved" ? `<div style="font-size:11px;color:${it.approval.status === "rejected" ? "var(--danger)" : "var(--muted)"}">${esc(it.approval.status === "rejected" ? t("approvalRejected") + (it.approval.note ? ": " + it.approval.note : "") : t("approvalPending"))}</div>` : "";
  const co = it.checkedOut ? `<div style="font-size:11px;color:var(--accent)">${esc(it.checkedOut.mine ? t("checkedOutByYou") : `${t("checkedOutBy")} ${it.checkedOut.name || it.checkedOut.email}`)}</div>` : "";
  const fv = (fs.columns || []).filter((c) => it.fields && it.fields[c.id] != null).map((c) => `${esc(c.name)}: ${esc(fieldText(c, it.fields[c.id]))}`).join(" · ");
  const fields = fv && !showLoc ? `<div style="font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${fv}</div>` : "";
  return `<div class="taskrow" data-open="${it.id}" style="cursor:pointer"><div style="color:var(--muted);display:flex">${icon(ic)}</div><div class="tt" style="flex:1;min-width:0"><div style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(it.name)} ${badges.join("")}</div>${loc}${co}${ap}${fields}</div><div style="font-size:11.5px;color:var(--muted)">${esc(meta)}</div><button class="iconbtn" data-menu="${it.id}">${icon("dots")}</button></div>`;
}

// Search across the user's drives; results replace the file rows in place.
async function doFileSearch(q) {
  const box = $("#fRows"); if (!box) return;
  if (!q) { fs.search = false; renderFiles(); return; }
  fs.search = true;
  let items = [];
  try { items = (await api("GET", "/cloud/search?q=" + encodeURIComponent(q))).items || []; } catch (e) {}
  fs.items = items;
  box.innerHTML = items.length ? items.map((it) => fileRow(it, true)).join("") : `<div class="empty">${esc(t("noResults"))}</div>`;
  const cr = $("#fCrumbs"); if (cr) cr.style.display = "none";
  wireFileRows();
}

// The recycle bin for the current drive: trashed items with restore and
// permanent-delete actions, matching the behaviour of SharePoint/OneDrive.
async function renderTrash() {
  let items = [];
  if (fs.driveId) { try { const r = await api("GET", `/cloud/trash?drive=${fs.driveId}`); items = r.items || []; } catch (e) {} }
  const rows = items.length
    ? items.map((it) => {
      const ic = it.kind === "folder" ? "folder" : it.kind === "doc" ? "doc" : "paperclip";
      const meta = it.kind === "file" ? fmtSize(it.size) : (it.kind === "doc" ? t("documents") : "");
      return `<div class="taskrow"><div style="color:var(--muted);display:flex">${icon(ic)}</div><div class="tt" style="flex:1;min-width:0"><div style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(it.name)}</div></div><div style="font-size:11.5px;color:var(--muted)">${esc(meta)}</div><button class="btn" data-restore="${it.id}">${esc(t("restore"))}</button><button class="iconbtn" data-purge="${it.id}">${icon("trash")}</button></div>`;
    }).join("")
    : `<div class="empty">${esc(t("binEmpty"))}</div>`;
  const emptyBtn = items.length ? `<button class="btn" id="fEmptyBin">${icon("trash")}<span>${esc(t("emptyBin"))}</span></button>` : "";

// Recently updated files and documents across the personal drive and libraries.

function openItem(it) {
  if (!it) return;
  // A search result may live in another drive; switch to it first.
  if (it.driveId && it.driveId !== fs.driveId) {
    fs.search = false;
    if (it.driveKind === "library") { view = "sharepoint"; fs.driveId = it.driveId; }
    else { view = "files"; fs.driveId = null; }
    fs.parent = null;
  }
  if (it.kind === "folder") { fs.parent = it.id; fs.search = false; renderFiles(); }
  else if (it.kind === "doc") openDriveDoc(it.doc);
  else if (canPreview(it.contentType)) previewItem(it);
  else downloadItem(it);
}

// A lightweight preview for images, PDFs and text, with a download fallback.
function previewItem(it) {
  const url = "/mail/api/cloud/download/" + it.id;
  const body = previewHtml(it.contentType, url, it.name);
  panel(it.name,
    `<div style="margin:-4px 0 0">${body}</div>`,
    `<div style="flex:1"></div><a class="btn" href="${esc(url)}" download style="text-decoration:none">${icon("inbox")}<span>${esc(t("download"))}</span></a><button class="btn primary" id="pvClose">${esc(t("close") || t("cancel"))}</button>`);
  const c = $("#pvClose"); if (c) c.onclick = closePanel;
}

function openDriveDoc(docId) { openCloudDoc(docId); }

// A collaborative document now lives only inside the cloud; open it in a
// focused editor reached from Files (no separate Documents section).
async function openCloudDoc(id) {
  const back = (view === "sharepoint") ? "sharepoint" : "files";
  curDoc = id;
  let meta;
  try { meta = await capi("GET", "/docs/" + id); } catch (e) { toast(e.message, true); return; }
  view = "docview"; document.getElementById("app").classList.add("norail"); $("#rail").innerHTML = "";
  // Compose and mail search belong to the Mail app.
  $("#composeBtn").style.display = "none";
  const sb = document.querySelector(".search"); if (sb) sb.style.display = "none";
  const shareBtn = meta.owned ? `<button class="btn" id="docShare">${icon("share")}<span>${esc(t("share"))}</span></button>` : "";
  const fmt = [["bold", "B", "**"], ["italic", "I", "*"], ["code", "</>", "`"], ["h", "H", ""], ["ul", "•", ""], ["ol", "1.", ""], ["quote", "❝", ""], ["link", "🔗", ""]];
  const toolbar = meta.canWrite ? `<div class="rte-toolbar doctb">${fmt.map(([k, l]) => `<button type="button" data-fmt="${k}" title="${esc(t("fmt_" + k))}">${esc(l)}</button>`).join("")}</div>` : "";
  $("#view").innerHTML = `<div class="editor" id="docEditor" style="height:100%">
    <div class="eh"><button class="iconbtn" id="docBack" title="${esc(t("files"))}">${icon("folder")}</button><h2 id="docTitle" style="flex:1">${esc(meta.name)}</h2><div class="pres" id="docPres"></div><span class="status" id="docStatus"><span class="dot-off"></span>${esc(t("connecting"))}</span>
      <button class="btn" id="docPrevBtn">${esc(t("preview"))}</button><button class="btn" id="docComBtn">${icon("note")}<span>${esc(t("comments"))}</span><span id="docComCt" class="ct"></span></button>
      <button class="iconbtn" id="docExport" title="${esc(t("export"))}">${icon("inbox")}</button><button class="iconbtn" id="docHist" title="${esc(t("history"))}">${icon("clock")}</button>${shareBtn}</div>
    ${toolbar}
    <div class="docbody"><div class="editorwrap"><div class="mirror" id="docMirror" aria-hidden="true"></div><textarea id="docArea" ${meta.canWrite ? "" : "readonly"} spellcheck="false"></textarea><div class="cursors" id="docCursors"></div></div>
      <div class="docprev md hidden" id="docPrev"></div>
      <aside class="doccom hidden" id="docCom"></aside></div>
    ${meta.canWrite ? "" : `<div style="padding:6px 16px;color:var(--muted);font-size:12.5px;border-top:1px solid var(--border)">${esc(t("readOnlyDoc"))}</div>`}`;
  $("#docBack").onclick = () => { if (docWs) { try { docWs.close(); } catch (e) {} } docHooks.onText = docHooks.onComments = null; curDoc = null; view = back; history.pushState({}, "", appPath(back, { drive: fs.driveId, parent: fs.parent })); render(); };
  if ($("#docShare")) $("#docShare").onclick = () => openShare(id, meta);
  $("#docHist").onclick = () => openHistory(id);
  $("#docExport").onclick = (ev) => { ev.stopPropagation(); const go = (f) => () => { location.href = `/collab/api/docs/${id}/export?format=${f}`; };
    openMenu(ev, [{ ic: "doc", label: t("exportWord"), fn: go("docx") }, { ic: "doc", label: t("exportMd"), fn: go("md") }, { ic: "doc", label: t("exportHtml"), fn: go("html") }, { ic: "doc", label: t("exportTxt"), fn: go("txt") }]); };
  wireDocExtras(id, meta);
  connectDoc(id, meta.canWrite);
}

// Formatting, preview and comments around the collaborative editor.
function wireDocExtras(id, meta) {
  const ta = $("#docArea");
  // Formatting buttons rewrite the selection in Markdown and let the normal
  // input handling turn the change into an edit for everyone.
  const edit = (from, to, text, selFrom, selTo) => {
    ta.focus(); ta.setRangeText(text, from, to, "end");
    if (selFrom != null) ta.setSelectionRange(selFrom, selTo);
    ta.dispatchEvent(new Event("input"));
  };
  const lineStart = (pos) => ta.value.lastIndexOf("\n", pos - 1) + 1;
  const prefixLines = (fn) => {
    const a = lineStart(ta.selectionStart), b = ta.selectionEnd;
    const lines = ta.value.slice(a, b).split("\n");
    const out = lines.map(fn).join("\n");
    edit(a, b, out, a, a + out.length);
  };
  document.querySelectorAll("[data-fmt]").forEach((btn) => btn.onmousedown = (e) => {
    e.preventDefault();
    const k = btn.dataset.fmt, a = ta.selectionStart, b = ta.selectionEnd, sel = ta.value.slice(a, b);
    const wrap = (m) => { const inner = sel || t("fmt_" + k); edit(a, b, m + inner + m, a + m.length, a + m.length + inner.length); };
    if (k === "bold") wrap("**"); else if (k === "italic") wrap("*"); else if (k === "code") wrap("`");
    else if (k === "h") prefixLines((l) => { const m = l.match(/^(#{1,5}) /); return m ? "#" + l : l.startsWith("###### ") ? l.slice(7) : "## " + l; });
    else if (k === "ul") prefixLines((l) => l.startsWith("- ") ? l.slice(2) : "- " + l);
    else if (k === "ol") { let n = 0; prefixLines((l) => /^\d+\. /.test(l) ? l.replace(/^\d+\. /, "") : `${++n}. ${l}`); }
    else if (k === "quote") prefixLines((l) => l.startsWith("> ") ? l.slice(2) : "> " + l);
    else if (k === "link") { const url = prompt(t("linkUrl") || "URL", "https://"); if (!url) return; const text = sel || url; edit(a, b, `[${text}](${url})`, a + 1, a + 1 + text.length); }
  });

  // Preview: rendered by the server (the same renderer as the export).
  const prev = $("#docPrev");
  let prevTimer;
  const renderPreview = async () => {
    if (prev.classList.contains("hidden")) return;
    try { const r = await capi("POST", "/render", { text: ta.value }); prev.innerHTML = r.html || `<p style="color:var(--muted)">${esc(t("emptyDoc"))}</p>`; } catch (e) {}
  };
  $("#docPrevBtn").onclick = () => { prev.classList.toggle("hidden"); $("#docPrevBtn").classList.toggle("on", !prev.classList.contains("hidden")); renderPreview(); };

  // Comments: threads anchored to text, with replies; click one to select it.
  const box = $("#docCom");
  let comments = [], showResolved = false, comTimer;
  const loadComments = async () => {
    try { comments = (await capi("GET", `/docs/${id}/comments`)).comments || []; } catch (e) { return; }
    const open = comments.filter((c) => !c.parent_id && !c.resolved).length;
    $("#docComCt").textContent = open ? String(open) : "";
    drawComments();
  };
  const drawComments = () => {
    if (box.classList.contains("hidden")) return;
    const threads = comments.filter((c) => !c.parent_id && (showResolved || !c.resolved));
    const replies = (tid) => comments.filter((c) => c.parent_id === tid);
    const one = (c, reply) => `<div class="cm${reply ? " reply" : ""}"><div class="cmh"><b>${esc(c.author)}</b><span>${esc(fmtShort(c.created))}</span>${c.email === me.email || meta.owned ? `<button class="iconbtn" data-cdel="${c.id}" title="${esc(t("delete"))}">${icon("trash")}</button>` : ""}</div><div class="cmb">${esc(c.body)}</div></div>`;
    box.innerHTML = `<div class="cmtop"><b>${esc(t("comments"))}</b><label><input type="checkbox" id="cmShowRes" ${showResolved ? "checked" : ""}> ${esc(t("showResolved"))}</label></div>
      <div class="cmnew"><textarea id="cmText" rows="2" placeholder="${esc(t("commentHint"))}"></textarea><button class="btn primary" id="cmAdd">${esc(t("addComment"))}</button></div>
      ${threads.length ? threads.map((c) => `<div class="cmthread${c.resolved ? " resolved" : ""}" data-cjump="${c.id}">
        ${c.quote ? `<div class="cmq">${esc(c.quote)}</div>` : ""}${one(c, false)}${replies(c.id).map((r) => one(r, true)).join("")}
        <div class="cmact"><input data-creply="${c.id}" placeholder="${esc(t("replyHint"))}"><button class="btn" data-cres="${c.id}" data-val="${c.resolved ? 0 : 1}">${esc(c.resolved ? t("reopen") : t("resolve"))}</button></div></div>`).join("")
        : `<p class="cmempty">${esc(t("noComments"))}</p>`}`;
    $("#cmShowRes").onchange = (e) => { showResolved = e.target.checked; drawComments(); };
    $("#cmAdd").onclick = guard(async () => {
      const text = $("#cmText").value.trim(); if (!text) return;
      const r = await capi("POST", `/docs/${id}/comments`, { start: ta.selectionStart, end: ta.selectionEnd, body: text });
      if (r.noAccess && r.noAccess.length) toast(t("mentionNoAccess").replace("{who}", r.noAccess.join(", ")), true);
      await loadComments();
    });
    box.querySelectorAll("[data-creply]").forEach((inp) => inp.onkeydown = guard(async (e) => {
      if (e.key !== "Enter" || !inp.value.trim()) return;
      const r = await capi("POST", `/docs/${id}/comments`, { parent: +inp.dataset.creply, body: inp.value.trim() });
      if (r.noAccess && r.noAccess.length) toast(t("mentionNoAccess").replace("{who}", r.noAccess.join(", ")), true);
      await loadComments();
    }));
    box.querySelectorAll("[data-cres]").forEach((b) => b.onclick = guard(async (e) => { e.stopPropagation(); await capi("POST", `/docs/${id}/comments/${b.dataset.cres}/resolve`, { resolved: b.dataset.val === "1" }); await loadComments(); }));
    box.querySelectorAll("[data-cdel]").forEach((b) => b.onclick = guard(async (e) => { e.stopPropagation(); if (!confirm(t("confirmDelete"))) return; await capi("DELETE", `/docs/${id}/comments/${b.dataset.cdel}`); await loadComments(); }));
    box.querySelectorAll("[data-cjump]").forEach((el) => el.onclick = (e) => {
      if (e.target.closest("input,button")) return;
      const c = comments.find((x) => x.id === +el.dataset.cjump); if (!c) return;
      ta.focus(); ta.setSelectionRange(c.start, c.end);
    });
  };
  $("#docComBtn").onclick = () => { box.classList.toggle("hidden"); $("#docComBtn").classList.toggle("on", !box.classList.contains("hidden")); drawComments(); };
  docHooks.onText = (remote) => {
    clearTimeout(prevTimer); prevTimer = setTimeout(renderPreview, 400);
    // Anchors move on the server as text changes; refresh them now and then.
    if (remote && comments.length) { clearTimeout(comTimer); comTimer = setTimeout(loadComments, 1500); }
  };
  docHooks.onComments = loadComments;
  loadComments();
}

function downloadItem(it) { const a = document.createElement("a"); a.href = "/mail/api/cloud/download/" + it.id; a.download = it.name; document.body.appendChild(a); a.click(); a.remove(); }

async function uploadFiles(files) {
  if (!files || !files.length) return;
  toast(t("uploading"));
  for (const f of files) {
    try {
      const q = `drive=${fs.driveId}` + (fs.parent ? `&parent=${fs.parent}` : "") + `&name=${encodeURIComponent(f.name)}`;
      const res = await fetch("/mail/api/cloud/upload?" + q, { method: "POST", credentials: "same-origin", headers: { "X-Ondura-Mail": "1", "Content-Type": f.type || "application/octet-stream" }, body: f });
      if (!res.ok) { const d = await res.json().catch(() => null); throw new Error((d && d.error) || res.statusText); }
    } catch (e) { toast(e.message, true); }
  }
  renderFiles();
}

function itemMenu(ev, it) {
  if (!it) return;
  const items = [];
  if (it.kind === "file") items.push({ ic: "paperclip", label: t("download"), fn: () => downloadItem(it) });
  if (fs.canWrite && it.kind !== "doc") items.push({ ic: "share", label: t("share"), fn: () => openItemShare(it) });
  if (it.kind === "file") items.push({ ic: "clock", label: t("versionHistory"), fn: () => openVersions(it) });
  if (fs.isLibrary && it.kind === "file") {
    const co = it.checkedOut;
    if (!co && fs.canWrite) items.push({ ic: "lock", label: t("checkOut"), fn: guard(async () => { await api("POST", "/cloud/checkout", { item: it.id }); renderFiles(); }) });
    if (co && co.mine) items.push({ ic: "check", label: t("checkIn"), fn: guard(async () => { await api("POST", "/cloud/checkin", { item: it.id }); renderFiles(); }) });
    if (co && !co.mine && fs.canManage) items.push({ ic: "reply", label: t("discardCheckout"), fn: guard(async () => { await api("POST", "/cloud/checkin", { item: it.id }); renderFiles(); }) });
  }
  if (fs.isLibrary && fs.libOwner && it.approval && it.approval.status !== "approved") {
    items.push({ ic: "check", label: t("approve"), fn: guard(async () => { await api("POST", "/cloud/review", { item: it.id, approve: true }); renderFiles(); }) });
    if (it.approval.status === "pending") items.push({ ic: "reply", label: t("reject"), fn: guard(async () => { const note = prompt(t("rejectReason")); if (note === null) return; await api("POST", "/cloud/review", { item: it.id, approve: false, note }); renderFiles(); }) });
  }
  if (fs.isLibrary && (fs.columns || []).length) items.push({ ic: "settings", label: t("properties"), fn: () => openProperties(it) });
  if (fs.isLibrary && it.kind === "folder" && fs.canManage) items.push({ ic: "lock", label: t("manageAccess"), fn: () => openAccess(it) });
  if (fs.canWrite) {
    items.push({ ic: "settings", label: t("rename"), fn: guard(async () => { const name = prompt(t("rename"), it.name); if (!name) return; await api("POST", "/cloud/rename", { item: it.id, name: name.trim() }); renderFiles(); }) });
    items.push({ ic: "trash", label: t("delete"), danger: true, fn: guard(async () => { if (!confirm(t("confirmDeleteItem"))) return; await api("POST", "/cloud/delete", { item: it.id }); renderFiles(); }) });
  }
  if (items.length) openMenu(ev, items);
}

// How a stored metadata value reads in the list.
function fieldText(col, v) {
  if (col.kind === "yesno") return v === "1" ? t("yes") : t("no");
  if (col.kind === "date") { const d = new Date(v + "T00:00:00"); return isNaN(d) ? v : d.toLocaleDateString(lang === "de" ? "de-DE" : "en-GB"); }
  return v;
}

// A folder's permissions: inherit from the library, or keep an own access list.
async function openAccess(it) {
  const roles = [["owner", t("owner")], ["editor", t("roleEditor")], ["viewer", t("roleViewer")]];
  const draw = async () => {
    let p;
    try { p = await api("GET", "/cloud/permissions?item=" + it.id); } catch (e) { toast(e.message, true); return; }
    const sel = (m) => `<select data-role="${m.id}" style="width:auto">${roles.map(([v, l]) => `<option value="${v}" ${m.role === v ? "selected" : ""}>${esc(l)}</option>`).join("")}</select>`;
    let body;
    if (p.restricted) {
      const rows = p.entries.map((m) => `<div class="taskrow"><div class="tt" style="flex:1;min-width:0"><div>${esc(m.name || m.email)}</div><div style="font-size:11px;color:var(--muted)">${esc(m.email)}</div></div>${p.canManage ? sel(m) + `<button class="iconbtn danger" data-rm="${m.id}">${icon("trash")}</button>` : ""}</div>`).join("") || `<p style="color:var(--muted)">—</p>`;
      body = `<p style="margin:0 0 8px">${esc(t("ownPermissions"))}</p><div id="acList">${rows}</div>
        ${p.canManage ? `<div style="display:flex;gap:6px;margin-top:10px"><input id="acEmail" placeholder="${esc(t("addMember"))}" style="flex:1"><select id="acRole" style="width:auto">${roles.slice(1).map(([v, l]) => `<option value="${v}">${esc(l)}</option>`).join("")}</select><button class="btn primary" id="acAdd">${esc(t("add"))}</button></div>
        <button class="btn" id="acInherit" style="margin-top:14px">${esc(t("inheritAgain"))}</button>` : ""}`;
    } else {
      const from = p.inheritsFrom ? `${esc(t("inheritsFrom"))} „${esc(p.inheritsFrom.name)}“.` : esc(t("inheritsLibrary"));
      body = `<p style="margin:0 0 12px">${from}</p>${p.canManage ? `<button class="btn primary" id="acRestrict">${icon("lock")}<span>${esc(t("stopInheriting"))}</span></button>` : ""}`;
    }
    panel(`${t("manageAccess")} · ${it.name}`, body, `<div style="flex:1"></div><button class="btn" id="acClose">${esc(t("close"))}</button>`);
    $("#acClose").onclick = () => { closePanel(); renderFiles(); };
    const r = $("#acRestrict"); if (r) r.onclick = guard(async () => { await api("POST", "/cloud/permissions/restrict", { item: it.id, restricted: true }); draw(); });
    const i = $("#acInherit"); if (i) i.onclick = guard(async () => { if (!confirm(t("confirmInherit"))) return; await api("POST", "/cloud/permissions/restrict", { item: it.id, restricted: false }); draw(); });
    const a = $("#acAdd"); if (a) a.onclick = guard(async () => { const email = $("#acEmail").value.trim(); if (!email) return; await api("POST", "/cloud/permissions/set", { item: it.id, email, role: $("#acRole").value }); draw(); });
    const list = $("#acList");
    if (list) {
      list.querySelectorAll("[data-rm]").forEach((b) => b.onclick = guard(async () => { await api("POST", "/cloud/permissions/remove", { item: it.id, user: +b.dataset.rm }); draw(); }));
      list.querySelectorAll("[data-role]").forEach((s2) => s2.onchange = guard(async () => { const m = p.entries.find((x) => x.id === +s2.dataset.role); if (m) await api("POST", "/cloud/permissions/set", { item: it.id, email: m.email, role: s2.value }); }));
    }
  };
  draw();
}

// The library's metadata columns (owners).
async function openColumns(driveId) {
  const kinds = ["text", "number", "date", "choice", "yesno"];
  const draw = async () => {
    let cols = [];
    try { cols = (await api("GET", `/cloud/items?drive=${driveId}`)).columns || []; } catch (e) {}
    const rows = cols.length ? cols.map((c) => `<div class="taskrow"><div class="tt" style="flex:1;min-width:0"><div>${esc(c.name)}</div><div style="font-size:11px;color:var(--muted)">${esc(t("col" + c.kind[0].toUpperCase() + c.kind.slice(1)))}${c.choices.length ? " · " + esc(c.choices.join(", ")) : ""}</div></div><button class="iconbtn danger" data-rm="${c.id}">${icon("trash")}</button></div>`).join("") : `<p style="color:var(--muted)">${esc(t("noColumns"))}</p>`;
    panel(t("librarySettings"), `<label style="display:flex;gap:8px;align-items:flex-start;margin-bottom:14px;cursor:pointer"><input type="checkbox" id="setApproval" style="width:auto;margin-top:3px" ${fs.requireApproval ? "checked" : ""}><span>${esc(t("requireApproval"))}<br><span style="font-size:12px;color:var(--muted)">${esc(t("requireApprovalHint"))}</span></span></label>
      <div class="field"><label>${esc(t("libColumns"))}</label></div><div id="colList">${rows}</div>
      <div class="field" style="margin-top:12px"><label>${esc(t("addColumn"))}</label>
        <div style="display:flex;gap:6px"><input id="colName" placeholder="${esc(t("columnName"))}" style="flex:1"><select id="colKind" style="width:auto">${kinds.map((k) => `<option value="${k}">${esc(t("col" + k[0].toUpperCase() + k.slice(1)))}</option>`).join("")}</select></div>
        <textarea id="colChoices" placeholder="${esc(t("choicesHint"))}" rows="3" style="margin-top:6px;display:none"></textarea>
        <button class="btn primary" id="colAdd" style="margin-top:8px">${esc(t("add"))}</button></div>`,
      `<div style="flex:1"></div><button class="btn" id="colClose">${esc(t("close"))}</button>`);
    $("#setApproval").onchange = guard(async () => { const on = $("#setApproval").checked; await api("POST", "/cloud/library/settings", { drive: driveId, require_approval: on }); fs.requireApproval = on; });
    $("#colKind").onchange = () => { $("#colChoices").style.display = $("#colKind").value === "choice" ? "" : "none"; };
    $("#colClose").onclick = () => { closePanel(); renderFiles(); };
    $("#colAdd").onclick = guard(async () => { const name = $("#colName").value.trim(); if (!name) return; await api("POST", "/cloud/column", { drive: driveId, name, kind: $("#colKind").value, choices: $("#colChoices").value.split("\n") }); draw(); });
    $("#colList").querySelectorAll("[data-rm]").forEach((b) => b.onclick = guard(async () => { if (!confirm(t("confirmDeleteColumn"))) return; await api("POST", "/cloud/column/delete", { drive: driveId, id: +b.dataset.rm }); draw(); }));
  };
  draw();
}

// Edit an item's metadata values.
function openProperties(it) {
  const cols = fs.columns || [];
  const val = (c) => (it.fields && it.fields[c.id]) || "";
  const input = (c) => {
    const id = `pf${c.id}`;
    if (c.kind === "choice") return `<select id="${id}"><option value=""></option>${c.choices.map((o) => `<option ${val(c) === o ? "selected" : ""}>${esc(o)}</option>`).join("")}</select>`;
    if (c.kind === "yesno") return `<select id="${id}"><option value=""></option><option value="1" ${val(c) === "1" ? "selected" : ""}>${esc(t("yes"))}</option><option value="0" ${val(c) === "0" ? "selected" : ""}>${esc(t("no"))}</option></select>`;
    const type = c.kind === "number" ? "number" : c.kind === "date" ? "date" : "text";
    return `<input id="${id}" type="${type}" ${c.kind === "number" ? 'step="any"' : ""} value="${esc(val(c))}" ${fs.canWrite ? "" : "disabled"}>`;
  };
  panel(`${t("properties")} · ${it.name}`, cols.map((c) => `<div class="field"><label>${esc(c.name)}</label>${input(c)}</div>`).join(""),
    `<div style="flex:1"></div><button class="btn" id="pfCancel">${esc(t("cancel"))}</button>${fs.canWrite ? `<button class="btn primary" id="pfSave">${esc(t("save"))}</button>` : ""}`);
  $("#pfCancel").onclick = closePanel;
  const sv = $("#pfSave");
  if (sv) sv.onclick = guard(async () => {
    for (const c of cols) { const v = $(`#pf${c.id}`).value.trim(); if (v !== val(c)) await api("POST", "/cloud/field", { item: it.id, column: c.id, value: v }); }
    closePanel(); renderFiles();
  });
}

// Guest links for a whole library (owners).
function openLibraryShare(driveId) {
  const expiryOpts = [["0", t("expiryNever")], ["7", t("expiry7")], ["30", t("expiry30")], ["90", t("expiry90")]];
  panel(t("shareLibrary"),
    `<p style="margin:0 0 8px;color:var(--muted);font-size:12.5px">${esc(t("libraryLinkHint"))}</p><div id="llLinks"></div>
     <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
       <select id="llPerm"><option value="read">${esc(t("linkView"))}</option><option value="write">${esc(t("linkEdit"))}</option></select>
       <select id="llExp">${expiryOpts.map(([v, l]) => `<option value="${v}">${esc(l)}</option>`).join("")}</select>
       <button class="btn primary" id="llAdd">${icon("link")}<span>${esc(t("createLink"))}</span></button></div>`,
    `<div style="flex:1"></div><button class="btn" id="llClose">${esc(t("close"))}</button>`);
  const expLabel = (e) => e ? `${esc(t("expiresOn"))} ${esc(fmtDate(e))}` : esc(t("expiryNever"));
  const refresh = async () => {
    let links = [];
    try { links = (await api("GET", "/cloud/library/links?drive=" + driveId)).links || []; } catch (e) {}
    $("#llLinks").innerHTML = links.length ? links.map((l) => `<div class="taskrow"><div class="tt" style="min-width:0;flex:1"><div style="font-size:12.5px">${l.canWrite ? esc(t("anyoneCanEdit")) : esc(t("anyoneCanView"))} · ${expLabel(l.expires)}</div><div class="dm" style="font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(itemShareUrl(l.token))}</div></div><button class="iconbtn" data-copy="${esc(l.token)}" title="${esc(t("copyLink"))}">${icon("copy")}</button><button class="iconbtn danger" data-lrm="${esc(l.token)}" title="${esc(t("revoke"))}">${icon("trash")}</button></div>`).join("") : `<p style="color:var(--muted);font-size:12.5px;margin:4px 0 0">${esc(t("noLinks"))}</p>`;
    $("#llLinks").querySelectorAll("[data-copy]").forEach((b) => b.onclick = () => { const url = itemShareUrl(b.dataset.copy); if (navigator.clipboard) navigator.clipboard.writeText(url); toast(t("copied")); });
    $("#llLinks").querySelectorAll("[data-lrm]").forEach((b) => b.onclick = guard(async () => { await api("POST", "/cloud/link/revoke", { token: b.dataset.lrm }); refresh(); }));
  };
  $("#llAdd").onclick = guard(async () => { await api("POST", "/cloud/library/link", { drive: driveId, write: $("#llPerm").value === "write", expires_days: +$("#llExp").value }); refresh(); });
  $("#llClose").onclick = closePanel;
  refresh();
}

async function openMembers(driveId) {
  const drive = fs.drives.find((d) => d.id === driveId);
  const roles = [["editor", t("roleEditor")], ["viewer", t("roleViewer")]];
  const roleSel = (id, cur) => `<select data-role="${id}" style="width:auto">${roles.map(([v, l]) => `<option value="${v}" ${cur === v ? "selected" : ""}>${esc(l)}</option>`).join("")}</select>`;
  const draw = async () => {
    let list = [];
    try { list = (await api("GET", "/cloud/members?drive=" + driveId)).members || []; } catch (e) {}
    const admin = drive && drive.role === "owner";
    const rows = list.map((m) => `<div class="taskrow"><div class="tt" style="flex:1;min-width:0"><div>${esc(m.name || m.email)}</div><div style="font-size:11px;color:var(--muted)">${esc(m.email)}</div></div>${m.role === "owner" ? `<span style="font-size:12px;color:var(--muted)">${esc(t("owner"))}</span>` : (admin ? roleSel(m.user ? m.user : m.id, m.role) + `<button class="iconbtn danger" data-rm="${m.id}">${icon("trash")}</button>` : `<span style="font-size:12px;color:var(--muted)">${esc(m.role === "editor" ? t("roleEditor") : t("roleViewer"))}</span>`)}</div>`).join("");
    const addRow = admin ? `<div style="display:flex;gap:6px;margin-top:10px"><input id="mEmail" placeholder="${esc(t("addMember"))}" style="flex:1">${`<select id="mRole" style="width:auto">${roles.map(([v, l]) => `<option value="${v}">${esc(l)}</option>`).join("")}</select>`}<button class="btn primary" id="mAdd">${esc(t("add"))}</button></div>` : "";
    panel(t("members"), `<div id="memList">${rows}</div>${addRow}`, `<button class="btn" id="mClose">${esc(t("cancel"))}</button>`);
    const mc = $("#mClose"); if (mc) mc.onclick = closePanel;
    const ma = $("#mAdd"); if (ma) ma.onclick = guard(async () => { const email = $("#mEmail").value.trim(); if (!email) return; await api("POST", "/cloud/member", { drive: driveId, email, role: $("#mRole").value }); draw(); });
    $("#memList").querySelectorAll("[data-rm]").forEach((b) => b.onclick = guard(async () => { await api("POST", "/cloud/member/delete", { drive: driveId, user: +b.dataset.rm }); draw(); }));
    $("#memList").querySelectorAll("[data-role]").forEach((s) => s.onchange = guard(async () => { const m = list.find((x) => x.id === +s.dataset.role); if (m) { await api("POST", "/cloud/member", { drive: driveId, email: m.email, role: s.value }); } }));
  };
  draw();
}

// ------------------------------------------------------------ notifications
// The bell in the top bar: notices about what other people did that concerns
// this account (mentions, shares, approvals), checked once a minute.
const activity = { items: [], unread: 0, timer: null };
async function loadActivity() {
  if (!me || me.guest) return;
  try { const r = await api("GET", "/activity"); activity.items = r.items || []; activity.unread = r.unread || 0; } catch (e) { return; }
  const c = $("#bellCount");
  if (c) { c.textContent = activity.unread > 99 ? "99+" : String(activity.unread); c.classList.toggle("hidden", !activity.unread); }
}
function activityText(a) {
  const tpl = t("act_" + a.kind);
  return esc(tpl).replace("{a}", `<b>${esc(a.actor)}</b>`).replace("{s}", esc(a.subject));
}
function openActivityLink(link) {
  if (!link) return;
  const doc = (link.match(/#doc=(\d+)/) || [])[1];
  if (doc) { view = "files"; openCloudDoc(+doc); return; }
  fs.grant = null; fs.trashView = false; fs.recentView = false; fs.sharedView = false; fs.search = false;
  history.pushState({}, "", link);
  routeAndRender();
}
async function openActivity(ev) {
  ev.stopPropagation();
  if ($("#ctxMenu")) { closeMenu(); return; }
  await loadActivity();
  const m = document.createElement("div"); m.id = "ctxMenu"; m.className = "glass";
  m.style.cssText = "position:fixed;top:52px;right:10px;z-index:70;padding:8px;width:360px;max-height:70vh;overflow:auto";
  const rows = activity.items.map((a, i) => `<div class="actitem ${a.read ? "read" : ""}" data-act="${i}"><span class="dot"></span><div style="flex:1;min-width:0"><div class="at">${activityText(a)}</div>${a.detail ? `<div class="ad">${esc(a.detail)}</div>` : ""}<div class="ad">${esc(fmtShort(a.created))}</div></div></div>`).join("");
  m.innerHTML = `<div style="display:flex;align-items:center;padding:4px 8px 8px"><b style="flex:1;font-size:14px">${esc(t("notifications"))}</b>${activity.unread ? `<button class="btn" id="actAll" style="height:28px;font-size:12px">${esc(t("markAllReadN"))}</button>` : ""}</div>`
    + (rows || `<div class="empty" style="padding:18px">${esc(t("noNotifications"))}</div>`);
  document.body.appendChild(m);
  m.onclick = (e) => e.stopPropagation();
  const all = $("#actAll"); if (all) all.onclick = guard(async () => { await api("POST", "/activity/read", {}); closeMenu(); loadActivity(); });
  m.querySelectorAll("[data-act]").forEach((el) => el.onclick = guard(async () => {
    const a = activity.items[+el.dataset.act];
    closeMenu();
    if (!a.read) { try { await api("POST", "/activity/read", { id: a.id }); } catch (e) {} loadActivity(); }
    openActivityLink(a.link);
  }));
  setTimeout(() => document.addEventListener("click", closeMenu, { once: true }), 0);
}
function startActivity() {
  if (activity.timer) return;
  const b = $("#bellBtn"); if (b) b.onclick = openActivity;
  loadActivity();
  activity.timer = setInterval(loadActivity, 60000);
}

// ------------------------------------------------------------ boot
// Event reminders while webmail is open: once a minute, look at the next day
// of the own calendar and announce each occurrence whose reminder time has
// come, as a browser notification when allowed, otherwise in the page. Each
// occurrence is announced once per browser.
const reminders = { seen: new Set(), timer: null };
try { JSON.parse(localStorage.getItem("ondura.reminders") || "[]").forEach((k) => reminders.seen.add(k)); } catch (e) {}
function announce(key, title, text, target) {
  reminders.seen.add(key);
  if ("Notification" in window && Notification.permission === "granted") {
    try { const n = new Notification(title, { body: text, tag: key }); n.onclick = () => { window.focus(); navTo(target); n.close(); }; } catch (err) { toast(`${title} — ${text}`); }
  } else {
    toast(`${t("reminder")}: ${title}${text ? " — " + text : ""}`);
  }
}
async function checkReminders() {
  if (!me || me.guest) return;
  const now = Math.floor(Date.now() / 1000);
  // Tasks with a reminder time (any account with a task list).
  try {
    for (const tk of (await api("GET", "/tasks")).tasks || []) {
      if (tk.complete || tk.reminder == null) continue;
      const key = `task:${tk.id}:${tk.reminder}`;
      if (reminders.seen.has(key) || now < tk.reminder || now > tk.reminder + 3600) continue;
      announce(key, tk.subject || t("tasks"), tk.due ? `${t("due")}: ${fmtDate(tk.due)}` : "", "tasks");
    }
  } catch (e) {}
  if (me.mail === false) { try { localStorage.setItem("ondura.reminders", JSON.stringify([...reminders.seen].slice(-500))); } catch (e) {} return; }
  let events = [];
  try { events = (await api("GET", `/calendar?from=${now - 3600}&to=${now + 86400}`)).events || []; } catch (e) { return; }
  for (const e of events) {
    if (e.reminder == null || e.cancelled || e.response === "declined") continue;
    const key = `${e.id}:${e.occurrenceStart}`;
    const due = e.start - e.reminder * 60;
    if (reminders.seen.has(key) || now < due || now > e.start + 600) continue;
    const when = e.allDay ? t("allDay") : new Date(e.start * 1000).toLocaleTimeString(lang === "de" ? "de-DE" : "en-GB", { hour: "2-digit", minute: "2-digit" });
    announce(key, e.subject || t("event"), `${when}${e.location ? " · " + e.location : ""}`, "calendar");
  }
  try { localStorage.setItem("ondura.reminders", JSON.stringify([...reminders.seen].slice(-500))); } catch (e) {}
}
function startReminders() {
  startActivity();
  loadScheduled();
  if (reminders.timer) return;
  checkReminders();
  reminders.timer = setInterval(checkReminders, 60000);
}

applyTexts();
guard(start)();
</script>
