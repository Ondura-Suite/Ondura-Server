<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ondura Webmail</title>
<link rel="icon" href="/mail/logo.svg">
<style>
:root {
  --tint: #3b5bdb;
  --tint-strong: #304bb4;
  --tint-soft: rgba(59, 91, 219, 0.1);
  --bg: #eceef2;
  --surface: rgba(255, 255, 255, 0.72);
  --surface-solid: #ffffff;
  --surface-hover: rgba(15, 23, 42, 0.045);
  --border: rgba(15, 23, 42, 0.09);
  --text: #1b1f27;
  --muted: #5d6573;
  --danger: #c4314b;
  --ok: #107c41;
  --warn: #b7791f;
  --shadow: 0 1px 2px rgba(15, 23, 42, 0.06), 0 8px 24px rgba(15, 23, 42, 0.06);
  --radius: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111216;
    --surface: rgba(32, 34, 40, 0.72);
    --surface-solid: #1d1f24;
    --surface-hover: rgba(255, 255, 255, 0.05);
    --border: rgba(255, 255, 255, 0.09);
    --text: #e8eaef;
    --muted: #9aa1ad;
    --tint-soft: rgba(110, 138, 255, 0.16);
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.25);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font: 14px/1.45 "Segoe UI Variable", "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, "Helvetica Neue", "Noto Sans", sans-serif;
  color: var(--text);
  background-color: var(--bg);
  background-image:
    linear-gradient(180deg, rgba(255,255,255,.55) 0%, rgba(255,255,255,0) 40%),
    radial-gradient(75vw 65vh at 0% 0%, color-mix(in srgb, var(--tint) 13%, transparent), transparent 70%),
    radial-gradient(70vw 70vh at 100% 100%, color-mix(in srgb, var(--tint) 7%, transparent), transparent 70%);
  background-attachment: fixed;
  -webkit-font-smoothing: antialiased;
}
@media (prefers-color-scheme: dark) {
  body { background-image:
    radial-gradient(75vw 65vh at 0% 0%, color-mix(in srgb, var(--tint) 20%, transparent), transparent 70%),
    radial-gradient(70vw 70vh at 100% 100%, color-mix(in srgb, var(--tint) 9%, transparent), transparent 70%); }
}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--tint); }
.hidden { display: none !important; }
svg { width: 18px; height: 18px; display: block; }

.glass {
  background: var(--surface);
  backdrop-filter: blur(24px) saturate(1.4);
  -webkit-backdrop-filter: blur(24px) saturate(1.4);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}

/* ---------- login ---------- */
#login { min-height: 100%; display: grid; place-items: center; padding: 24px; }
#login .card { width: 380px; max-width: 100%; padding: 36px 36px 28px; }
#login img { width: 48px; height: 48px; }
#login h1 { font-size: 22px; font-weight: 600; margin: 14px 0 2px; }
#login p.sub { color: var(--muted); margin: 0 0 22px; }
.field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; }
.field label { font-size: 12.5px; color: var(--muted); font-weight: 500; }
.field input, .field select, .field textarea {
  padding: 8px 10px; border-radius: 6px; border: 1px solid var(--border);
  background: var(--surface-solid); outline: none; border-bottom: 2px solid transparent; width: 100%;
}
.field input, .field select { height: 34px; }
.field input:focus, .field select:focus, .field textarea:focus { border-bottom-color: var(--tint); }
.error { color: var(--danger); min-height: 20px; margin: 2px 0 8px; font-size: 13px; }

.btn {
  height: 32px; padding: 0 14px; border-radius: 6px; border: 1px solid var(--border);
  background: var(--surface-solid); cursor: pointer; display: inline-flex; align-items: center; gap: 7px;
}
.btn:hover { background: var(--surface-hover); }
.btn.primary { background: var(--tint); border-color: var(--tint); color: #fff; }
.btn.primary:hover { background: var(--tint-strong); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--surface-hover); }
.btn.danger { color: var(--danger); }
.btn svg { width: 16px; height: 16px; }

/* ---------- shell ---------- */
#app { height: 100%; display: grid; grid-template-rows: 54px 1fr; }
#top { display: flex; align-items: center; gap: 12px; padding: 0 14px; border-bottom: 1px solid var(--border); background: var(--surface); backdrop-filter: blur(24px); }
#top .brand { display: flex; align-items: center; gap: 9px; font-weight: 600; }
#top .brand img { width: 24px; height: 24px; }
#top .search { flex: 0 1 420px; margin-left: 10px; position: relative; }
#top .search input { width: 100%; height: 34px; padding: 0 10px 0 32px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface-solid); outline: none; }
#top .search svg { position: absolute; left: 9px; top: 8px; width: 16px; height: 16px; color: var(--muted); }
#top .sp { flex: 1; }
#top .who { color: var(--muted); font-size: 13px; }
.iconbtn { width: 34px; height: 34px; border-radius: 8px; border: 1px solid transparent; background: transparent; cursor: pointer; display: grid; place-items: center; }
.iconbtn:hover { background: var(--surface-hover); }

#body { display: grid; grid-template-columns: 220px 1fr; min-height: 0; }
#rail { border-right: 1px solid var(--border); padding: 10px 8px; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
.navitem { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; cursor: pointer; color: var(--text); }
.navitem:hover { background: var(--surface-hover); }
.navitem.active { background: var(--tint-soft); color: var(--tint); font-weight: 600; }
.railsep { height: 1px; background: var(--border); margin: 8px 4px; }
.folder { display: flex; align-items: center; gap: 9px; padding: 7px 10px; border-radius: 8px; cursor: pointer; }
.folder:hover { background: var(--surface-hover); }
.folder.active { background: var(--tint-soft); color: var(--tint); font-weight: 600; }
.folder .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.folder .ct { font-size: 12px; color: var(--muted); }
.folder.active .ct { color: var(--tint); }

#view { min-width: 0; min-height: 0; overflow: hidden; }

/* ---------- mail ---------- */
.mailgrid { height: 100%; display: grid; grid-template-columns: 380px 1fr; min-height: 0; }
.list { border-right: 1px solid var(--border); overflow-y: auto; }
.list .hd { padding: 12px 14px 8px; display: flex; align-items: center; gap: 8px; position: sticky; top: 0; background: var(--bg); z-index: 1; }
.list .hd h2 { font-size: 16px; margin: 0; flex: 1; }
.msg { padding: 10px 14px; border-bottom: 1px solid var(--border); cursor: pointer; }
.msg:hover { background: var(--surface-hover); }
.msg.active { background: var(--tint-soft); }
.msg.unread .mf { font-weight: 700; }
.msg .top { display: flex; gap: 8px; align-items: baseline; }
.msg .mf { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.msg .dt { font-size: 12px; color: var(--muted); white-space: nowrap; }
.msg .su { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 1px; }
.msg .pv { font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--tint); display: inline-block; }
.reader { overflow-y: auto; padding: 0; display: flex; flex-direction: column; min-height: 0; }
.reader .rh { padding: 16px 20px 12px; border-bottom: 1px solid var(--border); }
.reader h1 { font-size: 20px; margin: 0 0 8px; }
.reader .meta { color: var(--muted); font-size: 13px; }
.reader .acts { display: flex; gap: 8px; padding: 10px 20px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.reader .bodywrap { flex: 1; min-height: 0; }
.reader iframe { width: 100%; height: 100%; border: 0; background: #fff; }
.reader pre.text { margin: 0; padding: 18px 20px; white-space: pre-wrap; word-wrap: break-word; font: inherit; }
.atts { padding: 10px 20px; border-top: 1px solid var(--border); display: flex; gap: 8px; flex-wrap: wrap; }
.att { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border: 1px solid var(--border); border-radius: 20px; font-size: 12.5px; text-decoration: none; color: var(--text); }
.att:hover { background: var(--surface-hover); }
.empty { color: var(--muted); display: grid; place-items: center; height: 100%; text-align: center; padding: 20px; }

/* ---------- panels ---------- */
#overlay:not(:empty) { position: fixed; inset: 0; z-index: 50; }
.scrim { position: absolute; inset: 0; background: rgba(15,23,42,.28); }
.panel { position: absolute; top: 0; right: 0; height: 100%; width: 620px; max-width: 100%; background: var(--surface-solid); border-left: 1px solid var(--border); box-shadow: var(--shadow); display: flex; flex-direction: column; animation: slide .16s ease-out; }
@keyframes slide { from { transform: translateX(16px); opacity: .6; } to { transform: none; opacity: 1; } }
.panel .head { display: flex; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--border); }
.panel .head h2 { font-size: 17px; margin: 0; flex: 1; }
.panel .cont { padding: 16px 18px; overflow-y: auto; flex: 1; }
.panel .foot { padding: 12px 18px; border-top: 1px solid var(--border); display: flex; gap: 8px; justify-content: flex-end; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
textarea.body { min-height: 260px; resize: vertical; font-family: inherit; }

/* ---------- calendar ---------- */
.cal { height: 100%; display: flex; flex-direction: column; }
.cal .bar { display: flex; align-items: center; gap: 10px; padding: 12px 16px; }
.cal .bar h2 { margin: 0; font-size: 18px; flex: 1; }
.grid { flex: 1; display: grid; grid-template-columns: repeat(7, 1fr); grid-auto-rows: 1fr; gap: 1px; background: var(--border); border-top: 1px solid var(--border); min-height: 0; }
.dow { background: var(--bg); text-align: center; padding: 6px 0; font-size: 12px; color: var(--muted); grid-row: 1; }
.cell { background: var(--surface-solid); padding: 4px 6px; overflow: hidden; display: flex; flex-direction: column; gap: 3px; cursor: pointer; min-height: 0; }
.cell:hover { background: var(--surface-hover); }
.cell .n { font-size: 12px; color: var(--muted); align-self: flex-end; }
.cell.other { opacity: .4; }
.cell.today .n { background: var(--tint); color: #fff; border-radius: 50%; width: 20px; height: 20px; display: grid; place-items: center; }
.ev { background: var(--tint-soft); color: var(--tint); border-radius: 5px; padding: 2px 6px; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }

/* ---------- contacts ---------- */
.cgrid { height: 100%; display: grid; grid-template-columns: 340px 1fr; min-height: 0; }
.clist { border-right: 1px solid var(--border); overflow-y: auto; }
.citem { padding: 11px 16px; border-bottom: 1px solid var(--border); cursor: pointer; }
.citem:hover { background: var(--surface-hover); }
.citem.active { background: var(--tint-soft); }
.citem .cn { font-weight: 600; }
.citem .ce { font-size: 12.5px; color: var(--muted); }
.cdetail { padding: 28px; overflow-y: auto; }
.avatar { width: 64px; height: 64px; border-radius: 50%; background: var(--tint-soft); color: var(--tint); display: grid; place-items: center; font-size: 26px; font-weight: 600; }
.kv { display: grid; grid-template-columns: 140px 1fr; gap: 6px 14px; margin-top: 18px; }
.kv .k { color: var(--muted); }

.badge { font-size: 11px; padding: 1px 7px; border-radius: 10px; border: 1px solid var(--border); }
.toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 9px 16px; border-radius: 8px; z-index: 100; box-shadow: var(--shadow); }
.toast.bad { background: var(--danger); color: #fff; }
@media (max-width: 820px) {
  #body { grid-template-columns: 1fr; }
  #rail { display: none; }
  .mailgrid, .cgrid, .cal .grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div id="login">
  <form class="card glass" id="loginForm">
    <img src="/mail/logo.svg" alt="Ondura">
    <h1 data-t="webmail">Webmail</h1>
    <p class="sub" data-t="signInSub">Sign in to your mailbox</p>
    <div class="field"><label data-t="email">E-mail</label><input id="le" type="email" autocomplete="username" required></div>
    <div class="field"><label data-t="password">Password</label><input id="lp" type="password" autocomplete="current-password" required></div>
    <div class="error" id="loginError"></div>
    <button class="btn primary" style="width:100%;justify-content:center" type="submit" data-t="signIn">Sign in</button>
    <div style="text-align:center;margin-top:14px"><a href="#" id="langToggle" style="font-size:12.5px"></a></div>
  </form>
</div>

<div id="app" class="hidden">
  <div id="top">
    <div class="brand"><img src="/mail/logo.svg" alt=""><span>Ondura</span></div>
    <div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m16 16 4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><input id="q" placeholder=""></div>
    <div class="sp"></div>
    <button class="btn primary" id="composeBtn"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span data-t="compose">Compose</span></button>
    <span class="who" id="who"></span>
    <button class="iconbtn" id="langBtn" title="Language"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></button>
    <button class="iconbtn" id="logoutBtn" title=""><svg viewBox="0 0 24 24"><path d="M15 4h3a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-3M10 8l-4 4 4 4M6 12h11" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div>
  <div id="body">
    <div id="rail"></div>
    <div id="view"></div>
  </div>
</div>

<div id="overlay"></div>

<script>

let lang;
try { lang = localStorage.getItem("ondura-mail-lang") || (navigator.language || "en").slice(0, 2); } catch (e) { lang = (navigator.language || "en").slice(0, 2); }
if (!T[lang]) lang = "en";
const t = (k) => (T[lang] && T[lang][k]) || T.en[k] || k;
function applyTexts(root) {
  (root || document).querySelectorAll("[data-t]").forEach((el) => { el.textContent = t(el.dataset.t); });
  document.documentElement.lang = lang;
  $("#q").placeholder = t("search");
  $("#logoutBtn").title = t("logout");
  const lt = $("#langToggle"); if (lt) lt.textContent = t("langName");
}

const $ = (s, r) => (r || document).querySelector(s);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmtDate = (s) => s ? new Date(s * 1000).toLocaleString(lang === "de" ? "de-DE" : "en-GB", { dateStyle: "medium", timeStyle: "short" }) : "";
const fmtShort = (s) => { if (!s) return ""; const d = new Date(s * 1000); const now = new Date(); const o = d.toDateString() === now.toDateString() ? { timeStyle: "short" } : { day: "2-digit", month: "short" }; return d.toLocaleString(lang === "de" ? "de-DE" : "en-GB", o); };
const fmtBytes = (b) => { if (!b) return "0 KB"; const u = ["B", "KB", "MB", "GB"]; let i = Math.floor(Math.log(b) / Math.log(1024)); i = Math.min(i, 3); return (b / Math.pow(1024, i)).toFixed(i ? 1 : 0) + " " + u[i]; };
const personStr = (p) => p ? (p.name || p.email) : "";

const ICON = {

  junkemail: '<path d="M12 3 3 7v5c0 5 3.5 8 9 9 5.5-1 9-4 9-9V7z" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 8v5M12 16h.01" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>',
  outbox: '<path d="M3 13l3-8h12l3 8v5a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 3v7m-3-3 3-3 3 3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>',

  mail: '<rect x="3" y="5" width="18" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="m4 7 8 6 8-6" fill="none" stroke="currentColor" stroke-width="1.6"/>',
  calendar: '<rect x="3" y="4.5" width="18" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M3 9h18M8 3v3M16 3v3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>',
  contacts: '<circle cx="12" cy="9" r="3.2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M5 20a7 7 0 0 1 14 0" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>',

async function api(method, path, body) {

    method, credentials: "same-origin",

    body: body === undefined ? undefined : JSON.stringify(body),
  });
  let data = null; try { data = await res.json(); } catch (e) { data = null; }

// ------------------------------------------------------------ CALENDAR
let calRef = new Date();
async function renderCalendar() {
  calRef.setDate(1);
  const y = calRef.getFullYear(), mo = calRef.getMonth();
  const first = new Date(y, mo, 1), startDow = (first.getDay() + 6) % 7;
  const gridStart = new Date(y, mo, 1 - startDow);
  const from = Math.floor(gridStart.getTime() / 1000);
  const to = from + 42 * 86400;
  const title = calRef.toLocaleString(lang === "de" ? "de-DE" : "en-GB", { month: "long", year: "numeric" });
  $("#view").innerHTML = `<div class="cal"><div class="bar"><h2>${esc(title)}</h2>
    <button class="btn" id="calToday">${esc(t("today"))}</button>
    <button class="iconbtn" id="calPrev"><svg viewBox="0 0 24 24" style="transform:rotate(180deg)">${ICON.chev}</svg></button>
    <button class="iconbtn" id="calNext"><svg viewBox="0 0 24 24">${ICON.chev}</svg></button>
    <button class="btn primary" id="calNew">${icon("calendar")}<span>${esc(t("newEvent"))}</span></button></div>
    <div class="grid" id="calGrid"></div></div>`;
  $("#calPrev").onclick = () => { calRef.setMonth(mo - 1); renderCalendar(); };
  $("#calNext").onclick = () => { calRef.setMonth(mo + 1); renderCalendar(); };
  $("#calToday").onclick = () => { calRef = new Date(); renderCalendar(); };
  $("#calNew").onclick = () => openEvent();
  const dows = lang === "de" ? ["Mo", "Di", "Mi", "Do", "Fr", "Sa", "So"] : ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
  let events = [];
  try { events = (await api("GET", `/calendar?from=${from}&to=${to}`)).events; } catch (e) {}
  const byDay = {};
  events.forEach((ev) => { const k = new Date(ev.start * 1000).toDateString(); (byDay[k] = byDay[k] || []).push(ev); });
  let cells = dows.map((d) => `<div class="dow">${d}</div>`).join("");
  for (let i = 0; i < 42; i++) {
    const d = new Date(gridStart.getFullYear(), gridStart.getMonth(), gridStart.getDate() + i);
    const other = d.getMonth() !== mo, today = d.toDateString() === new Date().toDateString();
    const evs = (byDay[d.toDateString()] || []).sort((a, b) => a.start - b.start);
    cells += `<div class="cell ${other ? "other" : ""} ${today ? "today" : ""}" data-day="${Math.floor(d.getTime() / 1000)}">
      <span class="n">${d.getDate()}</span>
      ${evs.map((e) => `<div class="ev" data-ev='${esc(JSON.stringify({ id: e.id, occ: e.occurrenceStart }))}' title="${esc(e.subject)}">${e.allDay ? "" : new Date(e.start * 1000).toLocaleTimeString(lang === "de" ? "de-DE" : "en-GB", { hour: "2-digit", minute: "2-digit" }) + " "}${esc(e.subject)}</div>`).join("")}</div>`;
  }
  $("#calGrid").innerHTML = cells;
  $("#calGrid").querySelectorAll(".cell").forEach((c) => c.onclick = (e) => { if (e.target.closest(".ev")) return; openEvent(null, +c.dataset.day); });
  $("#calGrid").querySelectorAll(".ev").forEach((el) => el.onclick = () => { const d = JSON.parse(el.dataset.ev); const ev = events.find((x) => x.id === d.id && x.occurrenceStart === d.occ); openEvent(ev); });
}
function toLocalInput(ts) { const d = new Date(ts * 1000); const p = (n) => String(n).padStart(2, "0"); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`; }
function fromLocalInput(v) { return Math.floor(new Date(v).getTime() / 1000); }
async function openEvent(ev, dayTs) {
  let full = ev;
  const start = ev ? ev.start : (dayTs ? dayTs + 9 * 3600 : Math.floor(Date.now() / 1000));
  const end = ev ? ev.end : start + 3600;
  const isInvite = ev && ev.hasAttendees && ev.response && ev.response !== "organizer";
  panel(ev ? t("editEvent") : t("newEvent"),
    `<div class="field"><label>${esc(t("title"))}</label><input id="evTitle" value="${esc(ev ? ev.subject : "")}"></div>
     <div class="field"><label>${esc(t("location"))}</label><input id="evLoc" value="${esc(ev ? ev.location : "")}"></div>
     <div class="row2"><div class="field"><label>${esc(t("start"))}</label><input id="evStart" type="datetime-local" value="${toLocalInput(start)}"></div>
     <div class="field"><label>${esc(t("end"))}</label><input id="evEnd" type="datetime-local" value="${toLocalInput(end)}"></div></div>
     <div class="field"><label><input type="checkbox" id="evAllDay" ${ev && ev.allDay ? "checked" : ""}> ${esc(t("allDay"))}</label></div>`,
    `${ev ? `<button class="btn danger" id="evDel">${esc(t("delete"))}</button>` : ""}<div style="flex:1"></div>
     ${isInvite ? `<button class="btn" id="evTent">${esc(t("tentative"))}</button><button class="btn danger" id="evDecline">${esc(t("decline"))}</button><button class="btn primary" id="evAccept">${esc(t("accept"))}</button>`
       : `<button class="btn primary" id="evSave">${esc(t("save"))}</button>`}`);
  if ($("#evSave")) $("#evSave").onclick = guard(async () => {
    const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC";
    const body = { event: { uid: ev ? ev.uid : "", subject: $("#evTitle").value, location: $("#evLoc").value, start: fromLocalInput($("#evStart").value), end: fromLocalInput($("#evEnd").value), all_day: $("#evAllDay").checked, tz } };
    if (ev) body.id = ev.id;
    await api("POST", "/event", body); closePanel(); toast(t("saved")); renderCalendar();
  });
  if ($("#evDel")) $("#evDel").onclick = guard(async () => { if (!confirm(t("confirmDelete"))) return; await api("POST", "/event/delete", { id: ev.id }); closePanel(); toast(t("deleted")); renderCalendar(); });
  const respond = (r) => guard(async () => { await api("POST", "/event/respond", { id: ev.id, response: r, occurrence: ev.occurrenceStart }); closePanel(); toast(t("saved")); renderCalendar(); });
  if ($("#evAccept")) $("#evAccept").onclick = respond("accepted");
  if ($("#evDecline")) $("#evDecline").onclick = respond("declined");
  if ($("#evTent")) $("#evTent").onclick = respond("tentative");
}

    await api("POST", "/contact", body); closePanel(); toast(t("saved")); renderContacts();
  });
  if ($("#ctDel")) $("#ctDel").onclick = guard(async () => { if (!confirm(t("confirmDelete"))) return; await api("POST", "/contact/delete", { id: c.id }); closePanel(); toast(t("deleted")); renderContacts(); });
}

// ------------------------------------------------------------ boot
applyTexts();
guard(start)();
</script>
</body>
</html>
