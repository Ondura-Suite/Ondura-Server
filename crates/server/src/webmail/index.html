<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ondura Webmail</title>
<link rel="icon" href="/mail/logo.svg">
<style>
:root {
  --tint: #3b5bdb;
  --tint-strong: #304bb4;
  --tint-soft: rgba(59, 91, 219, 0.1);
  --bg: #eceef2;
  --surface: rgba(255, 255, 255, 0.72);
  --surface-solid: #ffffff;
  --surface-hover: rgba(15, 23, 42, 0.045);
  --border: rgba(15, 23, 42, 0.09);
  --text: #1b1f27;
  --muted: #5d6573;
  --danger: #c4314b;
  --ok: #107c41;
  --warn: #b7791f;
  --shadow: 0 1px 2px rgba(15, 23, 42, 0.06), 0 8px 24px rgba(15, 23, 42, 0.06);
  --radius: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111216;
    --surface: rgba(32, 34, 40, 0.72);
    --surface-solid: #1d1f24;
    --surface-hover: rgba(255, 255, 255, 0.05);
    --border: rgba(255, 255, 255, 0.09);
    --text: #e8eaef;
    --muted: #9aa1ad;
    --tint-soft: rgba(110, 138, 255, 0.16);
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.25);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font: 14px/1.45 "Segoe UI Variable", "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, "Helvetica Neue", "Noto Sans", sans-serif;
  color: var(--text);
  background-color: var(--bg);
  background-image:
    linear-gradient(180deg, rgba(255,255,255,.55) 0%, rgba(255,255,255,0) 40%),
    radial-gradient(75vw 65vh at 0% 0%, color-mix(in srgb, var(--tint) 13%, transparent), transparent 70%),
    radial-gradient(70vw 70vh at 100% 100%, color-mix(in srgb, var(--tint) 7%, transparent), transparent 70%);
  background-attachment: fixed;
  -webkit-font-smoothing: antialiased;
}
@media (prefers-color-scheme: dark) {
  body { background-image:
    radial-gradient(75vw 65vh at 0% 0%, color-mix(in srgb, var(--tint) 20%, transparent), transparent 70%),
    radial-gradient(70vw 70vh at 100% 100%, color-mix(in srgb, var(--tint) 9%, transparent), transparent 70%); }
}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--tint); }
.hidden { display: none !important; }
svg { width: 18px; height: 18px; display: block; }

.glass {
  background: var(--surface);
  backdrop-filter: blur(24px) saturate(1.4);
  -webkit-backdrop-filter: blur(24px) saturate(1.4);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}

/* ---------- login ---------- */
#login { min-height: 100%; display: grid; place-items: center; padding: 24px; }
#login .card { width: 380px; max-width: 100%; padding: 36px 36px 28px; }
#login img { width: 48px; height: 48px; }
#login h1 { font-size: 22px; font-weight: 600; margin: 14px 0 2px; }
#login p.sub { color: var(--muted); margin: 0 0 22px; }
.field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; }
.field label { font-size: 12.5px; color: var(--muted); font-weight: 500; }
.field input, .field select, .field textarea {
  padding: 8px 10px; border-radius: 6px; border: 1px solid var(--border);
  background: var(--surface-solid); outline: none; border-bottom: 2px solid transparent; width: 100%;
}
.field input, .field select { height: 34px; }
.field input[type=checkbox] { width: auto; height: auto; margin-right: 6px; accent-color: var(--tint); vertical-align: middle; }
.field label:has(input[type=checkbox]) { flex-direction: row; align-items: center; color: var(--text); font-size: 14px; }
.field input:focus, .field select:focus, .field textarea:focus { border-bottom-color: var(--tint); }
.error { color: var(--danger); min-height: 20px; margin: 2px 0 8px; font-size: 13px; }

.btn {
  height: 32px; padding: 0 14px; border-radius: 6px; border: 1px solid var(--border);
  background: var(--surface-solid); cursor: pointer; display: inline-flex; align-items: center; gap: 7px;
}
.btn:hover { background: var(--surface-hover); }
.btn.primary { background: var(--tint); border-color: var(--tint); color: #fff; }
.btn.primary:hover { background: var(--tint-strong); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--surface-hover); }
.btn.danger { color: var(--danger); }
.btn svg { width: 16px; height: 16px; }

/* ---------- shell ---------- */
#app { height: 100%; display: grid; grid-template-rows: 54px 1fr; }
#top { display: flex; align-items: center; gap: 12px; padding: 0 14px; border-bottom: 1px solid var(--border); background: var(--surface); backdrop-filter: blur(24px); }
#top .brand { display: flex; align-items: center; gap: 9px; font-weight: 600; }
#top .brand img { width: 24px; height: 24px; }
#top .search { flex: 0 1 420px; margin-left: 10px; position: relative; }
#top .search input { width: 100%; height: 34px; padding: 0 10px 0 32px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface-solid); outline: none; }
#top .search svg { position: absolute; left: 9px; top: 8px; width: 16px; height: 16px; color: var(--muted); }
.acctwrap { position: relative; }
.acctbtn { width: 34px; height: 34px; border-radius: 50%; border: none; cursor: pointer; overflow: hidden; background: var(--tint-soft); color: var(--tint); font-weight: 600; font-size: 14px; display: grid; place-items: center; flex: none; padding: 0; }
.acctbtn img { width: 100%; height: 100%; object-fit: cover; display: block; }
.acctmenu { position: absolute; right: 0; top: 44px; width: 270px; background: var(--surface-solid); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); padding: 14px; z-index: 60; }
.acctmenu .card { display: flex; gap: 12px; align-items: center; }
.acctmenu .big { width: 52px; height: 52px; border-radius: 50%; overflow: hidden; background: var(--tint-soft); color: var(--tint); font-weight: 600; font-size: 20px; display: grid; place-items: center; flex: none; }
.acctmenu .big img { width: 100%; height: 100%; object-fit: cover; display: block; }
.acctmenu .nm { font-weight: 600; }
.acctmenu .em { color: var(--muted); font-size: 12.5px; word-break: break-all; }
.acctmenu hr { border: none; border-top: 1px solid var(--border); margin: 12px 0; }
.acctmenu button.row { display: block; width: 100%; text-align: left; background: none; border: none; padding: 8px 6px; border-radius: 8px; cursor: pointer; color: var(--text); font: inherit; }
.acctmenu button.row:hover { background: var(--surface-hover); }
.acctmenu button.row.danger { color: var(--danger); }
#top .sp { flex: 1; }
#top .who { color: var(--muted); font-size: 13px; }
.iconbtn { width: 34px; height: 34px; border-radius: 8px; border: 1px solid transparent; background: transparent; cursor: pointer; display: grid; place-items: center; }
.iconbtn:hover { background: var(--surface-hover); }

#body { display: grid; grid-template-columns: 220px 1fr; min-height: 0; }
#app.norail #body { grid-template-columns: 1fr; }
#app.norail #rail { display: none; }
#rail { border-right: 1px solid var(--border); padding: 10px 8px; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
.navitem { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; cursor: pointer; color: var(--text); }
.navitem:hover { background: var(--surface-hover); }
.navitem.active { background: var(--tint-soft); color: var(--tint); font-weight: 600; }
.railsep { height: 1px; background: var(--border); margin: 8px 4px; }
.homewrap { padding: 44px 32px; max-width: 920px; margin: 0 auto; width: 100%; box-sizing: border-box; overflow-y: auto; }
.homehd h1 { font-size: 26px; margin: 0 0 2px; }
.homehd p { color: var(--muted); margin: 0 0 30px; }
.appgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
.appgrid.mini { grid-template-columns: repeat(3, 1fr); gap: 6px; }
.apptile { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 26px 12px; border: 1px solid var(--border); border-radius: 16px; background: transparent; cursor: pointer; color: var(--text); font-weight: 600; font-size: 13.5px; transition: transform .14s ease, background .14s ease, border-color .14s ease, box-shadow .14s ease; }
.apptile:hover { background: var(--surface-hover); transform: translateY(-3px); box-shadow: 0 12px 26px rgba(0,0,0,.18); }
.apptile:active { transform: translateY(-1px); }
.appgrid.mini .apptile { padding: 12px 6px; font-size: 12px; border: 0; gap: 7px; }
.appgrid.mini .apptile:hover { transform: none; box-shadow: none; }
.appicon { display: flex; align-items: center; justify-content: center; width: 52px; height: 52px; border-radius: 14px; transition: transform .14s ease; }
.apptile:hover .appicon { transform: scale(1.08); }
.appicon svg { width: 26px; height: 26px; }
.appgrid.mini .appicon { width: 44px; height: 44px; }
#appLauncher svg { width: 20px; height: 20px; }
.taskrow[data-open] { border-radius: 10px; transition: background .1s ease; }
.taskrow[data-open]:hover { background: var(--surface-hover); }
.folder { display: flex; align-items: center; gap: 9px; padding: 7px 10px; border-radius: 8px; cursor: pointer; }
.folder:hover { background: var(--surface-hover); }
.folder.active { background: var(--tint-soft); color: var(--tint); font-weight: 600; }
.folder .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.folder .ct { font-size: 12px; color: var(--muted); }
.folder.active .ct { color: var(--tint); }

#view { min-width: 0; min-height: 0; overflow: hidden; }

/* ---------- mail ---------- */
.mailgrid { height: 100%; display: grid; grid-template-columns: 380px 1fr; min-height: 0; }
.list { border-right: 1px solid var(--border); overflow-y: auto; }
.list .hd { padding: 12px 14px 8px; display: flex; align-items: center; gap: 8px; position: sticky; top: 0; background: var(--bg); z-index: 1; }
.list .hd h2 { font-size: 16px; margin: 0; flex: 1; }
.msg { padding: 10px 14px; border-bottom: 1px solid var(--border); cursor: pointer; display: flex; gap: 9px; align-items: flex-start; }
.msg:hover { background: var(--surface-hover); }
.msg.active, .msg.sel { background: var(--tint-soft); }
.msgmain { flex: 1; min-width: 0; }
.msgchk { margin-top: 3px; flex: 0 0 auto; accent-color: var(--tint); }
.msg .msgchk { opacity: 0; transition: opacity .1s; }
.msg:hover .msgchk, .msg.sel .msgchk { opacity: 1; }
#ctxMenu .navitem { padding: 7px 10px; }
#ctxMenu .navitem.danger { color: var(--danger); }
.ctxsep { height: 1px; background: var(--border); margin: 4px 8px; }
.cats { display: flex; flex-wrap: wrap; gap: 4px; }
.cchip { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; line-height: 1; padding: 3px 8px 3px 7px; border-radius: 999px; color: #fff; font-weight: 600; white-space: nowrap; }
.cchip-rm { cursor: pointer; opacity: .8; font-weight: 700; }
.cchip-rm:hover { opacity: 1; }
.cdot { width: 10px; height: 10px; border-radius: 3px; flex: 0 0 auto; }
.msg .cats { margin-top: 3px; }
.catpick { padding: 6px; min-width: 230px; max-height: 60vh; overflow: auto; }
.catrow { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 8px; cursor: pointer; }
.catrow:hover { background: var(--surface-hover); }
.catrow .nm { flex: 1; font-size: 13.5px; }
.catrow .ck { width: 16px; text-align: center; color: var(--tint); font-weight: 700; }
.catmgr-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); }
.catmgr-row input[type=text] { flex: 1; }
.swatches { display: flex; gap: 6px; flex-wrap: wrap; }
.swatch { width: 22px; height: 22px; border-radius: 6px; cursor: pointer; border: 2px solid transparent; }
.swatch.sel { border-color: var(--text); }
.catfilterbar { display: flex; align-items: center; gap: 8px; padding: 6px 12px; border-bottom: 1px solid var(--border); font-size: 12.5px; color: var(--muted); }
.filterbar { display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-bottom: 1px solid var(--border); }
.filterbar .selall { display: flex; align-items: center; margin-right: 2px; }
.fchip { border: 1px solid var(--border); background: none; color: var(--muted); font-size: 12px; padding: 3px 10px; border-radius: 999px; cursor: pointer; }
.fchip:hover { background: var(--surface-hover); }
.fchip.on { background: var(--tint-soft); color: var(--tint); border-color: transparent; font-weight: 600; }
.msg.thread { cursor: pointer; }
.msg.thread .tchev { align-self: center; color: var(--muted); transition: transform .12s; flex: 0 0 auto; }
.msg.thread .tchev svg { width: 18px; height: 18px; }
.msg.thread .tchev.open { transform: rotate(90deg); }
.msg.child { padding-left: 34px; background: var(--surface); }
.tcount { display: inline-block; background: var(--tint-soft); color: var(--tint); border-radius: 999px; padding: 0 7px; font-size: 11px; font-weight: 600; margin-left: 6px; vertical-align: 1px; }
.iconbtn.danger { color: var(--danger); }
.iconbtn.on { color: var(--tint); background: var(--tint-soft); }
.acts { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.acts .sep { width: 1px; align-self: stretch; margin: 4px 4px; background: var(--border); }
.taskrow { display: flex; align-items: center; gap: 12px; padding: 11px 16px; border-bottom: 1px solid var(--border); }
.taskrow .tck { width: 20px; height: 20px; border: 1.6px solid var(--border); border-radius: 50%; cursor: pointer; display: grid; place-items: center; flex: 0 0 auto; }
.taskrow .tck.done { background: var(--tint); border-color: var(--tint); color: #fff; }
.taskrow.done .tt { text-decoration: line-through; color: var(--muted); }
.taskrow .tt { flex: 1; cursor: pointer; }
.taskrow .td { color: var(--muted); font-size: 12.5px; }
.notecard { padding: 14px 16px; border-bottom: 1px solid var(--border); cursor: pointer; }
.notecard:hover { background: var(--surface-hover); }
.notecard h3 { margin: 0 0 4px; font-size: 15px; }
.notecard p { margin: 0; color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.listpane { height: 100%; display: grid; grid-template-columns: 1fr; min-height: 0; }
.listscroll { overflow-y: auto; }
.docgrid { height: 100%; display: grid; grid-template-columns: 320px 1fr; min-height: 0; }
.doclist { border-right: 1px solid var(--border); overflow-y: auto; }
.docitem { padding: 11px 16px; border-bottom: 1px solid var(--border); cursor: pointer; display: flex; align-items: center; gap: 10px; }
.docitem:hover { background: var(--surface-hover); }
.docitem.active { background: var(--tint-soft); }
.docitem .dn { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.docitem .dm { font-size: 11px; color: var(--muted); }
.editor { display: flex; flex-direction: column; min-height: 0; height: 100%; }
.editor .eh { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--border); }
.editor .eh h2 { font-size: 16px; margin: 0; flex: 1; }
.editor .status { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.editor .pres { display: flex; gap: -6px; align-items: center; }
.editor .pres .av { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 11px; font-weight: 600; border: 2px solid var(--surface-solid); margin-left: -6px; }
.editorwrap { position: relative; flex: 1; min-height: 0; overflow: hidden; }
.editorwrap textarea, .mirror { position: absolute; inset: 0; width: 100%; height: 100%; box-sizing: border-box; border: 0; outline: none; resize: none; padding: 22px 26px; margin: 0; font: 15px/1.6 "Segoe UI", system-ui, sans-serif; white-space: pre-wrap; overflow-wrap: break-word; word-break: break-word; background: transparent; color: var(--text); }
.editorwrap textarea { overflow-y: auto; }
.mirror { visibility: hidden; overflow: hidden; pointer-events: none; color: transparent; }
.cursors { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
.rc { position: absolute; width: 2px; height: 22px; }
.rc .lbl { position: absolute; top: -15px; left: -1px; font-size: 10px; line-height: 14px; padding: 0 4px; border-radius: 3px 3px 3px 0; color: #fff; white-space: nowrap; font-weight: 600; }
.editor textarea:not(.editorwrap textarea) { flex: 1; }
.histrow { padding: 10px 16px; border-bottom: 1px solid var(--border); cursor: pointer; display: flex; align-items: center; gap: 10px; }
.histrow:hover { background: var(--surface-hover); }
.histrow.active { background: var(--tint-soft); }
.histrow .hr { flex: 1; }
.histrow .hd { font-size: 12px; color: var(--muted); }
.histrow .delta { font-size: 12px; font-variant-numeric: tabular-nums; }
.histrow .add { color: var(--ok); }
.histrow .rem { color: var(--danger); }
.histprev { margin-top: 12px; padding: 12px 14px; border: 1px solid var(--border); border-radius: 8px; white-space: pre-wrap; word-break: break-word; font: 13px/1.5 ui-monospace, Menlo, Consolas, monospace; max-height: 40vh; overflow: auto; background: var(--surface-hover); }
.dot-live { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); display: inline-block; }
.dot-off { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; }
.msg.unread .mf { font-weight: 700; }
.msg .top { display: flex; gap: 8px; align-items: baseline; }
.msg .mf { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.msg .dt { font-size: 12px; color: var(--muted); white-space: nowrap; }
.msg .su { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 1px; }
.msg .pv { font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--tint); display: inline-block; }
.reader { overflow-y: auto; padding: 0; display: flex; flex-direction: column; min-height: 0; }
.reader .rh { padding: 16px 20px 12px; border-bottom: 1px solid var(--border); }
.reader h1 { font-size: 20px; margin: 0 0 8px; }
.reader .meta { color: var(--muted); font-size: 13px; }
.reader .acts { display: flex; gap: 8px; padding: 10px 20px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.reader .bodywrap { flex: 1; min-height: 0; }
.reader iframe { width: 100%; height: 100%; border: 0; background: #fff; }
.rembanner { display: flex; align-items: center; gap: 10px; padding: 8px 14px; background: var(--tint-soft); color: var(--text); font-size: 12.5px; border-bottom: 1px solid var(--border); }
.rembanner button { margin-left: auto; border: 1px solid var(--border); background: var(--surface); color: var(--tint); font-size: 12px; font-weight: 600; padding: 4px 12px; border-radius: 7px; cursor: pointer; }
.reader pre.text { margin: 0; padding: 18px 20px; white-space: pre-wrap; word-wrap: break-word; font: inherit; }
.atts { padding: 10px 20px; border-top: 1px solid var(--border); display: flex; gap: 8px; flex-wrap: wrap; }
.att { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border: 1px solid var(--border); border-radius: 20px; font-size: 12.5px; text-decoration: none; color: var(--text); }
.att:hover { background: var(--surface-hover); }
.empty { color: var(--muted); display: grid; place-items: center; height: 100%; text-align: center; padding: 20px; }

/* ---------- panels ---------- */
#overlay:not(:empty) { position: fixed; inset: 0; z-index: 50; }
.scrim { position: absolute; inset: 0; background: rgba(15,23,42,.28); }
.panel { position: absolute; top: 0; right: 0; height: 100%; width: 620px; max-width: 100%; background: var(--surface-solid); border-left: 1px solid var(--border); box-shadow: var(--shadow); display: flex; flex-direction: column; animation: slide .16s ease-out; }
@keyframes slide { from { transform: translateX(16px); opacity: .6; } to { transform: none; opacity: 1; } }
.panel .head { display: flex; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--border); }
.panel .head h2 { font-size: 17px; margin: 0; flex: 1; }
.dialog { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 420px; max-width: calc(100% - 32px); background: var(--surface-solid); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); max-height: 80vh; display: flex; flex-direction: column; }
.dialog .head { display: flex; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--border); }
.dialog .head h2 { font-size: 17px; margin: 0; flex: 1; }
.sclist { padding: 10px 18px 16px; overflow: auto; }
.scrow { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 13.5px; }
.scrow:last-child { border-bottom: 0; }
.scrow kbd { font: 12px ui-monospace, monospace; background: var(--surface-hover); border: 1px solid var(--border); border-radius: 6px; padding: 2px 7px; color: var(--text); white-space: nowrap; }
.panel .cont { padding: 16px 18px; overflow-y: auto; flex: 1; }
.panel .foot { padding: 12px 18px; border-top: 1px solid var(--border); display: flex; gap: 8px; justify-content: flex-end; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
textarea.body { min-height: 260px; resize: vertical; font-family: inherit; }
.composepane { height: 100%; display: flex; flex-direction: column; min-height: 0; }
.composepane .rh { display: flex; align-items: center; gap: 10px; padding: 14px 20px 12px; border-bottom: 1px solid var(--border); }
.composepane .rh h1 { font-size: 18px; margin: 0; flex: 1; }
.cform { flex: 1; overflow-y: auto; padding: 16px 20px; display: flex; flex-direction: column; min-height: 0; }
.cform textarea.body { flex: 1; min-height: 220px; }
.cfoot { display: flex; gap: 8px; align-items: center; padding: 12px 20px; border-top: 1px solid var(--border); }
.rte-toolbar { display: flex; gap: 2px; flex-wrap: wrap; padding: 4px 0 8px; border-bottom: 1px solid var(--border); margin-bottom: 8px; }
.rte-toolbar button { min-width: 30px; height: 30px; padding: 0 7px; border: none; background: none; border-radius: 6px; cursor: pointer; color: var(--text); display: grid; place-items: center; font-size: 14px; }
.rte-toolbar button:hover { background: var(--surface-hover); }
.rte-toolbar button svg { width: 16px; height: 16px; }
.rte { flex: 1; min-height: 220px; overflow-y: auto; border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; outline: none; background: var(--surface-solid); line-height: 1.5; }
.rte:focus { border-color: var(--tint); }
.rte:empty::before { content: attr(data-ph); color: var(--muted); }
.acfield { position: relative; }
.bcctoggle { position: absolute; right: 6px; top: 26px; border: 0; background: none; color: var(--muted); font-size: 12px; cursor: pointer; padding: 3px 6px; border-radius: 6px; }
.bcctoggle:hover { background: var(--surface-hover); color: var(--text); }
.bcctoggle.hidden { display: none; }
.acdrop { position: absolute; left: 0; right: 0; top: 100%; z-index: 70; background: var(--surface-solid); border: 1px solid var(--border); border-radius: 8px; box-shadow: var(--shadow); max-height: 240px; overflow-y: auto; margin-top: 2px; }
.acitem { padding: 7px 10px; cursor: pointer; display: flex; flex-direction: column; }
.acitem:hover, .acitem.sel { background: var(--surface-hover); }
.acitem .nm { font-weight: 500; font-size: 13.5px; }
.acitem .em { color: var(--muted); font-size: 12px; }

/* ---------- calendar ---------- */
.cal { height: 100%; display: flex; flex-direction: column; }
.cal .bar { display: flex; align-items: center; gap: 10px; padding: 12px 16px; }
.cal .bar h2 { margin: 0; font-size: 18px; flex: 1; }
.grid { flex: 1; display: grid; grid-template-columns: repeat(7, 1fr); grid-auto-rows: 1fr; gap: 1px; background: var(--border); border-top: 1px solid var(--border); min-height: 0; }
.dow { background: var(--bg); text-align: center; padding: 6px 0; font-size: 12px; color: var(--muted); grid-row: 1; }
.cell { background: var(--surface-solid); padding: 4px 6px; overflow: hidden; display: flex; flex-direction: column; gap: 3px; cursor: pointer; min-height: 0; }
.cell:hover { background: var(--surface-hover); }
.cell .n { font-size: 12px; color: var(--muted); align-self: flex-end; }
.cell.other { opacity: .4; }
.cell.today .n { background: var(--tint); color: #fff; border-radius: 50%; width: 20px; height: 20px; display: grid; place-items: center; }
.ev { background: var(--tint-soft); color: var(--tint); border-radius: 5px; padding: 2px 6px; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }

/* ---------- contacts ---------- */
.cgrid { height: 100%; display: grid; grid-template-columns: 340px 1fr; min-height: 0; }
.clist { border-right: 1px solid var(--border); overflow-y: auto; }
.citem { padding: 11px 16px; border-bottom: 1px solid var(--border); cursor: pointer; }
.citem:hover { background: var(--surface-hover); }
.citem.active { background: var(--tint-soft); }
.citem .cn { font-weight: 600; }
.citem .ce { font-size: 12.5px; color: var(--muted); }
.cdetail { padding: 28px; overflow-y: auto; }
.avatar { width: 64px; height: 64px; border-radius: 50%; background: var(--tint-soft); color: var(--tint); display: grid; place-items: center; font-size: 26px; font-weight: 600; }
.kv { display: grid; grid-template-columns: 140px 1fr; gap: 6px 14px; margin-top: 18px; }
.kv .k { color: var(--muted); }

.badge { font-size: 11px; padding: 1px 7px; border-radius: 10px; border: 1px solid var(--border); }
.toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 9px 16px; border-radius: 8px; z-index: 100; box-shadow: var(--shadow); }
.toast.bad { background: var(--danger); color: #fff; }
@media (max-width: 820px) {
  #body { grid-template-columns: 1fr; }
  #rail { display: none; }
  .mailgrid, .cgrid, .cal .grid { grid-template-columns: 1fr; }

async function api(method, path, body) {
  const res = await fetch("/mail/api" + path, {
    method, credentials: "same-origin",
    headers: { "Content-Type": "application/json", "X-Ondura-Mail": "1" },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  let data = null; try { data = await res.json(); } catch (e) { data = null; }
  if (res.status === 401 && path !== "/login") { showLogin(); throw new Error("unauthorized"); }
  if (!res.ok) throw new Error((data && data.error) || res.statusText);
  return data;
}
const guard = (fn) => async (...a) => { try { await fn(...a); } catch (e) { if (e.message !== "unauthorized") toast(e.message, true); } };

// Collab API lives under /collab/api with its own CSRF header.
async function capi(method, path, body) {
  const res = await fetch("/collab/api" + path, {
    method, credentials: "same-origin",
    headers: { "Content-Type": "application/json", "X-Ondura-Collab": "1" },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  let data = null; try { data = await res.json(); } catch (e) {}
  if (res.status === 401) { showLogin(); throw new Error("unauthorized"); }
  if (!res.ok) throw new Error((data && data.error) || res.statusText);
  return data;
}

// ---------------------------------------------------------- KEYBOARD SHORTCUTS
function isTypingTarget() { const el = document.activeElement; if (!el) return false; const tag = el.tagName; return tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || el.isContentEditable; }
function composeOpen() { return !!$("#reader .composepane"); }
function overlayOpen() { const o = $("#overlay"); return !!o && o.children.length > 0; }
function focusAdjacent(delta) {
  const list = visibleMessages();
  if (!list.length) return;
  let idx = list.findIndex((m) => m.id === curMsg);
  if (idx < 0) idx = delta > 0 ? -1 : list.length;
  const next = Math.max(0, Math.min(list.length - 1, idx + delta));
  const id = list[next].id;
  openMessage(id);
  setTimeout(() => { const row = $(`.msg[data-id="${id}"]`); if (row) row.scrollIntoView({ block: "nearest" }); }, 0);
}
const SHORTCUTS = [
  ["↑ ↓  /  j k", "navigate"], ["Enter", "openMsg"], ["c  /  n", "newMessage"],
  ["r", "reply"], ["Shift+R  /  a", "replyAll"], ["f", "forward"],
  ["e", "archive"], ["Del  /  #", "delete"], ["u", "markUnread"], ["m", "moveTo"],
  ["/", "search"], ["Esc", "close"], ["?", "shortcuts"],
];
function showShortcuts() {
  const rows = SHORTCUTS.map(([k, label]) => `<div class="scrow"><span>${esc(t(label))}</span><kbd>${k}</kbd></div>`).join("");
  const close = () => { $("#overlay").innerHTML = ""; };
  $("#overlay").innerHTML = `<div class="scrim"></div><div class="dialog"><div class="head"><h2>${esc(t("shortcuts"))}</h2><button class="iconbtn" id="scClose"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button></div><div class="sclist">${rows}</div></div>`;
  $("#overlay .scrim").onclick = close; $("#scClose").onclick = close;
}
document.addEventListener("keydown", (e) => {
  if ($("#app").classList.contains("hidden")) return; // not signed in
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  // Escape unwinds whatever is open, innermost first.
  if (e.key === "Escape") {
    if ($("#ctxMenu")) { closeMenu(); return; }
    if (overlayOpen()) { $("#overlay").innerHTML = ""; return; }
    if (composeOpen()) { const c = $("#cClose"); if (c) c.click(); return; }
    const am = $("#acctMenu"); if (am && !am.classList.contains("hidden")) { am.classList.add("hidden"); return; }
    if (view === "mail" && curMsg) { curMsg = null; const r = $("#reader"); if (r) r.innerHTML = `<div class="empty">${esc(t("selectMessage"))}</div>`; renderMsgList(); }
    return;
  }
  if (isTypingTarget() || composeOpen() || overlayOpen()) return;
  if (e.key === "/") { e.preventDefault(); $("#q").focus(); return; }
  if (e.key === "?") { e.preventDefault(); showShortcuts(); return; }
  if (e.key === "c" || e.key === "n") { e.preventDefault(); openCompose({}); return; }
  if (view !== "mail") return;
  if (e.key === "ArrowDown" || e.key === "j") { e.preventDefault(); focusAdjacent(1); return; }
  if (e.key === "ArrowUp" || e.key === "k") { e.preventDefault(); focusAdjacent(-1); return; }
  if (e.key === "Enter") { if (curMsg) { e.preventDefault(); openMessage(curMsg); } return; }
  if (!curMsg) return;
  const id = curMsg;
  if (e.key === "r") { e.preventDefault(); actReply(id, "reply"); }
  else if (e.key === "R" || e.key === "a") { e.preventDefault(); actReply(id, "replyAll"); }
  else if (e.key === "f") { e.preventDefault(); actReply(id, "forward"); }
  else if (e.key === "e") { e.preventDefault(); guard(() => actArchive(id))(); }
  else if (e.key === "Delete" || e.key === "#") { e.preventDefault(); guard(() => actDelete(id))(); }
  else if (e.key === "u") { e.preventDefault(); const it = messages.find((x) => x.id === id); const read = !!(it && it.flags && it.flags.read); guard(() => actRead(id, !read))(); }
  else if (e.key === "m") { e.preventDefault(); const row = $(`.msg[data-id="${id}"]`); openMoveMenu(row || $("#reader"), async (fid) => { await api("POST", "/move", { id, folder: fid }); afterMsgGone(id); }); }
});

async function start() {
  // A file/folder share link opens a read-only guest view, account or not.
  const shareTok = (location.hash.match(/[#&]s=([a-f0-9]+)/) || [])[1];
  if (shareTok) return openGuestShare(shareTok);
  // A share link may open a document directly (as a signed-in user or a guest).
  const linkTok = (location.hash.match(/link=([a-f0-9]+)/) || [])[1];
  // Probe the session without triggering the login screen.
  let session = null;
  try {
    const res = await fetch("/mail/api/me", { credentials: "same-origin", headers: { "X-Ondura-Mail": "1" } });
    if (res.ok) session = await res.json();
  } catch (e) {}
  if (!session) {
    if (linkTok) return openGuestDoc(linkTok);
    showLogin();
    return;
  }
  me = session;
  $("#login").classList.add("hidden"); $("#app").classList.remove("hidden");
  renderAcct();
  folders = me.folders.filter((f) => f.role !== "root");
  curFolder = folders.find((f) => f.role === "inbox") || folders[0];
  loadCategories();
  if (linkTok) {
    let info = null; try { info = await capi("GET", "/link/" + linkTok); } catch (e) {}
    if (info && info.docId) { view = "documents"; renderDocuments(); setTimeout(() => openDoc(info.docId), 0); return; }
  }
  routeAndRender();
}

// Each app has its own URL (/mail, /files, /sharepoint[/<id>[/<folder>]],
// /tasks, /notes, / for the hub); the SPA reads the path to decide what to show.
function routeFromPath() {
  const seg = location.pathname.split("/").filter(Boolean);
  switch (seg[0]) {
    case "mail": return { view: "mail" };
    case "files": fs.parent = seg[1] ? +seg[1] : null; return { view: "files" };
    case "sharepoint": fs.driveId = seg[1] ? +seg[1] : null; fs.parent = seg[2] ? +seg[2] : null; return { view: "sharepoint" };
    case "tasks": return { view: "tasks" };
    case "notes": return { view: "notes" };
    default: return { view: "home" };
  }
}
function routeAndRender() {
  const r = routeFromPath();
  view = ((r.view === "files" || r.view === "sharepoint") && !(me && me.cloud)) ? "home" : r.view;
  render();
}
function appPath(v, o) {
  o = o || {};
  if (v === "files") return "/files" + (o.parent ? "/" + o.parent : "");
  if (v === "sharepoint") return "/sharepoint" + (o.drive ? "/" + o.drive : "") + (o.drive && o.parent ? "/" + o.parent : "");
  if (v === "mail" || v === "calendar" || v === "contacts") return "/mail";
  if (v === "tasks") return "/tasks";
  if (v === "notes") return "/notes";
  return "/";
}
window.addEventListener("popstate", () => { if (me) routeAndRender(); });

// Open a file or folder share link without an account (read-only guest view).
const gs = { token: null, root: null, parent: null };
async function openGuestShare(token) {
  gs.token = token;

  try { meta = await (await fetch(`/mail/api/cloud/shared/${token}`)).json(); } catch (e) { meta = null; }
  if (!meta || meta.error || !meta.kind) {

  const prev = canPreview(meta.contentType) ? previewHtml(meta.contentType, url + (url.includes("?") ? "&" : "?") + "inline=1", meta.name) : "";
  guestChrome(`<div style="flex:1;overflow:auto;display:grid;place-items:center;padding:24px">
    <div style="max-width:720px;width:100%;text-align:center">

      <h2 style="margin:0 0 4px;font-size:18px">${esc(meta.name)}</h2>
      <div style="color:var(--muted);font-size:13px;margin-bottom:16px">${esc(fmtSize(meta.size || 0))}</div>
      <a class="btn" href="${esc(url)}" download style="display:inline-flex;text-decoration:none">${icon("inbox")}<span>${esc(t("download"))}</span></a>
      ${prev ? `<div style="margin-top:20px">${prev}</div>` : ""}
    </div></div>`);
}

async function renderGuestFolder() {
  let data = { items: [], path: [] };
  try { data = await (await fetch(`/mail/api/cloud/shared/${gs.token}/items?parent=${gs.parent}`)).json(); } catch (e) {}
  const items = data.items || [];
  const crumbs = (data.path || []).map((p, i) => `<span style="color:var(--muted)">${i ? "/" : ""}</span><button style="background:none;border:0;color:var(--muted);cursor:pointer;padding:0 2px;font-size:13px" data-gcrumb="${p.id}">${esc(p.name)}</button>`).join("");
  const rows = items.length
    ? items.map((it) => {
      const ic = it.kind === "folder" ? "folder" : it.kind === "doc" ? "doc" : "paperclip";
      const meta = it.kind === "file" ? fmtSize(it.size) : "";
      return `<div class="taskrow" data-gopen="${it.id}" data-gkind="${it.kind}" style="cursor:pointer"><div style="color:var(--muted);display:flex">${icon(ic)}</div><div class="tt" style="flex:1;min-width:0"><div style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(it.name)}</div></div><div style="font-size:11.5px;color:var(--muted)">${esc(meta)}</div></div>`;
    }).join("")
    : `<div class="empty">${esc(t("emptyFolder"))}</div>`;
  guestChrome(`<div style="padding:10px 18px;font-size:16px;font-weight:600">${esc(gs.root.name)}</div>
    <div style="display:flex;gap:4px;align-items:center;padding:0 18px 8px;font-size:13px;flex-wrap:wrap">${crumbs}</div>
    <div style="flex:1;overflow:auto;padding:0 12px 16px">${rows}</div>`);
  $("#app").querySelectorAll("[data-gcrumb]").forEach((b) => b.onclick = () => { gs.parent = +b.dataset.gcrumb; renderGuestFolder(); });
  $("#app").querySelectorAll("[data-gopen]").forEach((el) => el.onclick = () => {
    const id = +el.dataset.gopen, kind = el.dataset.gkind;
    if (kind === "folder") { gs.parent = id; renderGuestFolder(); }
    else if (kind === "file") location.href = `/mail/api/cloud/shared/${gs.token}/download?item=${id}`;
  });
}

function canPreview(ct) { ct = ct || ""; return ct.startsWith("image/") || ct === "application/pdf" || ct.startsWith("text/"); }
function previewHtml(ct, url, name) {
  if ((ct || "").startsWith("image/")) return `<img src="${esc(url)}" alt="${esc(name)}" style="max-width:100%;border-radius:10px;border:1px solid var(--border)">`;
  return `<iframe src="${esc(url)}" style="width:100%;height:70vh;border:1px solid var(--border);border-radius:10px;background:#fff"></iframe>`;
}

// ------------------------------------------------------------ rail + routing
const FOLDER_ORDER = ["inbox", "drafts", "sentitems", "archive", "junkemail", "deleteditems", "outbox"];
function folderLabel(f) { return f.role && T[lang][f.role] ? t(f.role) : f.name; }
function mailFolders() {
  const mail = folders.filter((f) => f.class === "mail");
  return mail.sort((a, b) => (FOLDER_ORDER.indexOf(a.role) + 1 || 99) - (FOLDER_ORDER.indexOf(b.role) + 1 || 99));
}
// Each app is its own system: the rail shows that app's own navigation only
// (mail folders, or cloud drives), not a cross-app switcher. Apps are switched
// from the home dashboard or the app launcher.
function renderRail() {
  let html = "";
  if (inMailApp(view)) {
    // Inner navigation of the Mail app (Outlook-style): mail, calendar, contacts.
    const inner = [["mail", "mail"], ["calendar", "calendar"], ["contacts", "contacts"]];
    html += inner.map(([k, ic]) => `<div class="navitem ${view === k ? "active" : ""}" data-view="${k}">${icon(ic)}<span>${esc(t(k))}</span></div>`).join("");
    if (view === "mail") {
      html += `<div class="railsep"></div><div class="folder" id="addFolder" style="color:var(--muted)">${icon("plus")}<span class="nm">${esc(t("newFolder"))}</span></div>`;
      html += mailFolders().map((f) => {
        const custom = !f.role;
        return `<div class="folder ${curFolder && f.id === curFolder.id ? "active" : ""}" data-folder="${f.id}">${icon(f.role || "folder")}<span class="nm">${esc(folderLabel(f))}</span>${custom ? `<button class="iconbtn fmenu" data-fid="${f.id}" data-fname="${esc(f.name)}" style="width:22px;height:22px">${icon("dots")}</button>` : ""}${f.unread ? `<span class="ct">${f.unread}</span>` : ""}</div>`;
      }).join("");
    }
  } else if (view === "sharepoint") {
    const libs = (typeof fs !== "undefined" && fs.drives ? fs.drives : []).filter((d) => d.kind === "library");
    html += libs.map((d) => `<div class="navitem ${fs.driveId === d.id ? "active" : ""}" data-drive="${d.id}">${icon("share")}<span>${esc(d.name)}</span></div>`).join("");
    html += `<div class="railsep"></div><div class="navitem" id="railNewLib" style="color:var(--muted)">${icon("plus")}<span>${esc(t("newLibrary"))}</span></div>`;
  } else if (view === "files") {
    html += `<div class="navitem ${!fs.recentView ? "active" : ""}" id="railMyFiles">${icon("cloud")}<span>${esc(t("myFiles"))}</span></div>`;
    html += `<div class="navitem ${fs.recentView ? "active" : ""}" id="railRecent">${icon("clock")}<span>${esc(t("recent"))}</span></div>`;
  }
  $("#rail").innerHTML = html;
  $("#rail").querySelectorAll("[data-folder]").forEach((e) => e.onclick = (ev) => { if (ev.target.closest(".fmenu")) return; curFolder = folders.find((f) => f.id == e.dataset.folder); curMsg = null; selected.clear(); catFilter = null; msgFilter = "all"; $("#q").value = ""; render(); });
  const af = $("#addFolder"); if (af) af.onclick = guard(async () => { const name = prompt(t("folderName")); if (!name || !name.trim()) return; await api("POST", "/folder", { name: name.trim() }); await refreshFolders(); renderRail(); toast(t("saved")); });
  $("#rail").querySelectorAll(".fmenu").forEach((b) => b.onclick = guard(async (ev) => {
    ev.stopPropagation();
    const rename = confirm(t("rename") + " — OK\n" + t("delete") + " — " + t("cancel"));
    if (rename) { const name = prompt(t("folderName"), b.dataset.fname); if (name && name.trim()) { await api("POST", "/folder/rename", { id: +b.dataset.fid, name: name.trim() }); } }
    else { if (!confirm(t("confirmDeleteFolder"))) return; await api("POST", "/folder/delete", { id: +b.dataset.fid }); if (curFolder && curFolder.id == b.dataset.fid) curFolder = folders.find((f) => f.role === "inbox"); }
    await refreshFolders(); render();
  }));
  $("#rail").querySelectorAll("[data-drive]").forEach((e) => e.onclick = () => { fs.driveId = +e.dataset.drive; fs.parent = null; fs.trashView = false; history.pushState({}, "", appPath("sharepoint", { drive: fs.driveId })); renderFiles(); });
  const rnl = $("#railNewLib"); if (rnl) rnl.onclick = guard(async () => { const name = prompt(t("libraryName")); if (!name) return; const r = await api("POST", "/cloud/library", { name: name.trim() }); fs.drives = []; fs.driveId = r.id; fs.parent = null; renderFiles(); });
  const rmf = $("#railMyFiles"); if (rmf) rmf.onclick = () => { fs.recentView = false; fs.parent = null; renderFiles(); };
  const rr = $("#railRecent"); if (rr) rr.onclick = () => { fs.recentView = true; renderFiles(); };
}

// Top-level apps shown on the home dashboard and in the app launcher. Mail
// bundles mail, calendar and contacts (Outlook-style); Files (personal, like
// OneDrive), SharePoint (shared libraries), Tasks and Notes are their own apps.
// Admins also get a link to the Admin Center.
function appList() {
  const a = [{ k: "mail", ic: "mail", c: "#4f6ef7" }];
  if (me && me.cloud) { a.push({ k: "files", ic: "cloud", c: "#16a34a" }); a.push({ k: "sharepoint", ic: "share", c: "#0d9488" }); }
  a.push({ k: "tasks", ic: "tasks", c: "#0ea5e9" });
  a.push({ k: "notes", ic: "note", c: "#8b5cf6" });
  if (me && me.admin) a.push({ k: "admin", ic: "shield", c: "#e11d48", ext: "/admin/" });
  return a;
}
function navTo(k) {
  const a = appList().find((x) => x.k === k);
  if (a && a.ext) { location.href = a.ext; return; }
  view = k; curMsg = null; selected.clear(); catFilter = null; msgFilter = "all";
  fs.trashView = false; fs.recentView = false;
  if (k === "files") fs.parent = null;
  if (k === "sharepoint") { fs.driveId = null; fs.parent = null; }
  history.pushState({}, "", appPath(k, {}));
  render();
}
function appTiles() {
  return appList().map((a) => `<button class="apptile" data-app="${a.k}"><span class="appicon" style="background:${a.c}22;color:${a.c}">${icon(a.ic)}</span><span>${esc(t(a.k))}</span></button>`).join("");
}
function greeting() { const h = new Date().getHours(); return h < 11 ? t("gMorning") : h < 18 ? t("gAfternoon") : t("gEvening"); }
function renderHome() {
  const name = me && me.name ? me.name.split(" ")[0] : "";
  const hi = name ? `${greeting()}, ${name}` : "Ondura";
  $("#view").innerHTML = `<div class="homewrap"><div class="homehd"><h1>${esc(hi)}</h1><p>${esc(t("hub"))}</p></div><div class="appgrid">${appTiles()}</div></div>`;
  $("#view").querySelectorAll("[data-app]").forEach((e) => e.onclick = () => navTo(e.dataset.app));
}
function openApps() {
  closeMenu();
  const m = document.createElement("div"); m.id = "ctxMenu"; m.className = "glass";
  m.style.cssText = "position:fixed;top:52px;left:10px;z-index:70;padding:12px;width:300px";
  m.innerHTML = `<div class="appgrid mini">${appTiles()}</div>`;
  document.body.appendChild(m);
  m.querySelectorAll("[data-app]").forEach((e) => e.onclick = () => { closeMenu(); navTo(e.dataset.app); });
  setTimeout(() => document.addEventListener("click", closeMenu, { once: true }), 0);
}
function render() {
  applyTexts();
  const mailApp = inMailApp(view);
  const hasRail = mailApp || view === "sharepoint" || view === "files";
  document.getElementById("app").classList.toggle("norail", !hasRail);
  // Compose and mail search belong to the Mail app only.
  $("#composeBtn").style.display = mailApp ? "" : "none";
  const sb = document.querySelector(".search"); if (sb) sb.style.display = mailApp ? "" : "none";
  renderRail();
  if (view === "home") renderHome();
  else if (view === "mail") renderMail();
  else if (view === "calendar") renderCalendar();
  else if (view === "contacts") renderContacts();
  else if (view === "tasks") renderTasks();
  else if (view === "notes") renderNotes();
  else if (view === "documents") renderDocuments();
  else if (view === "files" || view === "sharepoint") renderFiles();
}

}

// ------------------------------------------------------------ MESSAGE ACTIONS
// Shared command surface used by both the reader ribbon and the list context menu.
function archiveFolder() { return folders.find((f) => f.role === "archive"); }
function inArchive() { return curFolder && curFolder.role === "archive"; }
function clearReader() {
  const r = $("#reader"); if (r) r.innerHTML = `<div class="empty">${esc(t("selectMessage"))}</div>`;
}
function afterMsgGone(id) { if (curMsg === id) { curMsg = null; clearReader(); } loadMessages(); refreshFolders(); }
async function fetchFull(id) { return api("GET", "/message/" + id); }
async function actReply(id, mode) { const m = await fetchFull(id); openCompose({ mode, msg: m }); }
async function actDelete(id) { await api("POST", "/delete", { id }); afterMsgGone(id); toast(t("deleted")); }
async function actArchive(id) {
  const af = archiveFolder();
  if (!af) { toast(t("noArchive"), true); return; }
  await api("POST", "/move", { id, folder: af.id }); afterMsgGone(id); toast(t("saved"));
}
async function actFlag(id, flagged) {

  const it = messages.find((x) => x.id === id); if (it) it.flags.flagged = flagged;
  renderMsgList();
}
async function actRead(id, read) {

function actPrint(m) {
  const w = window.open("", "_blank", "width=820,height=680");
  if (!w) { toast(t("print"), true); return; }
  const body = m.html || `<pre style="white-space:pre-wrap;font:14px/1.5 system-ui">${esc(m.text || "")}</pre>`;
  const to = (m.to || []).map(personStr).join(", ");
  w.document.write(`<!doctype html><meta charset="utf-8"><title>${esc(m.subject || "")}</title>` +
    `<style>body{font:14px/1.5 "Segoe UI",system-ui,sans-serif;color:#1b1f27;margin:28px}h1{font-size:19px;margin:0 0 4px}.hd{color:#555;font-size:12px;border-bottom:1px solid #ddd;padding-bottom:12px;margin-bottom:16px}img{max-width:100%}</style>` +
    `<h1>${esc(m.subject || "")}</h1>` +
    `<div class="hd">${esc(personStr(m.from))} &lt;${esc(m.from ? m.from.email : "")}&gt; · ${esc(fmtDate(m.date))}<br>${esc(t("to"))}: ${esc(to)}` +
    `${m.cc && m.cc.length ? "<br>" + esc(t("cc")) + ": " + esc(m.cc.map(personStr).join(", ")) : ""}</div>${body}`);
  w.document.close(); w.focus(); setTimeout(() => { try { w.print(); } catch (e) {} }, 300);

// Right-click context menu on a list row.
function openMsgContext(ev, id) {

// Popup to toggle categories on a message (stays open for multiple toggles).

function normSubject(s) { return (s || "").replace(/^((re|aw|fwd|wg|fw)\s*:\s*)+/i, "").trim().toLowerCase(); }
// Group a folder's messages into conversations by the Message-ID / In-Reply-To /
// References graph (union-find), falling back to a shared normalized subject.
function buildThreads(list) {
  const parent = {};
  const nodeKey = (m) => m.messageId || ("id:" + m.id);
  const find = (x) => { while (parent[x] !== x) { parent[x] = parent[parent[x]]; x = parent[x]; } return x; };
  const union = (a, b) => { const ra = find(a), rb = find(b); if (ra !== rb) parent[ra] = rb; };
  list.forEach((m) => { const k = nodeKey(m); if (parent[k] === undefined) parent[k] = k; });
  const byMsgId = new Map();
  list.forEach((m) => { if (m.messageId) byMsgId.set(m.messageId, m); });
  // Link each message to any referenced ancestor present in the folder.
  list.forEach((m) => {
    const refs = [];
    if (m.inReplyTo) refs.push(m.inReplyTo);
    if (m.references) m.references.split(/\s+/).forEach((r) => { if (r) refs.push(r); });
    refs.forEach((rid) => { if (byMsgId.has(rid)) union(nodeKey(m), rid); });
  });
  // Fallback: messages sharing a normalized subject join the same conversation.
  const bySubject = new Map();
  list.forEach((m) => { const s = normSubject(m.subject); if (!s) return; if (!bySubject.has(s)) bySubject.set(s, []); bySubject.get(s).push(m); });
  bySubject.forEach((ms) => { for (let i = 1; i < ms.length; i++) union(nodeKey(ms[0]), nodeKey(ms[i])); });
  const groups = new Map();
  list.forEach((m) => { const r = find(nodeKey(m)); if (!groups.has(r)) groups.set(r, { key: r, msgs: [] }); groups.get(r).msgs.push(m); });
  const out = [...groups.values()];
  out.forEach((g) => g.msgs.sort((a, b) => b.date - a.date));
  out.sort((a, b) => b.msgs[0].date - a.msgs[0].date);
  return out;
}

    close(); input.focus();
  };

    const { q } = token();
    if (q.length < 1) { close(); return; }

    matches = recips.filter((r) => r.email.toLowerCase().includes(ql) || (r.name || "").toLowerCase().includes(ql)).slice(0, 7);
    if (!matches.length) { close(); return; }
    if (sel >= matches.length) sel = matches.length - 1;
    if (!drop) { drop = document.createElement("div"); drop.className = "acdrop"; input.parentNode.appendChild(drop); }
    drop.innerHTML = matches.map((m, i) => `<div class="acitem ${i === sel ? "sel" : ""}" data-i="${i}"><span class="nm">${esc(m.name || m.email)}</span><span class="em">${esc(m.email)}</span></div>`).join("");

// ------------------------------------------------------------ COLLAB: OT library
// Operations are arrays of: number>0 retain, number<0 delete, string insert.
// Counting is in UTF-16 units, matching the server exactly.
function oRetain(op, n) { if (n <= 0) return; const l = op[op.length - 1]; if (typeof l === "number" && l > 0) op[op.length - 1] += n; else op.push(n); }

function oInsert(op, s) {
  if (!s) return; const l = op[op.length - 1];
  if (typeof l === "string") op[op.length - 1] += s;
  else if (typeof l === "number" && l < 0) { const del = op.pop(); const l2 = op[op.length - 1]; if (typeof l2 === "string") op[op.length - 1] += s; else op.push(s); op.push(del); }
  else op.push(s);
}
function cRetain(q, v, m) { if (m < v) q[0] = v - m; else q.shift(); }
function cDelete(q, v, m) { if (m < -v) q[0] = v + m; else q.shift(); }

function composeOp(a, b) {
  a = a.slice(); b = b.slice(); const o = [];
  while (a.length || b.length) {
    const x = a[0], y = b[0];
    if (typeof x === "number" && x < 0) { oDelete(o, -x); a.shift(); continue; }
    if (typeof y === "string") { oInsert(o, y); b.shift(); continue; }
    if (x === undefined || y === undefined) throw new Error("compose mismatch");
    if (typeof x === "number" && x > 0 && typeof y === "number" && y > 0) { const m = Math.min(x, y); oRetain(o, m); cRetain(a, x, m); cRetain(b, y, m); }
    else if (typeof x === "number" && x > 0 && typeof y === "number" && y < 0) { const m = Math.min(x, -y); oDelete(o, m); cRetain(a, x, m); cDelete(b, y, m); }
    else if (typeof x === "string" && typeof y === "number" && y > 0) { const m = Math.min(x.length, y); oInsert(o, x.slice(0, m)); cStr(a, x, m); cRetain(b, y, m); }
    else if (typeof x === "string" && typeof y === "number" && y < 0) { const m = Math.min(x.length, -y); cStr(a, x, m); cDelete(b, y, m); }
    else throw new Error("compose bad");
  }

}
function transformOp(a, b) {
  a = a.slice(); b = b.slice(); const ap = [], bp = [];
  while (a.length || b.length) {
    const x = a[0], y = b[0];
    if (typeof x === "string") { oInsert(ap, x); oRetain(bp, x.length); a.shift(); continue; }
    if (typeof y === "string") { oRetain(ap, y.length); oInsert(bp, y); b.shift(); continue; }
    if (x === undefined || y === undefined) throw new Error("transform mismatch");
    const xr = x > 0, xd = x < 0, yr = y > 0, yd = y < 0;
    if (xr && yr) { const m = Math.min(x, y); oRetain(ap, m); oRetain(bp, m); cRetain(a, x, m); cRetain(b, y, m); }
    else if (xd && yd) { const m = Math.min(-x, -y); cDelete(a, x, m); cDelete(b, y, m); }
    else if (xd && yr) { const m = Math.min(-x, y); oDelete(ap, m); cDelete(a, x, m); cRetain(b, y, m); }
    else if (xr && yd) { const m = Math.min(x, -y); oDelete(bp, m); cRetain(a, x, m); cDelete(b, y, m); }
    else throw new Error("transform bad");
  }
  return [ap, bp];
}
function diffOp(a, b) {
  if (a === b) return null;
  let p = 0; const minL = Math.min(a.length, b.length);
  while (p < minL && a[p] === b[p]) p++;
  let s = 0;
  while (s < minL - p && a[a.length - 1 - s] === b[b.length - 1 - s]) s++;
  const del = a.length - p - s, ins = b.slice(p, b.length - s);
  const op = []; oRetain(op, p); if (del > 0) oDelete(op, del); if (ins) oInsert(op, ins); oRetain(op, s);
  return op;
}
function transformCursor(pos, op) {
  let res = pos, i = 0;

    if (typeof c === "string") { if (i < pos) res += c.length; }
    else if (c > 0) i += c;
    else { const d = -c; if (i < pos) res -= Math.min(d, pos - i); i += d; }
  }
  return Math.max(0, res);
}

function connectDoc(id, canWrite, linkToken) {
  if (docWs) { try { docWs.close(); } catch (e) {} }
  const proto = location.protocol === "https:" ? "wss" : "ws";
  const q = `doc=${id}` + (linkToken ? `&link=${encodeURIComponent(linkToken)}` : "");
  const ws = new WebSocket(`${proto}://${location.host}/collab/ws?${q}`);
  docWs = ws;
  const ta = $("#docArea");
  const E = { ws, rev: 0, docText: "", state: "sync", pending: null, buffer: null, applying: false, canWrite };
  const remote = {}; // conn id -> { pos, name, color, ts }
  const setStatus = (live) => { const s = $("#docStatus"); if (s) s.innerHTML = `<span class="${live ? "dot-live" : "dot-off"}"></span>${live ? esc(t("online")) : esc(t("connecting"))}`; };
  function caretXY(pos) {
    const mir = $("#docMirror"); if (!mir) return { x: 0, y: 0 };
    mir.textContent = E.docText.slice(0, pos);
    const span = document.createElement("span"); span.textContent = "​"; mir.appendChild(span);
    const x = span.offsetLeft, y = span.offsetTop; mir.textContent = "";
    return { x, y };
  }
  function renderCursors() {
    const cont = $("#docCursors"); if (!cont || !ta) return;
    const now = Date.now(); const html = [];
    for (const [by, c] of Object.entries(remote)) {
      if (now - c.ts > 9000) { delete remote[by]; continue; }
      const { x, y } = caretXY(Math.min(c.pos, E.docText.length));
      html.push(`<div class="rc" style="left:${x}px;top:${y - ta.scrollTop}px;background:${esc(c.color)}"><span class="lbl" style="background:${esc(c.color)}">${esc(c.name)}</span></div>`);
    }
    cont.innerHTML = html.join("");
  }
  let curTimer;
  const sendCursor = () => { if (ws.readyState === 1 && ta) ws.send(JSON.stringify({ type: "cursor", pos: ta.selectionStart, anchor: ta.selectionEnd })); };
  const queueCursor = () => { clearTimeout(curTimer); curTimer = setTimeout(sendCursor, 120); };
  ws.onclose = () => setStatus(false);
  ws.onerror = () => setStatus(false);
  ws.onmessage = (ev) => {
    const m = JSON.parse(ev.data);
    if (m.type === "init") {
      E.rev = m.rev; E.docText = m.content; if (ta) { E.applying = true; ta.value = m.content; E.applying = false; } setStatus(true);
    } else if (m.type === "ack") {
      E.rev = m.rev;
      if (E.state === "await") { E.pending = null; E.state = "sync"; }
      else if (E.state === "awaitBuf") { E.pending = E.buffer; E.buffer = null; E.state = "await"; ws.send(JSON.stringify({ type: "op", rev: E.rev, op: E.pending })); }
    } else if (m.type === "op") {
      E.rev = m.rev;
      let toApply;
      if (E.state === "sync") toApply = m.op;
      else if (E.state === "await") { const [pp, o1] = transformOp(E.pending, m.op); E.pending = pp; toApply = o1; }
      else { const [pp, o1] = transformOp(E.pending, m.op); const [bb, o2] = transformOp(E.buffer, o1); E.pending = pp; E.buffer = bb; toApply = o2; }
      // shift remote carets through the applied change
      for (const c of Object.values(remote)) c.pos = transformCursor(c.pos, toApply);
      if (ta) {
        const a = ta.selectionStart, b = ta.selectionEnd;
        E.applying = true; const nv = applyOp(E.docText, toApply); ta.value = nv; E.docText = nv;
        ta.selectionStart = transformCursor(a, toApply); ta.selectionEnd = transformCursor(b, toApply); E.applying = false;
      } else { E.docText = applyOp(E.docText, toApply); }
      renderCursors();
    } else if (m.type === "presence") {
      const box = $("#docPres"); if (box) box.innerHTML = (m.users || []).slice(0, 6).map((u) => `<span class="av" title="${esc(u.name)}" style="background:${esc(u.color)}">${esc((u.name || "?").trim()[0] || "?").toUpperCase()}</span>`).join("");
    } else if (m.type === "cursor") {
      remote[m.by] = { pos: m.pos || 0, name: m.name || "", color: m.color || "#888", ts: Date.now() };
      renderCursors();
    } else if (m.type === "reset") {

    }
  };

      for (const c of Object.values(remote)) c.pos = transformCursor(c.pos, op);
      if (E.state === "sync") { E.pending = op; E.state = "await"; ws.send(JSON.stringify({ type: "op", rev: E.rev, op })); }
      else if (E.state === "await") { E.buffer = op; E.state = "awaitBuf"; }
      else { E.buffer = composeOp(E.buffer, op); }
      renderCursors(); queueCursor();
    };
  }
}

  const emptyBtn = items.length ? `<button class="btn" id="fEmptyBin">${icon("trash")}<span>${esc(t("emptyBin"))}</span></button>` : "";
  $("#view").innerHTML = `<div style="display:flex;flex-direction:column;height:100%">
    <div class="glass" style="display:flex;gap:8px;align-items:center;padding:10px 16px;flex-wrap:wrap;border-radius:0">
      <button class="btn" id="fBackFiles"><span>←&nbsp;${esc(t("back"))}</span></button>
      <h2 style="flex:1;font-size:16px;margin:0">${esc(t("recycleBin"))}</h2>
      <div style="display:flex;gap:6px;flex-wrap:wrap">${emptyBtn}</div>
    </div>
    <div style="flex:1;overflow:auto;padding:8px 10px 16px">${rows}</div></div>`;
  $("#fBackFiles").onclick = () => { fs.trashView = false; renderFiles(); };
  const eb = $("#fEmptyBin"); if (eb) eb.onclick = guard(async () => { if (!confirm(t("confirmEmptyBin"))) return; await api("POST", "/cloud/trash/empty", { drive: fs.driveId }); renderTrash(); });
  $("#view").querySelectorAll("[data-restore]").forEach((el) => el.onclick = guard(async () => { await api("POST", "/cloud/trash/restore", { item: +el.dataset.restore }); renderTrash(); toast(t("restored")); }));
  $("#view").querySelectorAll("[data-purge]").forEach((el) => el.onclick = guard(async () => { if (!confirm(t("confirmPurge"))) return; await api("POST", "/cloud/trash/delete", { item: +el.dataset.purge }); renderTrash(); }));
}

// Recently updated files and documents across the personal drive and libraries.
async function renderRecent() {
  let items = [];
  try { items = (await api("GET", "/cloud/recent?limit=50")).items || []; } catch (e) {}
  const rows = items.length
    ? items.map((it) => {
      const ic = it.kind === "doc" ? "doc" : "paperclip";
      const meta = it.kind === "file" ? fmtSize(it.size) : t("documents");
      const loc = it.driveKind === "personal" ? t("myFiles") : it.driveName;
      return `<div class="taskrow" data-ropen="${it.id}" data-rkind="${it.kind}" data-rdoc="${it.doc || ""}" data-rct="${esc(it.contentType || "")}" data-rname="${esc(it.name)}" style="cursor:pointer"><div style="color:var(--muted);display:flex">${icon(ic)}</div><div class="tt" style="flex:1;min-width:0"><div style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(it.name)}</div><div style="font-size:11px;color:var(--muted)">${esc(loc)}</div></div><div style="font-size:11.5px;color:var(--muted)">${esc(meta)}</div></div>`;
    }).join("")
    : `<div class="empty">${esc(t("noRecent"))}</div>`;
  $("#view").innerHTML = `<div style="display:flex;flex-direction:column;height:100%">
    <div class="glass" style="display:flex;gap:8px;align-items:center;padding:10px 16px;border-radius:0">
      <h2 style="flex:1;font-size:16px;margin:0">${esc(t("recent"))}</h2>
    </div>
    <div style="flex:1;overflow:auto;padding:8px 10px 16px">${rows}</div></div>`;
  $("#view").querySelectorAll("[data-ropen]").forEach((el) => el.onclick = () => {
    const kind = el.dataset.rkind;
    if (kind === "doc") return openCloudDoc(+el.dataset.rdoc);
    const it = { id: +el.dataset.ropen, kind: "file", contentType: el.dataset.rct, name: el.dataset.rname };
    if (canPreview(it.contentType)) previewItem(it); else downloadItem(it);
  });
}

function openItem(it) {
  if (!it) return;
  if (it.kind === "folder") { fs.parent = it.id; renderFiles(); }
  else if (it.kind === "doc") openDriveDoc(it.doc);
  else if (canPreview(it.contentType)) previewItem(it);
  else downloadItem(it);
}

// A lightweight preview for images, PDFs and text, with a download fallback.
function previewItem(it) {
  const url = "/mail/api/cloud/download/" + it.id;
  const body = previewHtml(it.contentType, url, it.name);
  panel(it.name,
    `<div style="margin:-4px 0 0">${body}</div>`,
    `<div style="flex:1"></div><a class="btn" href="${esc(url)}" download style="text-decoration:none">${icon("inbox")}<span>${esc(t("download"))}</span></a><button class="btn primary" id="pvClose">${esc(t("close") || t("cancel"))}</button>`);
  const c = $("#pvClose"); if (c) c.onclick = closePanel;
}

function openDriveDoc(docId) { openCloudDoc(docId); }

// A collaborative document now lives only inside the cloud; open it in a
// focused editor reached from Files (no separate Documents section).
async function openCloudDoc(id) {
  const back = (view === "sharepoint") ? "sharepoint" : "files";
  curDoc = id;
  let meta;
  try { meta = await capi("GET", "/docs/" + id); } catch (e) { toast(e.message, true); return; }
  view = "docview"; document.getElementById("app").classList.add("norail"); $("#rail").innerHTML = "";
  const shareBtn = meta.owned ? `<button class="btn" id="docShare">${icon("share")}<span>${esc(t("share"))}</span></button>` : "";
  $("#view").innerHTML = `<div class="editor" id="docEditor" style="height:100%">
    <div class="eh"><button class="iconbtn" id="docBack" title="${esc(t("files"))}">${icon("folder")}</button><h2 id="docTitle" style="flex:1">${esc(meta.name)}</h2><div class="pres" id="docPres"></div><span class="status" id="docStatus"><span class="dot-off"></span>${esc(t("connecting"))}</span><button class="iconbtn" id="docHist" title="${esc(t("history"))}">${icon("clock")}</button>${shareBtn}</div>
    <div class="editorwrap"><div class="mirror" id="docMirror" aria-hidden="true"></div><textarea id="docArea" ${meta.canWrite ? "" : "readonly"} spellcheck="false"></textarea><div class="cursors" id="docCursors"></div></div>
    ${meta.canWrite ? "" : `<div style="padding:6px 16px;color:var(--muted);font-size:12.5px;border-top:1px solid var(--border)">${esc(t("readOnlyDoc"))}</div>`}`;
  $("#docBack").onclick = () => { if (docWs) { try { docWs.close(); } catch (e) {} } curDoc = null; view = back; history.pushState({}, "", appPath(back, { drive: fs.driveId, parent: fs.parent })); render(); };
  if ($("#docShare")) $("#docShare").onclick = () => openShare(id, meta);
  $("#docHist").onclick = () => openHistory(id);
  connectDoc(id, meta.canWrite);
}

function downloadItem(it) { const a = document.createElement("a"); a.href = "/mail/api/cloud/download/" + it.id; a.download = it.name; document.body.appendChild(a); a.click(); a.remove(); }

async function uploadFiles(files) {
  if (!files || !files.length) return;
  toast(t("uploading"));
  for (const f of files) {
    try {
      const q = `drive=${fs.driveId}` + (fs.parent ? `&parent=${fs.parent}` : "") + `&name=${encodeURIComponent(f.name)}`;
      const res = await fetch("/mail/api/cloud/upload?" + q, { method: "POST", credentials: "same-origin", headers: { "X-Ondura-Mail": "1", "Content-Type": f.type || "application/octet-stream" }, body: f });
      if (!res.ok) { const d = await res.json().catch(() => null); throw new Error((d && d.error) || res.statusText); }
    } catch (e) { toast(e.message, true); }
  }
  renderFiles();
}

function itemMenu(ev, it) {
  if (!it) return;
  const items = [];
  if (it.kind === "file") items.push({ ic: "paperclip", label: t("download"), fn: () => downloadItem(it) });
  if (fs.canWrite && it.kind !== "doc") items.push({ ic: "share", label: t("share"), fn: () => openItemShare(it) });
  if (fs.canWrite) {
    items.push({ ic: "settings", label: t("rename"), fn: guard(async () => { const name = prompt(t("rename"), it.name); if (!name) return; await api("POST", "/cloud/rename", { item: it.id, name: name.trim() }); renderFiles(); }) });
    items.push({ ic: "trash", label: t("delete"), danger: true, fn: guard(async () => { if (!confirm(t("confirmDeleteItem"))) return; await api("POST", "/cloud/delete", { item: it.id }); renderFiles(); }) });
  }
  if (items.length) openMenu(ev, items);
}

async function openMembers(driveId) {
  const drive = fs.drives.find((d) => d.id === driveId);
  const roles = [["editor", t("roleEditor")], ["viewer", t("roleViewer")]];
  const roleSel = (id, cur) => `<select data-role="${id}" style="width:auto">${roles.map(([v, l]) => `<option value="${v}" ${cur === v ? "selected" : ""}>${esc(l)}</option>`).join("")}</select>`;
  const draw = async () => {
    let list = [];
    try { list = (await api("GET", "/cloud/members?drive=" + driveId)).members || []; } catch (e) {}
    const admin = drive && drive.role === "owner";
    const rows = list.map((m) => `<div class="taskrow"><div class="tt" style="flex:1;min-width:0"><div>${esc(m.name || m.email)}</div><div style="font-size:11px;color:var(--muted)">${esc(m.email)}</div></div>${m.role === "owner" ? `<span style="font-size:12px;color:var(--muted)">${esc(t("owner"))}</span>` : (admin ? roleSel(m.user ? m.user : m.id, m.role) + `<button class="iconbtn danger" data-rm="${m.id}">${icon("trash")}</button>` : `<span style="font-size:12px;color:var(--muted)">${esc(m.role === "editor" ? t("roleEditor") : t("roleViewer"))}</span>`)}</div>`).join("");
    const addRow = admin ? `<div style="display:flex;gap:6px;margin-top:10px"><input id="mEmail" placeholder="${esc(t("addMember"))}" style="flex:1">${`<select id="mRole" style="width:auto">${roles.map(([v, l]) => `<option value="${v}">${esc(l)}</option>`).join("")}</select>`}<button class="btn primary" id="mAdd">${esc(t("add"))}</button></div>` : "";
    panel(t("members"), `<div id="memList">${rows}</div>${addRow}`, `<button class="btn" id="mClose">${esc(t("cancel"))}</button>`);
    const mc = $("#mClose"); if (mc) mc.onclick = closePanel;
    const ma = $("#mAdd"); if (ma) ma.onclick = guard(async () => { const email = $("#mEmail").value.trim(); if (!email) return; await api("POST", "/cloud/member", { drive: driveId, email, role: $("#mRole").value }); draw(); });
    $("#memList").querySelectorAll("[data-rm]").forEach((b) => b.onclick = guard(async () => { await api("POST", "/cloud/member/delete", { drive: driveId, user: +b.dataset.rm }); draw(); }));
    $("#memList").querySelectorAll("[data-role]").forEach((s) => s.onchange = guard(async () => { const m = list.find((x) => x.id === +s.dataset.role); if (m) { await api("POST", "/cloud/member", { drive: driveId, email: m.email, role: s.value }); } }));
  };
  draw();
}

// ------------------------------------------------------------ boot
applyTexts();
guard(start)();
</script>
</body>
</html>
