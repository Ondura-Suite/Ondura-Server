<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ondura Webmail</title>
<link rel="icon" href="/mail/logo.svg">
<style>
:root {
  --tint: #3b5bdb;
  --tint-strong: #304bb4;
  --tint-soft: rgba(59, 91, 219, 0.1);
  --bg: #eceef2;
  --surface: rgba(255, 255, 255, 0.72);
  --surface-solid: #ffffff;
  --surface-hover: rgba(15, 23, 42, 0.045);
  --border: rgba(15, 23, 42, 0.09);
  --text: #1b1f27;
  --muted: #5d6573;
  --danger: #c4314b;
  --ok: #107c41;
  --warn: #b7791f;
  --shadow: 0 1px 2px rgba(15, 23, 42, 0.06), 0 8px 24px rgba(15, 23, 42, 0.06);
  --radius: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111216;
    --surface: rgba(32, 34, 40, 0.72);
    --surface-solid: #1d1f24;
    --surface-hover: rgba(255, 255, 255, 0.05);
    --border: rgba(255, 255, 255, 0.09);
    --text: #e8eaef;
    --muted: #9aa1ad;
    --tint-soft: rgba(110, 138, 255, 0.16);
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.25);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font: 14px/1.45 "Segoe UI Variable", "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, "Helvetica Neue", "Noto Sans", sans-serif;
  color: var(--text);
  background-color: var(--bg);
  background-image:
    linear-gradient(180deg, rgba(255,255,255,.55) 0%, rgba(255,255,255,0) 40%),
    radial-gradient(75vw 65vh at 0% 0%, color-mix(in srgb, var(--tint) 13%, transparent), transparent 70%),
    radial-gradient(70vw 70vh at 100% 100%, color-mix(in srgb, var(--tint) 7%, transparent), transparent 70%);
  background-attachment: fixed;
  -webkit-font-smoothing: antialiased;
}
@media (prefers-color-scheme: dark) {
  body { background-image:
    radial-gradient(75vw 65vh at 0% 0%, color-mix(in srgb, var(--tint) 20%, transparent), transparent 70%),
    radial-gradient(70vw 70vh at 100% 100%, color-mix(in srgb, var(--tint) 9%, transparent), transparent 70%); }
}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--tint); }
.hidden { display: none !important; }
svg { width: 18px; height: 18px; display: block; }

.glass {
  background: var(--surface);
  backdrop-filter: blur(24px) saturate(1.4);
  -webkit-backdrop-filter: blur(24px) saturate(1.4);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}

/* ---------- login ---------- */
#login { min-height: 100%; display: grid; place-items: center; padding: 24px; }
#login .card { width: 380px; max-width: 100%; padding: 36px 36px 28px; }
#login img { width: 48px; height: 48px; }
#login h1 { font-size: 22px; font-weight: 600; margin: 14px 0 2px; }
#login p.sub { color: var(--muted); margin: 0 0 22px; }
.field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; }
.field label { font-size: 12.5px; color: var(--muted); font-weight: 500; }
.field input, .field select, .field textarea {
  padding: 8px 10px; border-radius: 6px; border: 1px solid var(--border);
  background: var(--surface-solid); outline: none; border-bottom: 2px solid transparent; width: 100%;
}
.field input, .field select { height: 34px; }
.field input[type=checkbox] { width: auto; height: auto; margin-right: 6px; accent-color: var(--tint); vertical-align: middle; }
.field label:has(input[type=checkbox]) { flex-direction: row; align-items: center; color: var(--text); font-size: 14px; }
.field input:focus, .field select:focus, .field textarea:focus { border-bottom-color: var(--tint); }
.error { color: var(--danger); min-height: 20px; margin: 2px 0 8px; font-size: 13px; }

.btn {
  height: 32px; padding: 0 14px; border-radius: 6px; border: 1px solid var(--border);
  background: var(--surface-solid); cursor: pointer; display: inline-flex; align-items: center; gap: 7px;
}
.btn:hover { background: var(--surface-hover); }
.btn.primary { background: var(--tint); border-color: var(--tint); color: #fff; }
.btn.primary:hover { background: var(--tint-strong); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--surface-hover); }
.btn.danger { color: var(--danger); }
.btn svg { width: 16px; height: 16px; }

/* ---------- shell ---------- */
#app { height: 100%; display: grid; grid-template-rows: 54px 1fr; }
#top { display: flex; align-items: center; gap: 12px; padding: 0 14px; border-bottom: 1px solid var(--border); background: var(--surface); backdrop-filter: blur(24px); }
#top .brand { display: flex; align-items: center; gap: 9px; font-weight: 600; }
#top .brand img { width: 24px; height: 24px; }
#top .search { flex: 0 1 420px; margin-left: 10px; position: relative; }
#top .search input { width: 100%; height: 34px; padding: 0 10px 0 32px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface-solid); outline: none; }
#top .search svg { position: absolute; left: 9px; top: 8px; width: 16px; height: 16px; color: var(--muted); }
.acctwrap { position: relative; }
.acctbtn { width: 34px; height: 34px; border-radius: 50%; border: none; cursor: pointer; overflow: hidden; background: var(--tint-soft); color: var(--tint); font-weight: 600; font-size: 14px; display: grid; place-items: center; flex: none; padding: 0; }
.acctbtn img { width: 100%; height: 100%; object-fit: cover; display: block; }
.acctmenu { position: absolute; right: 0; top: 44px; width: 270px; background: var(--surface-solid); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); padding: 14px; z-index: 60; }
.acctmenu .card { display: flex; gap: 12px; align-items: center; }
.acctmenu .big { width: 52px; height: 52px; border-radius: 50%; overflow: hidden; background: var(--tint-soft); color: var(--tint); font-weight: 600; font-size: 20px; display: grid; place-items: center; flex: none; }
.acctmenu .big img { width: 100%; height: 100%; object-fit: cover; display: block; }
.acctmenu .nm { font-weight: 600; }
.acctmenu .em { color: var(--muted); font-size: 12.5px; word-break: break-all; }
.acctmenu hr { border: none; border-top: 1px solid var(--border); margin: 12px 0; }
.acctmenu button.row { display: block; width: 100%; text-align: left; background: none; border: none; padding: 8px 6px; border-radius: 8px; cursor: pointer; color: var(--text); font: inherit; }
.acctmenu button.row:hover { background: var(--surface-hover); }
.acctmenu button.row.danger { color: var(--danger); }
#top .sp { flex: 1; }
#top .who { color: var(--muted); font-size: 13px; }
.iconbtn { width: 34px; height: 34px; border-radius: 8px; border: 1px solid transparent; background: transparent; cursor: pointer; display: grid; place-items: center; }
.iconbtn:hover { background: var(--surface-hover); }

#body { display: grid; grid-template-columns: 220px 1fr; min-height: 0; }
#rail { border-right: 1px solid var(--border); padding: 10px 8px; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
.navitem { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; cursor: pointer; color: var(--text); }
.navitem:hover { background: var(--surface-hover); }
.navitem.active { background: var(--tint-soft); color: var(--tint); font-weight: 600; }
.railsep { height: 1px; background: var(--border); margin: 8px 4px; }
.folder { display: flex; align-items: center; gap: 9px; padding: 7px 10px; border-radius: 8px; cursor: pointer; }
.folder:hover { background: var(--surface-hover); }
.folder.active { background: var(--tint-soft); color: var(--tint); font-weight: 600; }
.folder .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.folder .ct { font-size: 12px; color: var(--muted); }
.folder.active .ct { color: var(--tint); }

#view { min-width: 0; min-height: 0; overflow: hidden; }

/* ---------- mail ---------- */
.mailgrid { height: 100%; display: grid; grid-template-columns: 380px 1fr; min-height: 0; }
.list { border-right: 1px solid var(--border); overflow-y: auto; }
.list .hd { padding: 12px 14px 8px; display: flex; align-items: center; gap: 8px; position: sticky; top: 0; background: var(--bg); z-index: 1; }
.list .hd h2 { font-size: 16px; margin: 0; flex: 1; }
.msg { padding: 10px 14px; border-bottom: 1px solid var(--border); cursor: pointer; display: flex; gap: 9px; align-items: flex-start; }
.msg:hover { background: var(--surface-hover); }
.msg.active, .msg.sel { background: var(--tint-soft); }
.msgmain { flex: 1; min-width: 0; }
.msgchk { margin-top: 3px; flex: 0 0 auto; accent-color: var(--tint); }
.msg .msgchk { opacity: 0; transition: opacity .1s; }
.msg:hover .msgchk, .msg.sel .msgchk { opacity: 1; }
#ctxMenu .navitem { padding: 7px 10px; }
#ctxMenu .navitem.danger { color: var(--danger); }
.ctxsep { height: 1px; background: var(--border); margin: 4px 8px; }
.iconbtn.danger { color: var(--danger); }
.acts { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.acts .sep { width: 1px; align-self: stretch; margin: 4px 4px; background: var(--border); }
.taskrow { display: flex; align-items: center; gap: 12px; padding: 11px 16px; border-bottom: 1px solid var(--border); }
.taskrow .tck { width: 20px; height: 20px; border: 1.6px solid var(--border); border-radius: 50%; cursor: pointer; display: grid; place-items: center; flex: 0 0 auto; }
.taskrow .tck.done { background: var(--tint); border-color: var(--tint); color: #fff; }
.taskrow.done .tt { text-decoration: line-through; color: var(--muted); }
.taskrow .tt { flex: 1; cursor: pointer; }
.taskrow .td { color: var(--muted); font-size: 12.5px; }
.notecard { padding: 14px 16px; border-bottom: 1px solid var(--border); cursor: pointer; }
.notecard:hover { background: var(--surface-hover); }
.notecard h3 { margin: 0 0 4px; font-size: 15px; }
.notecard p { margin: 0; color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.listpane { height: 100%; display: grid; grid-template-columns: 1fr; min-height: 0; }
.listscroll { overflow-y: auto; }
.docgrid { height: 100%; display: grid; grid-template-columns: 320px 1fr; min-height: 0; }
.doclist { border-right: 1px solid var(--border); overflow-y: auto; }
.docitem { padding: 11px 16px; border-bottom: 1px solid var(--border); cursor: pointer; display: flex; align-items: center; gap: 10px; }
.docitem:hover { background: var(--surface-hover); }
.docitem.active { background: var(--tint-soft); }
.docitem .dn { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.docitem .dm { font-size: 11px; color: var(--muted); }
.editor { display: flex; flex-direction: column; min-height: 0; height: 100%; }
.editor .eh { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--border); }
.editor .eh h2 { font-size: 16px; margin: 0; flex: 1; }
.editor .status { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.editor .pres { display: flex; gap: -6px; align-items: center; }
.editor .pres .av { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 11px; font-weight: 600; border: 2px solid var(--surface-solid); margin-left: -6px; }
.editorwrap { position: relative; flex: 1; min-height: 0; overflow: hidden; }
.editorwrap textarea, .mirror { position: absolute; inset: 0; width: 100%; height: 100%; box-sizing: border-box; border: 0; outline: none; resize: none; padding: 22px 26px; margin: 0; font: 15px/1.6 "Segoe UI", system-ui, sans-serif; white-space: pre-wrap; overflow-wrap: break-word; word-break: break-word; background: transparent; color: var(--text); }
.editorwrap textarea { overflow-y: auto; }
.mirror { visibility: hidden; overflow: hidden; pointer-events: none; color: transparent; }
.cursors { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
.rc { position: absolute; width: 2px; height: 22px; }
.rc .lbl { position: absolute; top: -15px; left: -1px; font-size: 10px; line-height: 14px; padding: 0 4px; border-radius: 3px 3px 3px 0; color: #fff; white-space: nowrap; font-weight: 600; }
.editor textarea:not(.editorwrap textarea) { flex: 1; }
.histrow { padding: 10px 16px; border-bottom: 1px solid var(--border); cursor: pointer; display: flex; align-items: center; gap: 10px; }
.histrow:hover { background: var(--surface-hover); }
.histrow.active { background: var(--tint-soft); }
.histrow .hr { flex: 1; }
.histrow .hd { font-size: 12px; color: var(--muted); }
.histrow .delta { font-size: 12px; font-variant-numeric: tabular-nums; }
.histrow .add { color: var(--ok); }
.histrow .rem { color: var(--danger); }
.histprev { margin-top: 12px; padding: 12px 14px; border: 1px solid var(--border); border-radius: 8px; white-space: pre-wrap; word-break: break-word; font: 13px/1.5 ui-monospace, Menlo, Consolas, monospace; max-height: 40vh; overflow: auto; background: var(--surface-hover); }
.dot-live { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); display: inline-block; }
.dot-off { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; }
.msg.unread .mf { font-weight: 700; }
.msg .top { display: flex; gap: 8px; align-items: baseline; }
.msg .mf { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.msg .dt { font-size: 12px; color: var(--muted); white-space: nowrap; }
.msg .su { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 1px; }
.msg .pv { font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--tint); display: inline-block; }
.reader { overflow-y: auto; padding: 0; display: flex; flex-direction: column; min-height: 0; }
.reader .rh { padding: 16px 20px 12px; border-bottom: 1px solid var(--border); }
.reader h1 { font-size: 20px; margin: 0 0 8px; }
.reader .meta { color: var(--muted); font-size: 13px; }
.reader .acts { display: flex; gap: 8px; padding: 10px 20px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.reader .bodywrap { flex: 1; min-height: 0; }
.reader iframe { width: 100%; height: 100%; border: 0; background: #fff; }
.reader pre.text { margin: 0; padding: 18px 20px; white-space: pre-wrap; word-wrap: break-word; font: inherit; }
.atts { padding: 10px 20px; border-top: 1px solid var(--border); display: flex; gap: 8px; flex-wrap: wrap; }
.att { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border: 1px solid var(--border); border-radius: 20px; font-size: 12.5px; text-decoration: none; color: var(--text); }
.att:hover { background: var(--surface-hover); }
.empty { color: var(--muted); display: grid; place-items: center; height: 100%; text-align: center; padding: 20px; }

/* ---------- panels ---------- */
#overlay:not(:empty) { position: fixed; inset: 0; z-index: 50; }
.scrim { position: absolute; inset: 0; background: rgba(15,23,42,.28); }
.panel { position: absolute; top: 0; right: 0; height: 100%; width: 620px; max-width: 100%; background: var(--surface-solid); border-left: 1px solid var(--border); box-shadow: var(--shadow); display: flex; flex-direction: column; animation: slide .16s ease-out; }
@keyframes slide { from { transform: translateX(16px); opacity: .6; } to { transform: none; opacity: 1; } }
.panel .head { display: flex; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--border); }
.panel .head h2 { font-size: 17px; margin: 0; flex: 1; }
.panel .cont { padding: 16px 18px; overflow-y: auto; flex: 1; }
.panel .foot { padding: 12px 18px; border-top: 1px solid var(--border); display: flex; gap: 8px; justify-content: flex-end; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
textarea.body { min-height: 260px; resize: vertical; font-family: inherit; }
.composepane { height: 100%; display: flex; flex-direction: column; min-height: 0; }
.composepane .rh { display: flex; align-items: center; gap: 10px; padding: 14px 20px 12px; border-bottom: 1px solid var(--border); }
.composepane .rh h1 { font-size: 18px; margin: 0; flex: 1; }
.cform { flex: 1; overflow-y: auto; padding: 16px 20px; display: flex; flex-direction: column; min-height: 0; }
.cform textarea.body { flex: 1; min-height: 220px; }
.cfoot { display: flex; gap: 8px; align-items: center; padding: 12px 20px; border-top: 1px solid var(--border); }
.rte-toolbar { display: flex; gap: 2px; flex-wrap: wrap; padding: 4px 0 8px; border-bottom: 1px solid var(--border); margin-bottom: 8px; }
.rte-toolbar button { min-width: 30px; height: 30px; padding: 0 7px; border: none; background: none; border-radius: 6px; cursor: pointer; color: var(--text); display: grid; place-items: center; font-size: 14px; }
.rte-toolbar button:hover { background: var(--surface-hover); }
.rte-toolbar button svg { width: 16px; height: 16px; }
.rte { flex: 1; min-height: 220px; overflow-y: auto; border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; outline: none; background: var(--surface-solid); line-height: 1.5; }
.rte:focus { border-color: var(--tint); }
.rte:empty::before { content: attr(data-ph); color: var(--muted); }
.acfield { position: relative; }
.bcctoggle { position: absolute; right: 6px; top: 26px; border: 0; background: none; color: var(--muted); font-size: 12px; cursor: pointer; padding: 3px 6px; border-radius: 6px; }
.bcctoggle:hover { background: var(--surface-hover); color: var(--text); }
.bcctoggle.hidden { display: none; }
.acdrop { position: absolute; left: 0; right: 0; top: 100%; z-index: 70; background: var(--surface-solid); border: 1px solid var(--border); border-radius: 8px; box-shadow: var(--shadow); max-height: 240px; overflow-y: auto; margin-top: 2px; }
.acitem { padding: 7px 10px; cursor: pointer; display: flex; flex-direction: column; }
.acitem:hover, .acitem.sel { background: var(--surface-hover); }
.acitem .nm { font-weight: 500; font-size: 13.5px; }
.acitem .em { color: var(--muted); font-size: 12px; }

/* ---------- calendar ---------- */
.cal { height: 100%; display: flex; flex-direction: column; }
.cal .bar { display: flex; align-items: center; gap: 10px; padding: 12px 16px; }
.cal .bar h2 { margin: 0; font-size: 18px; flex: 1; }
.grid { flex: 1; display: grid; grid-template-columns: repeat(7, 1fr); grid-auto-rows: 1fr; gap: 1px; background: var(--border); border-top: 1px solid var(--border); min-height: 0; }
.dow { background: var(--bg); text-align: center; padding: 6px 0; font-size: 12px; color: var(--muted); grid-row: 1; }
.cell { background: var(--surface-solid); padding: 4px 6px; overflow: hidden; display: flex; flex-direction: column; gap: 3px; cursor: pointer; min-height: 0; }
.cell:hover { background: var(--surface-hover); }
.cell .n { font-size: 12px; color: var(--muted); align-self: flex-end; }
.cell.other { opacity: .4; }
.cell.today .n { background: var(--tint); color: #fff; border-radius: 50%; width: 20px; height: 20px; display: grid; place-items: center; }
.ev { background: var(--tint-soft); color: var(--tint); border-radius: 5px; padding: 2px 6px; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }

/* ---------- contacts ---------- */
.cgrid { height: 100%; display: grid; grid-template-columns: 340px 1fr; min-height: 0; }
.clist { border-right: 1px solid var(--border); overflow-y: auto; }
.citem { padding: 11px 16px; border-bottom: 1px solid var(--border); cursor: pointer; }
.citem:hover { background: var(--surface-hover); }
.citem.active { background: var(--tint-soft); }
.citem .cn { font-weight: 600; }
.citem .ce { font-size: 12.5px; color: var(--muted); }
.cdetail { padding: 28px; overflow-y: auto; }
.avatar { width: 64px; height: 64px; border-radius: 50%; background: var(--tint-soft); color: var(--tint); display: grid; place-items: center; font-size: 26px; font-weight: 600; }
.kv { display: grid; grid-template-columns: 140px 1fr; gap: 6px 14px; margin-top: 18px; }
.kv .k { color: var(--muted); }

.badge { font-size: 11px; padding: 1px 7px; border-radius: 10px; border: 1px solid var(--border); }
.toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 9px 16px; border-radius: 8px; z-index: 100; box-shadow: var(--shadow); }
.toast.bad { background: var(--danger); color: #fff; }
@media (max-width: 820px) {
  #body { grid-template-columns: 1fr; }
  #rail { display: none; }
  .mailgrid, .cgrid, .cal .grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div id="login">
  <form class="card glass" id="loginForm">
    <img src="/mail/logo.svg" alt="Ondura">
    <h1 data-t="webmail">Webmail</h1>
    <p class="sub" data-t="signInSub">Sign in to your mailbox</p>
    <div class="field"><label data-t="email">E-mail</label><input id="le" type="email" autocomplete="username" required></div>
    <div class="field"><label data-t="password">Password</label><input id="lp" type="password" autocomplete="current-password" required></div>
    <div class="error" id="loginError"></div>
    <button class="btn primary" style="width:100%;justify-content:center" type="submit" data-t="signIn">Sign in</button>
    <div style="text-align:center;margin-top:14px"><a href="#" id="langToggle" style="font-size:12.5px"></a></div>
  </form>
</div>

<div id="app" class="hidden">
  <div id="top">
    <div class="brand"><img src="/mail/logo.svg" alt=""><span>Ondura</span></div>
    <div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m16 16 4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><input id="q" placeholder=""></div>
    <div class="sp"></div>
    <button class="btn primary" id="composeBtn"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span data-t="compose">Compose</span></button>

function toast(msg, bad) { const el = document.createElement("div"); el.className = "toast" + (bad ? " bad" : ""); el.textContent = msg; document.body.appendChild(el); setTimeout(() => el.remove(), bad ? 5000 : 2200); }

async function api(method, path, body) {
  const res = await fetch("/mail/api" + path, {
    method, credentials: "same-origin",
    headers: { "Content-Type": "application/json", "X-Ondura-Mail": "1" },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  let data = null; try { data = await res.json(); } catch (e) { data = null; }
  if (res.status === 401 && path !== "/login") { showLogin(); throw new Error("unauthorized"); }
  if (!res.ok) throw new Error((data && data.error) || res.statusText);
  return data;
}
const guard = (fn) => async (...a) => { try { await fn(...a); } catch (e) { if (e.message !== "unauthorized") toast(e.message, true); } };

// Collab API lives under /collab/api with its own CSRF header.
async function capi(method, path, body) {
  const res = await fetch("/collab/api" + path, {
    method, credentials: "same-origin",
    headers: { "Content-Type": "application/json", "X-Ondura-Collab": "1" },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  let data = null; try { data = await res.json(); } catch (e) {}
  if (res.status === 401) { showLogin(); throw new Error("unauthorized"); }
  if (!res.ok) throw new Error((data && data.error) || res.statusText);
  return data;
}

  if (!me) return;

}

  view = "mail"; render();

const FOLDER_ORDER = ["inbox", "drafts", "sentitems", "archive", "junkemail", "deleteditems", "outbox"];
function folderLabel(f) { return f.role && T[lang][f.role] ? t(f.role) : f.name; }
function mailFolders() {
  const mail = folders.filter((f) => f.class === "mail");
  return mail.sort((a, b) => (FOLDER_ORDER.indexOf(a.role) + 1 || 99) - (FOLDER_ORDER.indexOf(b.role) + 1 || 99));
}
function renderRail() {
  const navItems = [["mail", "mail"], ["calendar", "calendar"], ["contacts", "contacts"], ["tasks", "tasks"], ["notes", "note"]];
  if (me && me.collab) navItems.push(["documents", "doc"]);
  const nav = navItems.map(([k, ic]) =>
    `<div class="navitem ${view === k ? "active" : ""}" data-view="${k}">${icon(ic)}<span>${esc(t(k))}</span></div>`).join("");
  let html = nav;
  if (view === "mail") {
    html += `<div class="railsep"></div><div class="folder" id="addFolder" style="color:var(--muted)">${icon("plus")}<span class="nm">${esc(t("newFolder"))}</span></div>`;
    html += mailFolders().map((f) => {
      const custom = !f.role;
      return `<div class="folder ${curFolder && f.id === curFolder.id ? "active" : ""}" data-folder="${f.id}">${icon(f.role || "folder")}<span class="nm">${esc(folderLabel(f))}</span>${custom ? `<button class="iconbtn fmenu" data-fid="${f.id}" data-fname="${esc(f.name)}" style="width:22px;height:22px">${icon("dots")}</button>` : ""}${f.unread ? `<span class="ct">${f.unread}</span>` : ""}</div>`;
    }).join("");

// Contacts cache for recipient autocomplete.
let contactsCache = null;
async function loadContacts() {
  if (contactsCache) return contactsCache;
  const recips = [];
  try {
    const r = await api("GET", "/contacts");
    (r.contacts || []).forEach((c) => (c.emails || []).forEach((em) => { if (em) recips.push({ name: c.displayName || em, email: em }); }));
  } catch (e) { /* no contacts */ }
  contactsCache = recips; return recips;
}
function attachAutocomplete(input) {
  let drop = null, sel = -1, matches = [], recips = contactsCache || [];
  loadContacts().then((r) => { recips = r; });
  const close = () => { if (drop) { drop.remove(); drop = null; } sel = -1; matches = []; };
  const token = () => { const v = input.value; const i = v.lastIndexOf(","); return { start: i + 1, q: v.slice(i + 1).trim() }; };
  const apply = (m) => {
    const { start } = token();
    const before = input.value.slice(0, start).replace(/\s+$/, "");
    input.value = (before ? before + " " : "") + m.email + ", ";
    close(); input.focus();
  };
  const show = () => {
    const { q } = token();
    if (q.length < 1) { close(); return; }
    const ql = q.toLowerCase();
    matches = recips.filter((r) => r.email.toLowerCase().includes(ql) || (r.name || "").toLowerCase().includes(ql)).slice(0, 7);
    if (!matches.length) { close(); return; }
    if (sel >= matches.length) sel = matches.length - 1;
    if (!drop) { drop = document.createElement("div"); drop.className = "acdrop"; input.parentNode.appendChild(drop); }
    drop.innerHTML = matches.map((m, i) => `<div class="acitem ${i === sel ? "sel" : ""}" data-i="${i}"><span class="nm">${esc(m.name || m.email)}</span><span class="em">${esc(m.email)}</span></div>`).join("");
    drop.querySelectorAll(".acitem").forEach((el) => el.onmousedown = (e) => { e.preventDefault(); apply(matches[+el.dataset.i]); });
  };
  input.addEventListener("input", () => { sel = -1; show(); });
  input.addEventListener("keydown", (e) => {
    if (!drop || !matches.length) return;
    if (e.key === "ArrowDown") { e.preventDefault(); sel = Math.min(sel + 1, matches.length - 1); show(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); sel = Math.max(sel - 1, 0); show(); }
    else if (e.key === "Enter" && sel >= 0) { e.preventDefault(); apply(matches[sel]); }
    else if (e.key === "Escape") { close(); }
  });
  input.addEventListener("blur", () => setTimeout(close, 150));
}

let calRef = new Date();
async function renderCalendar() {
  calRef.setDate(1);
  const y = calRef.getFullYear(), mo = calRef.getMonth();
  const first = new Date(y, mo, 1), startDow = (first.getDay() + 6) % 7;
  const gridStart = new Date(y, mo, 1 - startDow);
  const from = Math.floor(gridStart.getTime() / 1000);
  const to = from + 42 * 86400;
  const title = calRef.toLocaleString(lang === "de" ? "de-DE" : "en-GB", { month: "long", year: "numeric" });
  $("#view").innerHTML = `<div class="cal"><div class="bar"><h2>${esc(title)}</h2>
    <button class="btn" id="calToday">${esc(t("today"))}</button>
    <button class="iconbtn" id="calPrev"><svg viewBox="0 0 24 24" style="transform:rotate(180deg)">${ICON.chev}</svg></button>
    <button class="iconbtn" id="calNext"><svg viewBox="0 0 24 24">${ICON.chev}</svg></button>
    <button class="btn primary" id="calNew">${icon("calendar")}<span>${esc(t("newEvent"))}</span></button></div>
    <div class="grid" id="calGrid"></div></div>`;
  $("#calPrev").onclick = () => { calRef.setMonth(mo - 1); renderCalendar(); };
  $("#calNext").onclick = () => { calRef.setMonth(mo + 1); renderCalendar(); };
  $("#calToday").onclick = () => { calRef = new Date(); renderCalendar(); };
  $("#calNew").onclick = () => openEvent();
  const dows = lang === "de" ? ["Mo", "Di", "Mi", "Do", "Fr", "Sa", "So"] : ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
  let events = [];
  try { events = (await api("GET", `/calendar?from=${from}&to=${to}`)).events; } catch (e) {}
  const byDay = {};
  events.forEach((ev) => { const k = new Date(ev.start * 1000).toDateString(); (byDay[k] = byDay[k] || []).push(ev); });
  let cells = dows.map((d) => `<div class="dow">${d}</div>`).join("");
  for (let i = 0; i < 42; i++) {
    const d = new Date(gridStart.getFullYear(), gridStart.getMonth(), gridStart.getDate() + i);
    const other = d.getMonth() !== mo, today = d.toDateString() === new Date().toDateString();
    const evs = (byDay[d.toDateString()] || []).sort((a, b) => a.start - b.start);
    cells += `<div class="cell ${other ? "other" : ""} ${today ? "today" : ""}" data-day="${Math.floor(d.getTime() / 1000)}">
      <span class="n">${d.getDate()}</span>
      ${evs.map((e) => `<div class="ev" data-ev='${esc(JSON.stringify({ id: e.id, occ: e.occurrenceStart }))}' title="${esc(e.subject)}">${e.allDay ? "" : new Date(e.start * 1000).toLocaleTimeString(lang === "de" ? "de-DE" : "en-GB", { hour: "2-digit", minute: "2-digit" }) + " "}${esc(e.subject)}</div>`).join("")}</div>`;
  }
  $("#calGrid").innerHTML = cells;
  $("#calGrid").querySelectorAll(".cell").forEach((c) => c.onclick = (e) => { if (e.target.closest(".ev")) return; openEvent(null, +c.dataset.day); });
  $("#calGrid").querySelectorAll(".ev").forEach((el) => el.onclick = () => { const d = JSON.parse(el.dataset.ev); const ev = events.find((x) => x.id === d.id && x.occurrenceStart === d.occ); openEvent(ev); });
}
function toLocalInput(ts) { const d = new Date(ts * 1000); const p = (n) => String(n).padStart(2, "0"); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`; }

    $("#stPwCur").value = $("#stPwNew").value = $("#stPwNew2").value = "";
    toast(t("passwordChanged"));
  });
}

// ------------------------------------------------------------ COLLAB: OT library
// Operations are arrays of: number>0 retain, number<0 delete, string insert.
// Counting is in UTF-16 units, matching the server exactly.
function oRetain(op, n) { if (n <= 0) return; const l = op[op.length - 1]; if (typeof l === "number" && l > 0) op[op.length - 1] += n; else op.push(n); }
function oDelete(op, n) { if (n <= 0) return; const l = op[op.length - 1]; if (typeof l === "number" && l < 0) op[op.length - 1] -= n; else op.push(-n); }
function oInsert(op, s) {
  if (!s) return; const l = op[op.length - 1];
  if (typeof l === "string") op[op.length - 1] += s;
  else if (typeof l === "number" && l < 0) { const del = op.pop(); const l2 = op[op.length - 1]; if (typeof l2 === "string") op[op.length - 1] += s; else op.push(s); op.push(del); }
  else op.push(s);
}
function cRetain(q, v, m) { if (m < v) q[0] = v - m; else q.shift(); }
function cDelete(q, v, m) { if (m < -v) q[0] = v + m; else q.shift(); }
function cStr(q, s, m) { if (m < s.length) q[0] = s.slice(m); else q.shift(); }
function applyOp(doc, op) { let r = "", i = 0; for (const c of op) { if (typeof c === "string") r += c; else if (c > 0) { r += doc.slice(i, i + c); i += c; } else i += -c; } return r; }
function composeOp(a, b) {
  a = a.slice(); b = b.slice(); const o = [];
  while (a.length || b.length) {
    const x = a[0], y = b[0];
    if (typeof x === "number" && x < 0) { oDelete(o, -x); a.shift(); continue; }
    if (typeof y === "string") { oInsert(o, y); b.shift(); continue; }
    if (x === undefined || y === undefined) throw new Error("compose mismatch");
    if (typeof x === "number" && x > 0 && typeof y === "number" && y > 0) { const m = Math.min(x, y); oRetain(o, m); cRetain(a, x, m); cRetain(b, y, m); }
    else if (typeof x === "number" && x > 0 && typeof y === "number" && y < 0) { const m = Math.min(x, -y); oDelete(o, m); cRetain(a, x, m); cDelete(b, y, m); }
    else if (typeof x === "string" && typeof y === "number" && y > 0) { const m = Math.min(x.length, y); oInsert(o, x.slice(0, m)); cStr(a, x, m); cRetain(b, y, m); }
    else if (typeof x === "string" && typeof y === "number" && y < 0) { const m = Math.min(x.length, -y); cStr(a, x, m); cDelete(b, y, m); }
    else throw new Error("compose bad");
  }
  return o;
}
function transformOp(a, b) {
  a = a.slice(); b = b.slice(); const ap = [], bp = [];
  while (a.length || b.length) {
    const x = a[0], y = b[0];
    if (typeof x === "string") { oInsert(ap, x); oRetain(bp, x.length); a.shift(); continue; }
    if (typeof y === "string") { oRetain(ap, y.length); oInsert(bp, y); b.shift(); continue; }
    if (x === undefined || y === undefined) throw new Error("transform mismatch");
    const xr = x > 0, xd = x < 0, yr = y > 0, yd = y < 0;
    if (xr && yr) { const m = Math.min(x, y); oRetain(ap, m); oRetain(bp, m); cRetain(a, x, m); cRetain(b, y, m); }
    else if (xd && yd) { const m = Math.min(-x, -y); cDelete(a, x, m); cDelete(b, y, m); }
    else if (xd && yr) { const m = Math.min(-x, y); oDelete(ap, m); cDelete(a, x, m); cRetain(b, y, m); }
    else if (xr && yd) { const m = Math.min(x, -y); oDelete(bp, m); cRetain(a, x, m); cDelete(b, y, m); }
    else throw new Error("transform bad");
  }
  return [ap, bp];
}
function diffOp(a, b) {
  if (a === b) return null;
  let p = 0; const minL = Math.min(a.length, b.length);
  while (p < minL && a[p] === b[p]) p++;
  let s = 0;
  while (s < minL - p && a[a.length - 1 - s] === b[b.length - 1 - s]) s++;
  const del = a.length - p - s, ins = b.slice(p, b.length - s);
  const op = []; oRetain(op, p); if (del > 0) oDelete(op, del); if (ins) oInsert(op, ins); oRetain(op, s);
  return op;
}
function transformCursor(pos, op) {
  let res = pos, i = 0;
  for (const c of op) {
    if (typeof c === "string") { if (i < pos) res += c.length; }
    else if (c > 0) i += c;
    else { const d = -c; if (i < pos) res -= Math.min(d, pos - i); i += d; }
  }
  return Math.max(0, res);
}

// ------------------------------------------------------------ DOCUMENTS
let curDoc = null, docWs = null;
async function renderDocuments() {
  if (docWs) { try { docWs.close(); } catch (e) {} docWs = null; }
  $("#view").innerHTML = `<div class="docgrid"><div class="doclist"><div class="hd glass" style="box-shadow:none;border:0;border-radius:0;padding:12px 16px;display:flex;gap:8px;position:sticky;top:0;background:var(--bg)"><h2 style="flex:1;font-size:16px;margin:0">${esc(t("documents"))}</h2><button class="btn primary" id="newDoc">${icon("plus")}</button></div><div id="docItems"></div></div><div class="editor" id="docEditor"><div class="empty">${esc(t("selectMessage"))}</div></div></div>`;
  $("#newDoc").onclick = guard(async () => { const name = prompt(t("newDocument")); if (name === null) return; const r = await capi("POST", "/docs", { name: name.trim() || t("newDocument") }); await loadDocs(); openDoc(r.id); });
  await loadDocs();
}
async function loadDocs() {
  let docs = [];
  try { docs = (await capi("GET", "/docs")).documents; } catch (e) {}
  const box = $("#docItems"); if (!box) return;
  box.innerHTML = docs.length ? docs.map((d) => `<div class="docitem ${curDoc === d.id ? "active" : ""}" data-id="${d.id}">${icon("doc")}<div class="dn">${esc(d.name)}<div class="dm">${d.owned ? esc(t("owner")) : esc(t("sharedWith"))} · ${esc(fmtShort(d.updated))}</div></div></div>`).join("") : `<div class="empty" style="height:auto;padding:40px">${esc(t("noDocuments"))}</div>`;
  box.querySelectorAll(".docitem").forEach((e) => e.onclick = () => openDoc(+e.dataset.id));
}
async function openDoc(id) {
  curDoc = id; loadDocs();
  let meta;
  try { meta = await capi("GET", "/docs/" + id); } catch (e) { return; }
  const ed = $("#docEditor"); if (!ed) return;
  const shareBtn = meta.owned ? `<button class="btn" id="docShare">${icon("share")}<span>${esc(t("share"))}</span></button>` : "";
  const delBtn = meta.owned ? `<button class="iconbtn danger" id="docDel" title="${esc(t("delete"))}">${icon("trash")}</button>` : "";
  ed.innerHTML = `<div class="eh"><h2 id="docTitle">${esc(meta.name)}</h2><div class="pres" id="docPres"></div><span class="status" id="docStatus"><span class="dot-off"></span>${esc(t("connecting"))}</span><button class="iconbtn" id="docHist" title="${esc(t("history"))}">${icon("clock")}</button>${shareBtn}${delBtn}</div>
    <div class="editorwrap"><div class="mirror" id="docMirror" aria-hidden="true"></div><textarea id="docArea" ${meta.canWrite ? "" : "readonly"} spellcheck="false" placeholder=""></textarea><div class="cursors" id="docCursors"></div></div>
    ${meta.canWrite ? "" : `<div style="padding:6px 16px;color:var(--muted);font-size:12.5px;border-top:1px solid var(--border)">${esc(t("readOnlyDoc"))}</div>`}`;
  if (meta.owned && $("#docTitle")) $("#docTitle").onclick = guard(async () => { const name = prompt(t("rename"), meta.name); if (name && name.trim()) { await capi("POST", "/docs/" + id + "/rename", { name: name.trim() }); $("#docTitle").textContent = name.trim(); loadDocs(); } });
  if ($("#docDel")) $("#docDel").onclick = guard(async () => { if (!confirm(t("confirmDelete"))) return; await capi("DELETE", "/docs/" + id); if (docWs) docWs.close(); curDoc = null; renderDocuments(); });
  if ($("#docShare")) $("#docShare").onclick = () => openShare(id, meta);
  $("#docHist").onclick = () => openHistory(id);
  connectDoc(id, meta.canWrite);
}
function connectDoc(id, canWrite) {
  if (docWs) { try { docWs.close(); } catch (e) {} }
  const proto = location.protocol === "https:" ? "wss" : "ws";
  const ws = new WebSocket(`${proto}://${location.host}/collab/ws?doc=${id}`);
  docWs = ws;
  const ta = $("#docArea");
  const E = { ws, rev: 0, docText: "", state: "sync", pending: null, buffer: null, applying: false, canWrite };
  const remote = {}; // conn id -> { pos, name, color, ts }
  const setStatus = (live) => { const s = $("#docStatus"); if (s) s.innerHTML = `<span class="${live ? "dot-live" : "dot-off"}"></span>${live ? esc(t("online")) : esc(t("connecting"))}`; };
  function caretXY(pos) {
    const mir = $("#docMirror"); if (!mir) return { x: 0, y: 0 };
    mir.textContent = E.docText.slice(0, pos);
    const span = document.createElement("span"); span.textContent = "​"; mir.appendChild(span);
    const x = span.offsetLeft, y = span.offsetTop; mir.textContent = "";
    return { x, y };
  }
  function renderCursors() {
    const cont = $("#docCursors"); if (!cont || !ta) return;
    const now = Date.now(); const html = [];
    for (const [by, c] of Object.entries(remote)) {
      if (now - c.ts > 9000) { delete remote[by]; continue; }
      const { x, y } = caretXY(Math.min(c.pos, E.docText.length));
      html.push(`<div class="rc" style="left:${x}px;top:${y - ta.scrollTop}px;background:${esc(c.color)}"><span class="lbl" style="background:${esc(c.color)}">${esc(c.name)}</span></div>`);
    }
    cont.innerHTML = html.join("");
  }
  let curTimer;
  const sendCursor = () => { if (ws.readyState === 1 && ta) ws.send(JSON.stringify({ type: "cursor", pos: ta.selectionStart, anchor: ta.selectionEnd })); };
  const queueCursor = () => { clearTimeout(curTimer); curTimer = setTimeout(sendCursor, 120); };
  ws.onclose = () => setStatus(false);
  ws.onerror = () => setStatus(false);
  ws.onmessage = (ev) => {
    const m = JSON.parse(ev.data);
    if (m.type === "init") {
      E.rev = m.rev; E.docText = m.content; if (ta) { E.applying = true; ta.value = m.content; E.applying = false; } setStatus(true);
    } else if (m.type === "ack") {
      E.rev = m.rev;
      if (E.state === "await") { E.pending = null; E.state = "sync"; }
      else if (E.state === "awaitBuf") { E.pending = E.buffer; E.buffer = null; E.state = "await"; ws.send(JSON.stringify({ type: "op", rev: E.rev, op: E.pending })); }
    } else if (m.type === "op") {
      E.rev = m.rev;
      let toApply;
      if (E.state === "sync") toApply = m.op;
      else if (E.state === "await") { const [pp, o1] = transformOp(E.pending, m.op); E.pending = pp; toApply = o1; }
      else { const [pp, o1] = transformOp(E.pending, m.op); const [bb, o2] = transformOp(E.buffer, o1); E.pending = pp; E.buffer = bb; toApply = o2; }
      // shift remote carets through the applied change
      for (const c of Object.values(remote)) c.pos = transformCursor(c.pos, toApply);
      if (ta) {
        const a = ta.selectionStart, b = ta.selectionEnd;
        E.applying = true; const nv = applyOp(E.docText, toApply); ta.value = nv; E.docText = nv;
        ta.selectionStart = transformCursor(a, toApply); ta.selectionEnd = transformCursor(b, toApply); E.applying = false;
      } else { E.docText = applyOp(E.docText, toApply); }
      renderCursors();
    } else if (m.type === "presence") {
      const box = $("#docPres"); if (box) box.innerHTML = (m.users || []).slice(0, 6).map((u) => `<span class="av" title="${esc(u.name)}" style="background:${esc(u.color)}">${esc((u.name || "?").trim()[0] || "?").toUpperCase()}</span>`).join("");
    } else if (m.type === "cursor") {
      remote[m.by] = { pos: m.pos || 0, name: m.name || "", color: m.color || "#888", ts: Date.now() };
      renderCursors();
    } else if (m.type === "reset") {
      // The server signalled a desync (we lagged); reconnect for a fresh state.
      try { ws.close(); } catch (e) {}
      if (curDoc === id) connectDoc(id, canWrite);
    }
  };
  if (ta) {
    const cursorEvents = () => queueCursor();
    ta.addEventListener("keyup", cursorEvents);
    ta.addEventListener("pointerup", cursorEvents);
    ta.addEventListener("focus", cursorEvents);
    ta.addEventListener("scroll", renderCursors);
  }
  if (ta && canWrite) {
    ta.oninput = () => {
      if (E.applying) return;
      const op = diffOp(E.docText, ta.value); E.docText = ta.value;
      if (!op) return;
      for (const c of Object.values(remote)) c.pos = transformCursor(c.pos, op);
      if (E.state === "sync") { E.pending = op; E.state = "await"; ws.send(JSON.stringify({ type: "op", rev: E.rev, op })); }
      else if (E.state === "await") { E.buffer = op; E.state = "awaitBuf"; }
      else { E.buffer = composeOp(E.buffer, op); }
      renderCursors(); queueCursor();
    };
  }
}
async function openHistory(id) {
  let hist = [];
  try { hist = (await capi("GET", "/docs/" + id + "/history")).history; } catch (e) { return; }
  panel(t("history"),
    `<div id="histList"></div><div id="histPrev"></div>`,
    `<div style="flex:1"></div><button class="btn primary" id="histClose">${esc(t("cancel"))}</button>`);
  $("#histClose").onclick = closePanel;
  const box = $("#histList");
  box.innerHTML = hist.length ? hist.map((h) => `<div class="histrow" data-rev="${h.rev}"><div class="hr">${esc(h.name || h.email)}<div class="hd">v${h.rev} · ${esc(fmtDate(h.ts))}</div></div><div class="delta">${h.added ? `<span class="add">+${h.added}</span> ` : ""}${h.removed ? `<span class="rem">−${h.removed}</span>` : ""}</div></div>`).join("") : `<p style="color:var(--muted)">—</p>`;
  box.querySelectorAll(".histrow").forEach((r) => r.onclick = guard(async () => {
    box.querySelectorAll(".histrow").forEach((x) => x.classList.remove("active"));
    r.classList.add("active");
    const rev = +r.dataset.rev;
    const res = await capi("GET", "/docs/" + id + "/at/" + rev);
    $("#histPrev").innerHTML = `<div class="hd" style="margin-top:12px">${esc(t("preview"))} · v${rev}</div><div class="histprev">${esc(res.content) || "<span style='color:var(--muted)'>—</span>"}</div>`;
  }));
}
function openShare(id, meta) {
  const shares = (meta.shares || []);
  panel(t("share"),
    `<div class="field"><label>${esc(t("addPerson"))}</label><div class="row" style="display:flex;gap:8px"><input id="shEmail" type="email" style="flex:1"><select id="shPerm"><option value="write">${esc(t("canEdit"))}</option><option value="read">${esc(t("readOnly"))}</option></select><button class="btn" id="shAdd">${esc(t("add"))}</button></div></div>
     <h3 style="margin:18px 0 8px;font-size:14px">${esc(t("sharedWith"))}</h3>
     <div id="shList"></div>`,
    `<div style="flex:1"></div><button class="btn primary" id="shClose">${esc(t("save"))}</button>`);
  const renderList = (list) => { $("#shList").innerHTML = list.length ? list.map((s) => `<div class="taskrow"><div class="tt">${esc(s.name || s.email)}<div class="dm" style="font-size:12px;color:var(--muted)">${esc(s.email)} · ${s.canWrite ? esc(t("canEdit")) : esc(t("readOnly"))}</div></div><button class="iconbtn danger" data-rm="${esc(s.email)}">${icon("trash")}</button></div>`).join("") : `<p style="color:var(--muted)">—</p>`; $("#shList").querySelectorAll("[data-rm]").forEach((b) => b.onclick = guard(async () => { await capi("POST", "/docs/" + id + "/unshare", { email: b.dataset.rm }); const m = await capi("GET", "/docs/" + id); renderList(m.shares || []); })); };
  renderList(shares);
  $("#shAdd").onclick = guard(async () => { const email = $("#shEmail").value.trim(); if (!email) return; await capi("POST", "/docs/" + id + "/share", { email, canWrite: $("#shPerm").value === "write" }); $("#shEmail").value = ""; const m = await capi("GET", "/docs/" + id); renderList(m.shares || []); });
  $("#shClose").onclick = closePanel;
}
