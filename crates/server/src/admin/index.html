<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ondura Server – Admin Center</title>
<link rel="icon" href="/admin/logo.svg">
<style>
:root {
  --tint: #3b5bdb;
  --tint-strong: #304bb4;
  --tint-soft: rgba(59, 91, 219, 0.1);
  --bg: #eceef2;
  --surface: rgba(255, 255, 255, 0.72);
  --surface-solid: #ffffff;
  --surface-hover: rgba(15, 23, 42, 0.045);
  --border: rgba(15, 23, 42, 0.09);
  --text: #1b1f27;
  --muted: #5d6573;
  --danger: #c4314b;
  --ok: #107c41;
  --warn: #b7791f;
  --shadow: 0 1px 2px rgba(15, 23, 42, 0.06), 0 8px 24px rgba(15, 23, 42, 0.06);
  --radius: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111216;
    --surface: rgba(32, 34, 40, 0.72);
    --surface-solid: #1d1f24;
    --surface-hover: rgba(255, 255, 255, 0.05);
    --border: rgba(255, 255, 255, 0.09);
    --text: #e8eaef;
    --muted: #9aa1ad;
    --tint-soft: rgba(110, 138, 255, 0.16);
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.25);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font: 14px/1.45 "Segoe UI Variable", "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, "Helvetica Neue", "Noto Sans", sans-serif;
  color: var(--text);
  background-color: var(--bg);
  background-image:
    linear-gradient(180deg, rgba(255,255,255,.55) 0%, rgba(255,255,255,0) 40%),
    radial-gradient(75vw 65vh at 0% 0%, color-mix(in srgb, var(--tint) 13%, transparent), transparent 70%),
    radial-gradient(70vw 70vh at 100% 100%, color-mix(in srgb, var(--tint) 7%, transparent), transparent 70%);
  background-attachment: fixed;
  -webkit-font-smoothing: antialiased;
}
@media (prefers-color-scheme: dark) {
  body { background-image:
    radial-gradient(75vw 65vh at 0% 0%, color-mix(in srgb, var(--tint) 20%, transparent), transparent 70%),
    radial-gradient(70vw 70vh at 100% 100%, color-mix(in srgb, var(--tint) 9%, transparent), transparent 70%); }
}
button, input, select { font: inherit; color: inherit; }
a { color: var(--tint); }
.hidden { display: none !important; }

/* ---------- glass surfaces ---------- */
.glass {
  background: var(--surface);
  backdrop-filter: blur(24px) saturate(1.4);
  -webkit-backdrop-filter: blur(24px) saturate(1.4);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}

/* ---------- login ---------- */
#login { min-height: 100%; display: grid; place-items: center; padding: 24px; }
#login .card { width: 380px; max-width: 100%; padding: 36px 36px 28px; }
#login img { width: 48px; height: 48px; }
#login h1 { font-size: 22px; font-weight: 600; margin: 14px 0 2px; }
#login p.sub { color: var(--muted); margin: 0 0 22px; }
.field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; }
.field label { font-size: 12.5px; color: var(--muted); font-weight: 500; }
.field input, .field select {
  height: 34px; padding: 0 10px; border-radius: 6px; border: 1px solid var(--border);
  background: var(--surface-solid); outline: none; border-bottom: 2px solid transparent;
}
.field input:focus, .field select:focus { border-bottom-color: var(--tint); }
.check { display: flex; align-items: center; gap: 8px; margin: 6px 0 12px; }
.error { color: var(--danger); min-height: 20px; margin: 2px 0 8px; font-size: 13px; }

.btn {
  height: 32px; padding: 0 14px; border-radius: 6px; border: 1px solid var(--border);
  background: var(--surface-solid); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
}
.btn:hover { background: color-mix(in srgb, var(--surface-solid) 85%, var(--tint) 15%); }
.btn.primary { background: var(--tint); border-color: var(--tint); color: #fff; }
.btn.primary:hover { background: var(--tint-strong); }
.btn.danger { color: var(--danger); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: var(--surface-hover); }
.btn:disabled { opacity: .5; cursor: default; }
.btn svg { width: 16px; height: 16px; }

/* ---------- shell ---------- */
#app { display: grid; grid-template-rows: 48px 1fr; height: 100%; }
header.top {
  display: flex; align-items: center; gap: 12px; padding: 0 16px;
  background: color-mix(in srgb, var(--surface) 70%, transparent);
  backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
  border-bottom: 1px solid var(--border);
}
header.top img { width: 26px; height: 26px; }
header.top .title { font-weight: 600; font-size: 15px; }
header.top .title span { color: var(--muted); font-weight: 400; margin-left: 6px; }
header.top .spacer { flex: 1; }
header.top .host { color: var(--muted); font-size: 12.5px; }
.avatar {
  width: 30px; height: 30px; border-radius: 50%; background: var(--tint); color: #fff;
  display: grid; place-items: center; font-weight: 600; font-size: 12px; cursor: pointer; border: none;
}
.menu { position: absolute; right: 12px; top: 46px; width: 240px; padding: 12px; z-index: 50; }
.menu .who { font-weight: 600; }
.menu .mail { color: var(--muted); font-size: 12.5px; margin-bottom: 10px; word-break: break-all; }
.lang { display: flex; gap: 4px; margin-bottom: 10px; }
.lang button { flex: 1; }
.lang button.on { background: var(--tint-soft); border-color: var(--tint); }

.body { display: grid; grid-template-columns: 228px 1fr; min-height: 0; }
nav.side { padding: 12px 8px; overflow-y: auto; }
nav.side a {
  display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-radius: 6px;
  color: var(--text); text-decoration: none; position: relative; margin-bottom: 2px;
}
nav.side a:hover { background: var(--surface-hover); }
nav.side a.active { background: var(--surface); box-shadow: var(--shadow); font-weight: 600; }
nav.side a.active::before { content: ""; position: absolute; left: 0; top: 9px; bottom: 9px; width: 3px; border-radius: 3px; background: var(--tint); }
nav.side svg { width: 18px; height: 18px; color: var(--tint); flex: none; }
nav.side .group { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 14px 12px 6px; }
main { overflow-y: auto; padding: 22px 28px 40px; min-width: 0; }
main h1 { font-size: 24px; font-weight: 600; margin: 0 0 4px; }
main .lead { color: var(--muted); margin: 0 0 18px; }

.toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.toolbar .search { margin-left: auto; position: relative; }
.toolbar .search input { height: 32px; width: 260px; padding: 0 10px 0 32px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface-solid); }
.toolbar .search svg { position: absolute; left: 9px; top: 8px; width: 16px; height: 16px; color: var(--muted); }
.pills { display: flex; gap: 4px; }
.pill { height: 28px; padding: 0 12px; border-radius: 14px; border: 1px solid var(--border); background: transparent; cursor: pointer; font-size: 13px; }
.pill.on { background: var(--tint-soft); border-color: var(--tint); color: var(--tint); font-weight: 600; }

table.list { width: 100%; border-collapse: collapse; }
.tablecard { overflow: hidden; }
table.list th { text-align: left; font-weight: 600; font-size: 12.5px; color: var(--muted); padding: 10px 14px; border-bottom: 1px solid var(--border); white-space: nowrap; }
table.list td { padding: 10px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
table.list tr:last-child td { border-bottom: none; }
table.list tbody tr.click { cursor: pointer; }
table.list tbody tr.click:hover { background: var(--surface-hover); }
td .name { font-weight: 600; }
td .sub, .muted { color: var(--muted); font-size: 12.5px; }
.empty { padding: 40px; text-align: center; color: var(--muted); }
.badge { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; background: var(--surface-hover); border: 1px solid var(--border); }
.badge.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, transparent); }
.badge.bad { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 40%, transparent); }
.badge.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, transparent); }
.badge.tint { color: var(--tint); border-color: color-mix(in srgb, var(--tint) 40%, transparent); }
.bar { height: 6px; border-radius: 3px; background: var(--surface-hover); width: 120px; overflow: hidden; margin-top: 4px; }
.bar > div { height: 100%; background: var(--tint); }
.bar.full > div { background: var(--danger); }

.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; margin-bottom: 22px; }
.tile { padding: 16px 18px; }
.tile .label { color: var(--muted); font-size: 12.5px; }
.tile .value { font-size: 28px; font-weight: 600; margin-top: 4px; }
.tile .note { color: var(--muted); font-size: 12.5px; }
.card { padding: 18px 20px; margin-bottom: 16px; }
.card h2 { font-size: 16px; font-weight: 600; margin: 0 0 10px; }
.optrow { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 0; border-top: 1px solid var(--border); }
.optrow .meta { min-width: 0; }
.optrow .meta b { font-weight: 600; }
.hint { color: var(--muted); font-size: 13px; margin: 3px 0 0; }
.switch { position: relative; width: 42px; height: 24px; flex: none; }
.switch input { opacity: 0; width: 0; height: 0; }
.switch span { position: absolute; inset: 0; background: var(--border); border-radius: 999px; transition: .15s; cursor: pointer; }
.switch span::before { content: ""; position: absolute; left: 3px; top: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: .15s; }
.switch input:checked + span { background: var(--tint); }
.switch input:checked + span::before { transform: translateX(18px); }
table.kv { width: 100%; border-collapse: collapse; }
table.kv th { text-align: left; font-weight: 500; color: var(--muted); padding: 9px 0; width: 50%; }
table.kv td { padding: 9px 0; text-align: right; }
table.kv tr + tr th, table.kv tr + tr td { border-top: 1px solid var(--border); }
.avatarbox { display: flex; align-items: center; gap: 16px; }
.avatarbox img, .avatarbox .ph { width: 72px; height: 72px; border-radius: 50%; object-fit: cover; background: var(--surface-hover); display: flex; align-items: center; justify-content: center; color: var(--muted); font-weight: 600; font-size: 24px; }
.kv { display: grid; grid-template-columns: 200px 1fr; gap: 8px 16px; }
.kv div:nth-child(odd) { color: var(--muted); }
code, .mono { font-family: "Cascadia Code", "SFMono-Regular", Consolas, monospace; font-size: 12.5px; }
.copy { display: inline-flex; align-items: center; gap: 6px; }
.copy button { border: none; background: transparent; cursor: pointer; color: var(--muted); padding: 2px; border-radius: 4px; }
.copy button:hover { background: var(--surface-hover); color: var(--tint); }
.copy button svg { width: 14px; height: 14px; }
.dns td { font-size: 12.5px; }
.dns td.value { word-break: break-all; max-width: 520px; }

/* ---------- flyout panel (like the Exchange Admin Center) ---------- */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.18); z-index: 80; }
.panel {
  position: fixed; top: 0; right: 0; bottom: 0; width: 560px; max-width: 100vw; z-index: 90;
  background: var(--surface-solid); box-shadow: -8px 0 32px rgba(0,0,0,.18); display: flex; flex-direction: column;
  animation: slide .18s ease-out;
}
@keyframes slide { from { transform: translateX(30px); opacity: 0; } }
.panel .head { padding: 20px 24px 8px; display: flex; gap: 12px; align-items: flex-start; }
.panel .head h2 { margin: 0; font-size: 20px; font-weight: 600; word-break: break-all; }
.panel .head .close { margin-left: auto; }
.panel .tabs { display: flex; gap: 4px; padding: 0 20px; border-bottom: 1px solid var(--border); overflow-x: auto; }
.panel .tabs button { border: none; background: none; padding: 10px 10px; cursor: pointer; position: relative; white-space: nowrap; color: var(--muted); }
.panel .tabs button.on { color: var(--text); font-weight: 600; }
.panel .tabs button.on::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: -1px; height: 2px; background: var(--tint); border-radius: 2px; }
.panel .content { padding: 18px 24px; overflow-y: auto; flex: 1; }
.panel .foot { padding: 14px 24px; border-top: 1px solid var(--border); display: flex; gap: 8px; }
.panel .foot:empty { display: none; }
.section { margin-bottom: 22px; }
.section h3 { font-size: 14px; margin: 0 0 8px; font-weight: 600; }
.row { display: flex; gap: 8px; align-items: center; }
.row .field { flex: 1; margin-bottom: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 10px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 4px 3px 10px; border-radius: 14px; background: var(--surface-hover); border: 1px solid var(--border); font-size: 13px; }
.chip button { border: none; background: transparent; cursor: pointer; color: var(--muted); width: 20px; height: 20px; border-radius: 10px; }
.chip button:hover { background: var(--border); color: var(--danger); }
.secret { padding: 12px 14px; border-radius: 8px; background: var(--tint-soft); border: 1px solid color-mix(in srgb, var(--tint) 30%, transparent); margin: 10px 0; }
.secret code { font-size: 15px; user-select: all; }

.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); padding: 10px 18px; z-index: 200; background: #1b1f27; color: #fff; border-radius: 8px; box-shadow: var(--shadow); }
.toast.bad { background: var(--danger); }

@media (max-width: 860px) {
  .body { grid-template-columns: 1fr; }
  nav.side { display: flex; overflow-x: auto; padding: 6px; border-bottom: 1px solid var(--border); }
  nav.side .group { display: none; }
  nav.side a { white-space: nowrap; }
  main { padding: 16px; }
  .hide-sm { display: none; }
  .kv { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div id="login" class="hidden">
  <form class="card glass" id="loginForm" autocomplete="on">
    <img src="/admin/logo.svg" alt="">
    <h1 data-t="adminCenter"></h1>
    <p class="sub" data-t="signInLead"></p>
    <div class="field"><label for="le" data-t="email"></label><input id="le" type="email" autocomplete="username" required></div>
    <div class="field"><label for="lp" data-t="password"></label><input id="lp" type="password" autocomplete="current-password" required></div>
    <div class="field hidden" id="lcWrap"><label for="lc" data-t="signInCode"></label><input id="lc" inputmode="numeric" autocomplete="one-time-code" placeholder="123456"></div>
    <div class="error" id="loginError"></div>
    <button class="btn primary" style="width:100%;justify-content:center" data-t="signIn"></button>
  </form>
</div>

<div id="app" class="hidden">
  <header class="top">
    <img src="/admin/logo.svg" alt="">
    <div class="title">Ondura Server<span data-t="adminCenter"></span></div>
    <div class="spacer"></div>
    <div class="host hide-sm" id="hostName"></div>
    <button class="avatar" id="avatar" aria-label="Account"></button>
  </header>
  <div class="menu glass hidden" id="menu">
    <div class="who" id="menuName"></div>
    <div class="mail" id="menuMail"></div>
    <div class="lang"><button class="btn" data-lang="de">Deutsch</button><button class="btn" data-lang="en">English</button></div>
    <button class="btn" style="width:100%;justify-content:center" id="logout" data-t="signOut"></button>
  </div>
  <div class="body">
    <nav class="side" id="nav"></nav>
    <main id="main"></main>
  </div>
</div>

<div id="overlay"></div>

function toast(msg, bad) {
  const el = document.createElement("div");
  el.className = "toast" + (bad ? " bad" : "");
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), bad ? 5000 : 2200);
}

async function api(method, path, body) {
  const res = await fetch("/admin/api" + path, {
    method, credentials: "same-origin",
    headers: { "Content-Type": "application/json", "X-Ondura-Admin": "1" },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  let data = null;
  try { data = await res.json(); } catch (e) { data = null; }
  if (res.status === 401 && path !== "/login") { showLogin(); throw new Error("unauthorized"); }
  if (!res.ok) { const msg = (data && data.error) || res.statusText; const err = new Error(msg); err.data = data; throw err; }
  return data;
}
const guard = (fn) => async (...a) => { try { await fn(...a); } catch (e) { if (e.message !== "unauthorized") toast(e.message, true); } };

document.addEventListener("click", (e) => {
  const c = e.target.closest("[data-copy]");
  if (c) { navigator.clipboard && navigator.clipboard.writeText(c.dataset.copy).then(() => toast(t("copied"))); }
});

// ------------------------------------------------------------ login
function showLogin() {
  $("#app").classList.add("hidden");
  $("#login").classList.remove("hidden");
  closePanel();
  $("#le").focus();
}
$("#loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("#loginError").textContent = "";
  const code = $("#lc").value.trim();
  try {
    await api("POST", "/login", { email: $("#le").value, password: $("#lp").value, code: code || undefined });
    $("#lp").value = ""; $("#lc").value = ""; $("#lcWrap").classList.add("hidden");
    start();
  } catch (err) {
    // Two-step sign-in: the password was right, now the code is needed.
    if (err.data && err.data.mfa) {
      const first = $("#lcWrap").classList.contains("hidden");
      $("#lcWrap").classList.remove("hidden"); $("#lc").value = ""; $("#lc").focus();
      if (first) return;
    }
    $("#loginError").textContent = err.message;
  }
});

      opt("setCollab", e.collabEnabled, t("optCollab"), t("optCollabHint")) +
    '</div>' +
    '<div class="glass card"><h2>' + esc(t("secInfra")) + '</h2><p class="hint" style="margin-bottom:10px">' + esc(t("infraHint")) + '</p>' +
      '<table class="kv">' +
        kv(t("infHostname"), r.hostname) +
        kv(t("infBackend"), r.backend) +
        kv(t("infTimezone"), r.timeZone) +
        kv(t("infMaxSize"), Math.round(r.maxMessageSize / 1048576) + " MB") +
        kv(t("infWebmail"), yn(r.webmail)) +
        kv(t("infAdmin"), yn(r.adminCenter)) +
        kv(t("infRelay"), yn(r.relay)) +
        kv(t("infSpam"), yn(r.spamFilter)) +
        kv(t("infVerify"), yn(r.verifyIncoming)) +
      '</table>' +
    '</div>';
  const save = async (patch) => { await api("PATCH", "/settings", patch); toast(t("settingsSaved")); };
  $("#setProvisioning").onchange = guard(async () => save({ activesyncProvisioning: $("#setProvisioning").checked }));
  $("#setRequirePw").onchange = guard(async () => save({ activesyncRequirePassword: $("#setRequirePw").checked }));
  $("#setCollab").onchange = guard(async () => save({ collabEnabled: $("#setCollab").checked }));
}

// ------------------------------------------------------------ audit
async function pageAudit() {
  const list = await api("GET", "/audit");
  main().innerHTML = heading(t("audit"), t("auditLead")) +
    '<div class="glass tablecard"><table class="list"><thead><tr><th>' + esc(t("time")) + "</th><th>" + esc(t("actor")) + "</th><th>" + esc(t("action")) + '</th><th class="hide-sm">' + esc(t("details")) + "</th></tr></thead><tbody>" +
    (list.length ? list.map((a) => "<tr><td>" + esc(fmtTime(a.time)) + "</td><td>" + esc(a.actor) + '</td><td><span class="badge">' + esc(a.action) + '</span></td><td class="hide-sm muted">' + esc(a.detail) + "</td></tr>").join("") :
      '<tr><td colspan="4" class="empty">' + esc(t("none")) + "</td></tr>") + "</tbody></table></div>";
}

applyTexts();
start();
</script>
</body>
