[package]
name = "ondura-server"
description = "Mail server with Exchange ActiveSync and Exchange Web Services"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
axum = "0.8.9"
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
clap = { version = "4.6.9", features = ["derive", "env"] }
futures = "0.3.34"
hex = "0.4.3"
hickory-resolver = { version = "0.26.3", features = ["tokio"] }
hyper = { version = "1.12.0", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio", "server-auto", "service"] }
mail-auth = { version = "0.13", features = ["generate"] }
mail-parser = "0.11.9"
ondura-wbxml = { path = "../wbxml" }
quick-xml = "0.38"
rand = "0.10.4"
rusqlite = { version = "0.43.0", features = ["bundled"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
toml = "1.2.2"
tower = { version = "0.5.3", features = ["util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.3", features = ["v4", "v5"] }
webpki-roots = "1.0.12"

[package.metadata.deb]
name = "ondura-server"
maintainer = "Niklas Linz <niklas.linz@mirranet.de>"
copyright = "2026, Niklas Linz"
license-file = ["../../LICENSE", "0"]
extended-description = """\
Mail server for mail, calendars, contacts and tasks with Exchange ActiveSync \
and Exchange Web Services: works with Ondura Mail, Outlook for iOS and \
Android, the mail apps of iOS and Android and EWS clients. Includes SMTP \
with DKIM, SPF and DMARC, Autodiscover and a web-based Admin Center."""
section = "mail"
priority = "optional"
depends = "$auto, adduser"
recommends = "certbot"
assets = [
    ["target/release/ondura-server", "usr/bin/", "755"],
    ["../../packaging/certbot-deploy-hook.sh", "usr/share/ondura-server/certbot-deploy-hook.sh", "755"],
    ["../../README.md", "usr/share/doc/ondura-server/README.md", "644"],
    ["../../docs/admin.md", "usr/share/doc/ondura-server/admin.md", "644"],
    ["../../THIRD-PARTY-NOTICES.txt", "usr/share/doc/ondura-server/THIRD-PARTY-NOTICES.txt", "644"],
]
maintainer-scripts = "../../packaging/debian/"
systemd-units = { unit-name = "ondura-server", unit-scripts = "../../packaging", enable = true, start = false }
